<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>精緻布偶 AR - 多重手勢控制</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: none; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        #videoInput, #canvasOutput {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain; 
            background: #000;
        }
        #videoInput { 
            z-index: 1; 
            opacity: 0.4; 
            -webkit-transform: scaleX(-1); 
            transform: scaleX(-1); 
        }
        #canvasOutput { z-index: 2; pointer-events: none; }

        #info-panel {
            position: absolute;
            bottom: calc(15px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 11px;
            line-height: 1.6;
            z-index: 10;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
            max-width: 90%;
        }
        #info-panel strong { color: #ffd700; }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 200;
            padding: 20px;
            text-align: center;
        }
        #start-overlay h1 { 
            font-size: 2.5rem; 
            margin-bottom: 1rem; 
            background: linear-gradient(to right, #ffd700, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #start-overlay p { font-size: 0.95rem; color: #ccc; line-height: 1.8; margin-bottom: 10px; max-width: 340px;}
        .btn-start {
            margin-top: 20px;
            padding: 15px 50px;
            background: linear-gradient(to right, #ffd700, #ff6b6b);
            color: #000;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }
        .hidden { display: none !important; }
        
        #status {
            position: absolute;
            top: calc(15px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            color: #0f0;
            font-size: 13px;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <video id="videoInput" autoplay playsinline muted></video>
    <canvas id="canvasOutput"></canvas>
    <div id="status">準備啟動...</div>

    <div id="info-panel">
        <strong>🎭 手勢控制指南</strong><br>
        食指彎曲 → 左眼閉合 | 中指彎曲 → 右眼閉合<br>
        拇指上翹 → 耳朵豎起 | 拇指+尾指張開 → 大笑
    </div>

    <div id="start-overlay">
        <h1>🎨 精緻布偶 AR</h1>
        <p>將手掌對準鏡頭，布偶會套在你的手上！<br>用不同的手勢控制布偶的表情。</p>
        <p style="font-size: 0.85rem; color: #ffd700; margin-top: 15px; border: 1px dashed #ffd700; padding: 12px; border-radius: 10px; line-height: 1.8;">
            ✨ <strong>互動功能</strong>：<br>
            👆 食指彎曲 → 閉左眼<br>
            ☝️ 中指彎曲 → 閉右眼<br>
            👍 拇指上翹 → 耳朵豎起<br>
            🤙 拇指+尾指張開 → 開心大笑
        </p>
        <button class="btn-start">啟動鏡頭</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        const statusEl = document.getElementById('status');
        const videoElement = document.getElementById('videoInput');
        const canvasElement = document.getElementById('canvasOutput');
        const canvasCtx = canvasElement.getContext('2d');

        let dpr = window.devicePixelRatio || 1;

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            const width = window.innerWidth;
            const height = window.innerHeight;
            canvasElement.style.width = width + 'px';
            canvasElement.style.height = height + 'px';
            canvasElement.width = width * dpr;
            canvasElement.height = height * dpr;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 平滑濾波
        function lerp(start, end, factor) { return start + (end - start) * factor; }
        let smoothState = { 
            x: 0, y: 0, scale: 1, angle: 0,
            leftEye: 1, rightEye: 1, earAngle: 0, smile: 0.3
        };
        let isTracking = false;

        // 精緻布偶繪製
        function drawPuppet(ctx, x, y, scale, rotation, leftEyeOpen, rightEyeOpen, earAngle, smileLevel) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.scale(scale, scale);
            
            // 陰影
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 25;
            ctx.shadowOffsetY = 15;

            // 頭部主體（漸層）
            const headGradient = ctx.createRadialGradient(0, -20, 10, 0, 0, 100);
            headGradient.addColorStop(0, '#FFB347');
            headGradient.addColorStop(0.7, '#FF8C42');
            headGradient.addColorStop(1, '#D2691E');
            ctx.fillStyle = headGradient;
            ctx.beginPath();
            ctx.ellipse(0, 0, 85, 100, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowColor = 'transparent';

            // 耳朵（動態旋轉）
            ctx.save();
            ctx.translate(-60, -75);
            ctx.rotate(earAngle - 0.3);
            const earGradient = ctx.createRadialGradient(0, 0, 5, 0, 0, 30);
            earGradient.addColorStop(0, '#FF8C42');
            earGradient.addColorStop(1, '#D2691E');
            ctx.fillStyle = earGradient;
            ctx.beginPath();
            ctx.ellipse(0, 0, 25, 35, -0.3, 0, Math.PI * 2);
            ctx.fill();
            // 內耳
            ctx.fillStyle = '#FFB6C1';
            ctx.beginPath();
            ctx.ellipse(0, 0, 12, 18, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.translate(60, -75);
            ctx.rotate(-earAngle + 0.3);
            ctx.fillStyle = earGradient;
            ctx.beginPath();
            ctx.ellipse(0, 0, 25, 35, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFB6C1';
            ctx.beginPath();
            ctx.ellipse(0, 0, 12, 18, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 臉頰紅暈
            ctx.fillStyle = 'rgba(255, 105, 180, 0.4)';
            ctx.beginPath();
            ctx.arc(-45, 20, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(45, 20, 18, 0, Math.PI * 2);
            ctx.fill();

            // 左眼
            ctx.save();
            ctx.translate(-30, -15);
            // 眼白
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.ellipse(0, 0, 18, 22 * leftEyeOpen, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            if (leftEyeOpen > 0.3) {
                // 瞳孔
                ctx.fillStyle = '#2C3E50';
                ctx.beginPath();
                ctx.arc(0, 2, 10, 0, Math.PI * 2);
                ctx.fill();
                // 高光
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(3, -2, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-2, 3, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 睫毛
            if (leftEyeOpen < 0.5) {
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-15, 0);
                ctx.lineTo(15, 0);
                ctx.stroke();
            }
            ctx.restore();

            // 右眼
            ctx.save();
            ctx.translate(30, -15);
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.ellipse(0, 0, 18, 22 * rightEyeOpen, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            if (rightEyeOpen > 0.3) {
                ctx.fillStyle = '#2C3E50';
                ctx.beginPath();
                ctx.arc(0, 2, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(3, -2, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-2, 3, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            if (rightEyeOpen < 0.5) {
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-15, 0);
                ctx.lineTo(15, 0);
                ctx.stroke();
            }
            ctx.restore();

            // 鼻子
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.ellipse(0, 15, 8, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // 嘴巴（動態笑容）
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            const mouthWidth = 25 + smileLevel * 15;
            const mouthCurve = 5 + smileLevel * 20;
            ctx.moveTo(-mouthWidth, 35);
            ctx.quadraticCurveTo(0, 35 + mouthCurve, mouthWidth, 35);
            ctx.stroke();

            // 大笑時露出舌頭
            if (smileLevel > 0.6) {
                ctx.fillStyle = '#FF69B4';
                ctx.beginPath();
                ctx.ellipse(0, 45, 12, 8, 0, 0, Math.PI);
                ctx.fill();
            }

            // 蝴蝶結裝飾
            ctx.fillStyle = '#FF6B6B';
            ctx.beginPath();
            ctx.ellipse(-15, -95, 12, 8, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(15, -95, 12, 8, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(0, -95, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function onResults(results) {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.save();
            canvasCtx.scale(dpr, dpr);
            canvasCtx.scale(-1, 1);
            canvasCtx.translate(-window.innerWidth, 0);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const W = window.innerWidth;
                const H = window.innerHeight;
                
                const wrist = landmarks[0];
                const indexMcp = landmarks[5];
                const pinkyMcp = landmarks[17];
                const middleMcp = landmarks[9];
                
                const indexTip = landmarks[8];
                const indexPip = landmarks[6];
                const middleTip = landmarks[12];
                const middlePip = landmarks[10];
                const thumbTip = landmarks[4];
                const thumbIp = landmarks[3];
                const pinkyTip = landmarks[20];

                // 1. 計算中心位置
                const cx = (wrist.x + middleMcp.x) / 2;
                const cy = (wrist.y + middleMcp.y) / 2;

                // 2. 計算縮放
                const dxW = pinkyMcp.x - indexMcp.x;
                const dyW = pinkyMcp.y - indexMcp.y;
                const handWidth = Math.sqrt(dxW*dxW + dyW*dyW);
                const scale = (handWidth / 0.15) * 1.8;

                // 3. 計算旋轉
                const dirX = middleMcp.x - wrist.x;
                const dirY = middleMcp.y - wrist.y;
                const angle = Math.atan2(dirY, dirX) + Math.PI / 2;

                // 4. 食指彎曲度 -> 左眼
                const indexDx = indexTip.x - indexPip.x;
                const indexDy = indexTip.y - indexPip.y;
                const indexDist = Math.sqrt(indexDx*indexDx + indexDy*indexDy);
                let leftEyeOpen = Math.max(0, Math.min(1, (indexDist - 0.03) / 0.08));

                // 5. 中指彎曲度 -> 右眼
                const middleDx = middleTip.x - middlePip.x;
                const middleDy = middleTip.y - middlePip.y;
                const middleDist = Math.sqrt(middleDx*middleDx + middleDy*middleDy);
                let rightEyeOpen = Math.max(0, Math.min(1, (middleDist - 0.03) / 0.08));

                // 6. 拇指位置 -> 耳朵角度
                const thumbAngle = Math.atan2(thumbTip.y - thumbIp.y, thumbTip.x - thumbIp.x);
                let earAngle = (thumbAngle + Math.PI / 2) * 0.5;
                earAngle = Math.max(-0.5, Math.min(0.5, earAngle));

                // 7. 拇指與尾指距離 -> 笑容
                const thumbPinkyDx = thumbTip.x - pinkyTip.x;
                const thumbPinkyDy = thumbTip.y - pinkyTip.y;
                const thumbPinkyDist = Math.sqrt(thumbPinkyDx*thumbPinkyDx + thumbPinkyDy*thumbPinkyDy);
                let smile = Math.max(0, Math.min(1, (thumbPinkyDist - 0.08) / 0.15));

                // 平滑處理
                if (!isTracking) {
                    smoothState = { 
                        x: cx, y: cy, scale: scale, angle: angle,
                        leftEye: leftEyeOpen, rightEye: rightEyeOpen, 
                        earAngle: earAngle, smile: smile
                    };
                    isTracking = true;
                } else {
                    smoothState.x = lerp(smoothState.x, cx, 0.4);
                    smoothState.y = lerp(smoothState.y, cy, 0.4);
                    smoothState.scale = lerp(smoothState.scale, scale, 0.3);
                    smoothState.angle = lerp(smoothState.angle, angle, 0.3);
                    smoothState.leftEye = lerp(smoothState.leftEye, leftEyeOpen, 0.4);
                    smoothState.rightEye = lerp(smoothState.rightEye, rightEyeOpen, 0.4);
                    smoothState.earAngle = lerp(smoothState.earAngle, earAngle, 0.3);
                    smoothState.smile = lerp(smoothState.smile, smile, 0.4);
                }

                drawPuppet(
                    canvasCtx, 
                    smoothState.x * W, 
                    smoothState.y * H, 
                    smoothState.scale, 
                    smoothState.angle,
                    smoothState.leftEye,
                    smoothState.rightEye,
                    smoothState.earAngle,
                    smoothState.smile
                );
                
                statusEl.innerText = "追蹤中... 試試不同手勢！";
                statusEl.style.color = "#0f0";

            } else {
                isTracking = false;
                statusEl.innerText = "請將手掌對準鏡頭";
                statusEl.style.color = "#ff0";
            }

            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        async function processFrame() {
            if (videoElement.readyState >= 2) {
                await hands.send({image: videoElement});
            }
            requestAnimationFrame(processFrame);
        }

        document.querySelector('.btn-start').addEventListener('click', async () => {
            document.getElementById('start-overlay').classList.add('hidden');
            statusEl.innerText = "啟動鏡頭中...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                
                videoElement.srcObject = stream;
                
                videoElement.onloadeddata = async () => {
                    try { await videoElement.play(); } catch(e) { console.warn(e); }
                    statusEl.innerText = "就緒！請伸出手掌";
                    processFrame();
                };
            } catch (err) {
                console.error(err);
                statusEl.innerText = "啟動失敗";
                statusEl.style.color = "red";
            }
        });
    </script>
</body>
</html>
