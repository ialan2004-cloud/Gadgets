<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🫧 泡泡大作戰 - 修復版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Marker Felt', -apple-system, sans-serif;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background: linear-gradient(180deg, #87CEEB 0%, #FFB6C1 50%, #FFD700 100%);
        }

        /* 移除鏡像處理，保持真實視角 */
        #videoInput, #canvasOutput {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        #videoInput { z-index: 1; opacity: 0.25; filter: blur(3px) brightness(1.1); }
        #canvasOutput { z-index: 2; pointer-events: none; }

        /* HUD */
        #hud-top {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top));
            left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
            gap: 8px;
        }
        .hud-card {
            background: rgba(255, 255, 255, 0.85);
            border: 3px solid #FF69B4;
            border-radius: 20px;
            padding: 8px 14px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            text-align: center;
            flex: 1;
        }
        .hud-label {
            font-size: 10px;
            color: #FF1493;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .hud-value {
            font-size: 22px;
            color: #FF1493;
            font-weight: bold;
            text-shadow: 2px 2px 0 #FFF, 3px 3px 0 rgba(255, 105, 180, 0.3);
        }

        /* 連擊顯示 */
        #combo-display {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%) scale(0);
            font-size: 60px;
            font-weight: bold;
            color: #FF6B00;
            text-shadow: 3px 3px 0 #FFF, 5px 5px 0 rgba(255, 107, 0, 0.5);
            z-index: 15;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        #combo-display.show {
            transform: translateX(-50%) scale(1);
        }

        /* 等級提示 */
        #level-up {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 40px;
            font-weight: bold;
            background: linear-gradient(45deg, #FFD700, #FF69B4, #00BFFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            z-index: 15;
            pointer-events: none;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        #level-up.show {
            transform: translate(-50%, -50%) scale(1.2);
        }

        /* 屏幕特效層 */
        #screen-effects {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
        }
        
        .screen-flash {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: white;
            opacity: 0;
            animation: flash 0.3s ease-out;
        }
        @keyframes flash {
            0% { opacity: 0.6; }
            100% { opacity: 0; }
        }

        .screen-shake {
            animation: shake 0.3s ease-out;
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-10px, -5px); }
            50% { transform: translate(10px, 5px); }
            75% { transform: translate(-5px, 10px); }
        }

        .screen-vignette {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(255, 0, 0, 0.3) 100%);
            opacity: 0;
            animation: vignette 0.5s ease-out;
        }
        @keyframes vignette {
            0% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        /* 開始畫面 */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #FF9A9E 0%, #FAD0C4 50%, #FBC2EB 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }
        #start-screen h1 {
            font-size: 3rem;
            color: #FFF;
            text-shadow: 3px 3px 0 #FF1493, 6px 6px 0 rgba(0,0,0,0.2);
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        #start-screen .mascot {
            font-size: 80px;
            margin: 20px 0;
            animation: wiggle 3s infinite;
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        #start-screen p {
            font-size: 1.1rem;
            color: #FFF;
            text-shadow: 2px 2px 0 rgba(255, 20, 147, 0.5);
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .btn-start {
            margin-top: 20px;
            padding: 18px 50px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #FFF;
            border: 4px solid #FFF;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: inherit;
            box-shadow: 0 8px 20px rgba(255, 165, 0, 0.5), inset 0 -4px 0 rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-start:active {
            transform: scale(0.95);
        }
        .hidden { display: none !important; }

        /* 結算畫面 */
        #game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        #game-over.show { display: flex; }
        #game-over h2 {
            font-size: 2.5rem;
            color: #FFD700;
            text-shadow: 3px 3px 0 #FF1493;
            margin-bottom: 20px;
        }
        .final-stats {
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #FF69B4;
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 20px;
            min-width: 280px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 1.2rem;
            color: #333;
        }
        .stat-row .label { color: #888; }
        .stat-row .value { color: #FF1493; font-weight: bold; }
        .badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }
        .badge {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #FFF;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* 時間條 */
        #time-bar-container {
            position: absolute;
            bottom: calc(15px + env(safe-area-inset-bottom));
            left: 15px; right: 15px;
            height: 14px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid #FFF;
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
            pointer-events: none;
        }
        #time-bar {
            height: 100%;
            background: linear-gradient(90deg, #00FF00, #FFFF00, #FF69B4);
            width: 100%;
            transition: width 0.1s linear;
            border-radius: 8px;
        }
        #time-text {
            position: absolute;
            bottom: calc(35px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            color: #FFF;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #FF1493;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <video id="videoInput" autoplay playsinline muted></video>
    <canvas id="canvasOutput"></canvas>
    <div id="screen-effects"></div>

    <!-- HUD -->
    <div id="hud-top">
        <div class="hud-card">
            <div class="hud-label">⭐ 分數</div>
            <div class="hud-value" id="score">0</div>
        </div>
        <div class="hud-card">
            <div class="hud-label">🏆 等級</div>
            <div class="hud-value" id="level">Lv.1</div>
        </div>
        <div class="hud-card">
            <div class="hud-label">🎯 連擊</div>
            <div class="hud-value" id="combo">0</div>
        </div>
    </div>

    <div id="combo-display"></div>
    <div id="level-up"></div>
    <div id="time-text">60</div>
    <div id="time-bar-container"><div id="time-bar"></div></div>

    <!-- 開始畫面 -->
    <div id="start-screen">
        <h1>泡泡大作戰</h1>
        <div class="mascot">🫧</div>
        <p>用你的手指戳破飛來的泡泡！<br>小心黑色的炸彈泡泡喔 💣</p>
        <p style="font-size: 0.9rem; color: #FFF; opacity: 0.9;">
            🌟 金色泡泡 = 50分<br>
            🌈 彩虹泡泡 = 100分<br>
            ⏱️ 時鐘泡泡 = 時間變慢<br>
            💣 炸彈泡泡 = 要躲開！
        </p>
        <button class="btn-start" id="btn-start">開始遊戲！</button>
    </div>

    <!-- 結算畫面 -->
    <div id="game-over">
        <h2>🎉 遊戲結束！</h2>
        <div class="final-stats">
            <div class="stat-row">
                <span class="label">最終分數</span>
                <span class="value" id="final-score">0</span>
            </div>
            <div class="stat-row">
                <span class="label">戳破泡泡</span>
                <span class="value" id="final-popped">0</span>
            </div>
            <div class="stat-row">
                <span class="label">最高連擊</span>
                <span class="value" id="final-combo">0</span>
            </div>
            <div class="stat-row">
                <span class="label">最終等級</span>
                <span class="value" id="final-level">Lv.1</span>
            </div>
            <div class="badges" id="badges"></div>
        </div>
        <button class="btn-start" id="btn-restart">再玩一次！</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>

    <script>
        // ============ 遊戲狀態 ============
        const GAME_DURATION = 60;
        let gameState = {
            score: 0,
            combo: 0,
            maxCombo: 0,
            level: 1,
            popped: 0,
            timeLeft: GAME_DURATION,
            slowMotion: false,
            slowMotionEnd: 0,
            running: false,
            lastComboTime: 0
        };

        // ============ 增強音效系統 ============
        let audioReady = false;
        
        // 泡泡爆破音效（更清脆）
        const popSynth = new Tone.MembraneSynth({
            pitchDecay: 0.01,
            octaves: 6,
            envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.05 }
        }).toDestination();
        popSynth.volume.value = -8;

        // 連擊音效（音調遞增）
        const comboSynth = new Tone.Synth({
            oscillator: { type: "triangle8" },
            envelope: { attack: 0.005, decay: 0.1, sustain: 0.3, release: 0.4 }
        }).toDestination();
        comboSynth.volume.value = -6;

        // 特殊泡泡音效（魔法和弦）
        const specialSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.01, decay: 0.4, sustain: 0.4, release: 0.8 }
        }).toDestination();
        specialSynth.volume.value = -5;

        // 炸彈音效（低沉爆炸）
        const bombSynth = new Tone.MembraneSynth({
            pitchDecay: 0.05,
            octaves: 8,
            envelope: { attack: 0.001, decay: 0.5, sustain: 0.2, release: 0.3 }
        }).toDestination();
        bombSynth.volume.value = -4;

        // 升級音效（歡呼）
        const levelUpSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sawtooth" },
            envelope: { attack: 0.01, decay: 0.2, sustain: 0.5, release: 1 }
        }).toDestination();
        levelUpSynth.volume.value = -6;

        // 遊戲結束音效
        const gameOverSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.05, decay: 0.3, sustain: 0.4, release: 1.5 }
        }).toDestination();
        gameOverSynth.volume.value = -5;

        function playPopSound(pitch = 'C5') {
            if (!audioReady) return;
            popSynth.triggerAttackRelease(pitch, '32n', Tone.now());
        }

        function playComboSound(combo) {
            if (!audioReady) return;
            const notes = ['C5', 'E5', 'G5', 'B5', 'C6', 'D6', 'E6'];
            const note = notes[Math.min(combo - 1, notes.length - 1)];
            comboSynth.triggerAttackRelease(note, '8n', Tone.now());
        }

        function playSpecialSound(type) {
            if (!audioReady) return;
            if (type === 'gold') {
                specialSynth.triggerAttackRelease(['C5', 'E5', 'G5'], '4n', Tone.now());
            } else if (type === 'rainbow') {
                specialSynth.triggerAttackRelease(['C5', 'E5', 'G5', 'B5'], '2n', Tone.now());
            } else if (type === 'clock') {
                specialSynth.triggerAttackRelease(['G4', 'C5'], '4n', Tone.now());
            }
        }

        function playBombSound() {
            if (!audioReady) return;
            bombSynth.triggerAttackRelease('C2', '2n', Tone.now());
        }

        function playLevelUpSound() {
            if (!audioReady) return;
            levelUpSynth.triggerAttackRelease(['C5', 'E5', 'G5', 'C6'], '2n', Tone.now());
        }

        function playGameOverSound() {
            if (!audioReady) return;
            gameOverSynth.triggerAttackRelease(['C5', 'E5', 'G5'], '1n', Tone.now());
        }

        // ============ 屏幕特效系統 ============
        const screenEffects = document.getElementById('screen-effects');

        function triggerScreenFlash(color = 'white') {
            const flash = document.createElement('div');
            flash.className = 'screen-flash';
            flash.style.background = color;
            screenEffects.appendChild(flash);
            setTimeout(() => flash.remove(), 300);
        }

        function triggerScreenShake() {
            document.body.classList.add('screen-shake');
            setTimeout(() => document.body.classList.remove('screen-shake'), 300);
        }

        function triggerScreenVignette(color = 'rgba(255, 0, 0, 0.3)') {
            const vignette = document.createElement('div');
            vignette.className = 'screen-vignette';
            vignette.style.background = `radial-gradient(circle, transparent 50%, ${color} 100%)`;
            screenEffects.appendChild(vignette);
            setTimeout(() => vignette.remove(), 500);
        }

        // ============ Canvas 設定 ============
        const videoElement = document.getElementById('videoInput');
        const canvasElement = document.getElementById('canvasOutput');
        const canvasCtx = canvasElement.getContext('2d');
        let dpr = window.devicePixelRatio || 1;
        let W = window.innerWidth, H = window.innerHeight;

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            W = window.innerWidth;
            H = window.innerHeight;
            canvasElement.style.width = W + 'px';
            canvasElement.style.height = H + 'px';
            canvasElement.width = W * dpr;
            canvasElement.height = H * dpr;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ============ 泡泡系統 ============
        const bubbles = [];
        const particles = [];
        const floatingTexts = [];
        
        const BUBBLE_TYPES = {
            normal: { color: '#FF69B4', points: 10, weight: 60 },
            blue: { color: '#00BFFF', points: 10, weight: 20 },
            green: { color: '#32CD32', points: 10, weight: 15 },
            gold: { color: '#FFD700', points: 50, weight: 8, special: 'gold' },
            rainbow: { color: 'rainbow', points: 100, weight: 3, special: 'rainbow' },
            clock: { color: '#4169E1', points: 20, weight: 4, special: 'clock' },
            bomb: { color: '#2C2C2C', points: -30, weight: 5, special: 'bomb' }
        };

        function getRandomBubbleType() {
            const types = Object.keys(BUBBLE_TYPES);
            const totalWeight = types.reduce((sum, t) => sum + BUBBLE_TYPES[t].weight, 0);
            let r = Math.random() * totalWeight;
            for (const t of types) {
                r -= BUBBLE_TYPES[t].weight;
                if (r <= 0) return t;
            }
            return 'normal';
        }

        function spawnBubble() {
            const type = getRandomBubbleType();
            const config = BUBBLE_TYPES[type];
            const radius = 25 + Math.random() * 20;
            
            const side = Math.floor(Math.random() * 4);
            let x, y, vx, vy;
            const speed = (1 + gameState.level * 0.3) * (0.5 + Math.random() * 0.8);
            
            if (side === 0) {
                x = Math
