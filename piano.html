<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title> 手部追蹤遊戲廳 v2.0.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Marker Felt', -apple-system, sans-serif;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #videoInput, #canvasOutput {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #videoInput { opacity: 0; }
        #canvasOutput { z-index: 2; pointer-events: none; }

        /* 主頁 */
        #home-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        #home-screen.hidden { display: none; }
        
        .home-title {
            font-size: 2.5rem;
            color: #FFF;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
            margin-bottom: 10px;
            text-align: center;
        }
        .home-subtitle {
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 30px;
            text-align: center;
        }
        .home-version {
            position: absolute;
            top: calc(15px + env(safe-area-inset-top));
            right: 15px;
            background: rgba(255,255,255,0.2);
            color: #FFF;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
        }

        .game-cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }
        .game-card {
            background: rgba(255,255,255,0.95);
            border-radius: 25px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 20px;
            border: 4px solid transparent;
        }
        .game-card:active {
            transform: scale(0.95);
        }
        .game-card.bubble { border-color: #FF69B4; }
        .game-card.racing { border-color: #FF4500; }
        
        .game-icon {
            font-size: 4rem;
            min-width: 80px;
            text-align: center;
        }
        .game-info { flex: 1; }
        .game-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .game-desc {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.4;
        }
        .game-tag {
            display: inline-block;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #FFF;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 8px;
        }
        .game-tag.new {
            background: linear-gradient(135deg, #FF4500, #FF6347);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* 遊戲 HUD */
        #game-hud {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: calc(10px + env(safe-area-inset-top)) 10px 10px;
            display: none;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }
        #game-hud.show { display: flex; }
        
        .hud-item {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 8px 12px;
            text-align: center;
            min-width: 70px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .hud-label { font-size: 10px; color: #666; font-weight: bold; }
        .hud-value { font-size: 18px; font-weight: bold; color: #333; }

        /* 能量槽 */
        #energy-bar-container {
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom));
            left: 15px; right: 15px;
            height: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
            display: none;
            border: 2px solid rgba(255,255,255,0.5);
        }
        #energy-bar-container.show { display: block; }
        #energy-bar {
            height: 100%;
            background: linear-gradient(90deg, #00BFFF, #1E90FF, #FFD700);
            width: 0%;
            transition: width 0.3s;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(30, 144, 255, 0.8);
        }
        #energy-label {
            position: absolute;
            bottom: calc(45px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            color: #FFF;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
            z-index: 10;
            display: none;
        }
        #energy-label.show { display: block; }

        /* 技能提示 */
        #skill-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #FFD700;
            padding: 15px 25px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 15;
            display: none;
            text-align: center;
            border: 3px solid #FFD700;
            animation: skillPulse 1s infinite;
        }
        #skill-hint.show { display: block; }
        @keyframes skillPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        /* 遊戲結束 */
        #game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        #game-over.show { display: flex; }
        #game-over h2 {
            font-size: 2.5rem;
            color: #FFD700;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .final-stats {
            background: rgba(255,255,255,0.95);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 20px;
            min-width: 280px;
            border: 4px solid #FF4500;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 1.1rem;
            color: #333;
        }
        .stat-row .label { color: #666; }
        .stat-row .value { color: #FF4500; font-weight: bold; }
        
        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            margin: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, #FF4500, #FF6347);
            color: #FFF;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: #FFF;
            border: 2px solid rgba(255,255,255,0.5);
        }
        .btn:active { transform: scale(0.95); }

        /* 泡泡遊戲 HUD（保留） */
        #bubble-hud {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top));
            left: 10px; right: 70px;
            display: none;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
            gap: 8px;
        }
        #bubble-hud.show { display: flex; }
        .bubble-hud-card {
            background: rgba(255, 255, 255, 0.85);
            border: 3px solid #FF69B4;
            border-radius: 20px;
            padding: 8px 14px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            text-align: center;
            flex: 1;
        }
        .bubble-hud-label { font-size: 10px; color: #FF1493; font-weight: bold; }
        .bubble-hud-value { font-size: 22px; color: #FF1493; font-weight: bold; }

        #bubble-time-text {
            position: absolute;
            bottom: calc(35px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            color: #FFF;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #FF1493;
            z-index: 10;
            display: none;
        }
        #bubble-time-text.show { display: block; }
        #bubble-time-bar-container {
            position: absolute;
            bottom: calc(15px + env(safe-area-inset-bottom));
            left: 15px; right: 15px;
            height: 14px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid #FFF;
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
            display: none;
        }
        #bubble-time-bar-container.show { display: block; }
        #bubble-time-bar {
            height: 100%;
            background: linear-gradient(90deg, #00FF00, #FFFF00, #FF69B4);
            width: 100%;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <video id="videoInput" autoplay playsinline muted></video>
    <canvas id="canvasOutput"></canvas>

    <!-- 主頁 -->
    <div id="home-screen">
        <div class="home-version">v2.0.0</div>
        <div class="home-title">🎮 手部追蹤遊戲廳</div>
        <div class="home-subtitle">用你的手玩遊戲！</div>
        
        <div class="game-cards">
            <div class="game-card bubble" onclick="startBubbleGame()">
                <div class="game-icon">🫧</div>
                <div class="game-info">
                    <div class="game-name">泡泡大作戰</div>
                    <div class="game-desc">戳破飛來的彩色泡泡，小心炸彈！</div>
                    <div class="game-tag">經典</div>
                </div>
            </div>
            
            <div class="game-card racing" onclick="startRacingGame()">
                <div class="game-icon">🏎️</div>
                <div class="game-info">
                    <div class="game-name">極速狂飆</div>
                    <div class="game-desc">握拳控制賽車，張開五指觸發技能！</div>
                    <div class="game-tag new">NEW!</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 泡泡遊戲 HUD -->
    <div id="bubble-hud">
        <div class="bubble-hud-card">
            <div class="bubble-hud-label">⭐ 分數</div>
            <div class="bubble-hud-value" id="bubble-score">0</div>
        </div>
        <div class="bubble-hud-card">
            <div class="bubble-hud-label"> 等級</div>
            <div class="bubble-hud-value" id="bubble-level">Lv.1</div>
        </div>
        <div class="bubble-hud-card">
            <div class="bubble-hud-label">🎯 連擊</div>
            <div class="bubble-hud-value" id="bubble-combo">0</div>
        </div>
    </div>
    <div id="bubble-time-text">60</div>
    <div id="bubble-time-bar-container"><div id="bubble-time-bar"></div></div>

    <!-- 賽車遊戲 HUD -->
    <div id="game-hud">
        <div class="hud-item">
            <div class="hud-label">🏆 分數</div>
            <div class="hud-value" id="racing-score">0</div>
        </div>
        <div class="hud-item">
            <div class="hud-label"> 速度</div>
            <div class="hud-value" id="racing-speed">100</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">❤️ 生命</div>
            <div class="hud-value" id="racing-lives">3</div>
        </div>
    </div>
    <div id="energy-label">⚡ 能量槽 - 張開五指觸發技能！</div>
    <div id="energy-bar-container"><div id="energy-bar"></div></div>
    <div id="skill-hint">🚀 氮氣衝刺啟動！</div>

    <!-- 遊戲結束 -->
    <div id="game-over">
        <h2 id="game-over-title">🎉 遊戲結束！</h2>
        <div class="final-stats" id="final-stats"></div>
        <button class="btn btn-primary" id="btn-restart">再玩一次！</button>
        <button class="btn btn-secondary" id="btn-home">返回主頁</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>

    <script>
        const VERSION = '2.0.0';
        console.log(`🎮 手部追蹤遊戲廳 v${VERSION} 啟動`);

        // ============ 全局狀態 ============
        let currentGame = null; // 'bubble' | 'racing' | null
        let audioReady = false;

        // ============ Canvas 設定 ============
        const videoElement = document.getElementById('videoInput');
        const canvasElement = document.getElementById('canvasOutput');
        const canvasCtx = canvasElement.getContext('2d');
        let dpr = window.devicePixelRatio || 1;
        let W = window.innerWidth, H = window.innerHeight;

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            W = window.innerWidth;
            H = window.innerHeight;
            canvasElement.style.width = W + 'px';
            canvasElement.style.height = H + 'px';
            canvasElement.width = W * dpr;
            canvasElement.height = H * dpr;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ============ 手部追蹤 ============
        let handData = {
            fistPos: null,      // 拳頭中心位置
            fingerPos: null,    // 食指指尖位置
            isOpen: false,      // 是否張開五指
            isFist: false,      // 是否握拳
            visible: false
        };

        function analyzeHand(landmarks) {
            // 拳頭中心：MCP 關節平均值
            const mcps = [5, 9, 13, 17].map(i => landmarks[i]);
            const fistX = mcps.reduce((s, p) => s + p.x, 0) / 4;
            const fistY = mcps.reduce((s, p) => s + p.y, 0) / 4;
            
            // 食指指尖
            const indexTip = landmarks[8];
            
            // 檢查是否張開五指
            const fingers = [
                { tip: 4, mcp: 2 },   // 拇指
                { tip: 8, mcp: 5 },   // 食指
                { tip: 12, mcp: 9 },  // 中指
                { tip: 16, mcp: 13 }, // 無名指
                { tip: 20, mcp: 17 }  // 尾指
            ];
            
            let openCount = 0;
            for (const f of fingers) {
                const tip = landmarks[f.tip];
                const mcp = landmarks[f.mcp];
                const wrist = landmarks[0];
                
                // 指尖到手腕的距離 vs MCP到手腕的距離
                const tipDist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
                const mcpDist = Math.hypot(mcp.x - wrist.x, mcp.y - wrist.y);
                
                if (tipDist > mcpDist * 1.3) openCount++;
            }
            
            const isOpen = openCount >= 4;
            const isFist = openCount <= 1;
            
            handData = {
                fistPos: { x: fistX * W, y: fistY * H },
                fingerPos: { x: indexTip.x * W, y: indexTip.y * H },
                isOpen,
                isFist,
                visible: true
            };
        }

        function onResults(results) {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.save();
            canvasCtx.scale(dpr, dpr);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                analyzeHand(results.multiHandLandmarks[0]);
            } else {
                handData.visible = false;
                handData.fistPos = null;
                handData.fingerPos = null;
                handData.isOpen = false;
                handData.isFist = false;
            }

            if (currentGame === 'bubble') {
                updateBubbleGame();
            } else if (currentGame === 'racing') {
                updateRacingGame();
            }

            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                videoElement.srcObject = stream;
                await videoElement.play();
                
                async function processFrame() {
                    if (videoElement.readyState >= 2) await hands.send({image: videoElement});
                    requestAnimationFrame(processFrame);
                }
                processFrame();
            } catch (err) {
                console.error('攝影機啟動失敗:', err);
                alert('無法啟動攝影機！');
            }
        }

        // ============ 遊戲切換 ============
        function startBubbleGame() {
            currentGame = 'bubble';
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('bubble-hud').classList.add('show');
            document.getElementById('bubble-time-text').classList.add('show');
            document.getElementById('bubble-time-bar-container').classList.add('show');
            document.getElementById('game-hud').classList.remove('show');
            document.getElementById('energy-bar-container').classList.remove('show');
            document.getElementById('energy-label').classList.remove('show');
            document.getElementById('skill-hint').classList.remove('show');
            initBubbleGame();
        }

        function startRacingGame() {
            currentGame = 'racing';
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('bubble-hud').classList.remove('show');
            document.getElementById('bubble-time-text').classList.remove('show');
            document.getElementById('bubble-time-bar-container').classList.remove('show');
            document.getElementById('game-hud').classList.add('show');
            document.getElementById('energy-bar-container').classList.add('show');
            document.getElementById('energy-label').classList.add('show');
            initRacingGame();
        }

        function goHome() {
            currentGame = null;
            document.getElementById('home-screen').classList.remove('hidden');
            document.getElementById('game-over').classList.remove('show');
            document.getElementById('bubble-hud').classList.remove('show');
            document.getElementById('bubble-time-text').classList.remove('show');
            document.getElementById('bubble-time-bar-container').classList.remove('show');
            document.getElementById('game-hud').classList.remove('show');
            document.getElementById('energy-bar-container').classList.remove('show');
            document.getElementById('energy-label').classList.remove('show');
            document.getElementById('skill-hint').classList.remove('show');
        }

        document.getElementById('btn-home').addEventListener('click', goHome);

        // ============ 泡泡遊戲（簡化版） ============
        let bubbleState = {
            score: 0, combo: 0, level: 1, timeLeft: 60,
            running: false, bubbles: [], particles: []
        };

        function initBubbleGame() {
            bubbleState = {
                score: 0, combo: 0, level: 1, timeLeft: 60,
                running: true, bubbles: [], particles: []
            };
            startCamera();
            requestAnimationFrame(bubbleLoop);
        }

        function bubbleLoop() {
            if (currentGame !== 'bubble') return;
            if (!bubbleState.running) return;
            
            // 簡化：只顯示手指位置
            if (handData.fingerPos) {
                canvasCtx.fillStyle = '#FF69B4';
                canvasCtx.beginPath();
                canvasCtx.arc(handData.fingerPos.x, handData.fingerPos.y, 20, 0, Math.PI * 2);
                canvasCtx.fill();
            }
            
            requestAnimationFrame(bubbleLoop);
        }

        // ============ 賽車遊戲 ============
        const SKILLS = [
            { id: 'nitro', name: '🚀 氮氣衝刺', color: '#FF4500', duration: 4000 },
            { id: 'shield', name: '🛡️ 能量護盾', color: '#1E90FF', duration: 5000 },
            { id: 'lightning', name: '⚡ 閃電破壞', color: '#FFD700', duration: 0 }
        ];

        let racingState = {
            score: 0,
            speed: 100,
            lives: 3,
            energy: 0,
            maxEnergy: 100,
            carX: W / 2,
            targetCarX: W / 2,
            obstacles: [],
            coins: [],
            crystals: [],
            particles: [],
            roadOffset: 0,
            skill: null,
            skillActive: false,
            skillEndTime: 0,
            skillCooldown: 0,
            running: false,
            lastTime: 0,
            spawnTimer: 0,
            coinTimer: 0,
            crystalTimer: 0
        };

        function initRacingGame() {
            // 隨機選擇技能
            racingState.skill = SKILLS[Math.floor(Math.random() * SKILLS.length)];
            racingState.score = 0;
            racingState.speed = 100;
            racingState.lives = 3;
            racingState.energy = 0;
            racingState.carX = W / 2;
            racingState.targetCarX = W / 2;
            racingState.obstacles = [];
            racingState.coins = [];
            racingState.crystals = [];
            racingState.particles = [];
            racingState.roadOffset = 0;
            racingState.skillActive = false;
            racingState.skillEndTime = 0;
            racingState.skillCooldown = 0;
            racingState.running = true;
            racingState.lastTime = performance.now();
            racingState.spawnTimer = 0;
            racingState.coinTimer = 0;
            racingState.crystalTimer = 0;
            
            updateRacingHUD();
            document.getElementById('energy-label').innerText = `⚡ ${racingState.skill.name} - 張開五指觸發！`;
            
            startCamera();
            requestAnimationFrame(racingLoop);
        }

        function racingLoop(timestamp) {
            if (currentGame !== 'racing') return;
            if (!racingState.running) return;
            
            const dt = Math.min(0.05, (timestamp - racingState.lastTime) / 1000);
            racingState.lastTime = timestamp;
            
            updateRacingGame(dt);
            drawRacingGame();
            
            requestAnimationFrame(racingLoop);
        }

        function updateRacingGame(dt) {
            // 車輛控制：拳頭位置
            if (handData.fistPos) {
                racingState.targetCarX = handData.fistPos.x;
            }
            // 平滑跟隨
            racingState.carX += (racingState.targetCarX - racingState.carX) * 0.15;
            racingState.carX = Math.max(40, Math.min(W - 40, racingState.carX));
            
            // 道路滾動
            racingState.roadOffset += racingState.speed * dt * 0.5;
            if (racingState.roadOffset > 100) racingState.roadOffset = 0;
            
            // 速度逐漸增加
            racingState.speed = Math.min(300, 100 + racingState.score * 0.5);
            
            // 生成障礙物
            racingState.spawnTimer += dt;
            const spawnInterval = Math.max(0.8, 2 - racingState.speed * 0.003);
            if (racingState.spawnTimer >= spawnInterval) {
                spawnObstacle();
                racingState.spawnTimer = 0;
            }
            
            // 生成硬幣
            racingState.coinTimer += dt;
            if (racingState.coinTimer >= 0.5) {
                spawnCoin();
                racingState.coinTimer = 0;
            }
            
            // 生成能量晶體
            racingState.crystalTimer += dt;
            if (racingState.crystalTimer >= 3) {
                spawnCrystal();
                racingState.crystalTimer = 0;
            }
            
            // 更新障礙物
            for (let i = racingState.obstacles.length - 1; i >= 0; i--) {
                const obs = racingState.obstacles[i];
                obs.y += racingState.speed * dt * 0.8;
                
                if (obs.y > H + 100) {
                    racingState.obstacles.splice(i, 1);
                    racingState.score += 10;
                    continue;
                }
                
                // 碰撞檢測
                if (!racingState.skillActive || racingState.skill.id !== 'shield') {
                    const dx = racingState.carX - obs.x;
                    const dy = (H - 100) - obs.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 50) {
                        if (racingState.skillActive && racingState.skill.id === 'nitro') {
                            // 氮氣模式下撞毀障礙物
                            racingState.obstacles.splice(i, 1);
                            racingState.score += 50;
                            createExplosion(obs.x, obs.y, '#FF4500');
                        } else {
                            // 受傷
                            racingState.lives--;
                            racingState.obstacles.splice(i, 1);
                            createExplosion(obs.x, obs.y, '#FF0000');
                            if (navigator.vibrate) navigator.vibrate(200);
                            if (racingState.lives <= 0) {
                                endRacingGame();
                            }
                        }
                    }
                }
            }
            
            // 更新硬幣
            for (let i = racingState.coins.length - 1; i >= 0; i--) {
                const coin = racingState.coins[i];
                coin.y += racingState.speed * dt * 0.8;
                coin.rotation += dt * 3;
                
                if (coin.y > H + 50) {
                    racingState.coins.splice(i, 1);
                    continue;
                }
                
                const dx = racingState.carX - coin.x;
                const dy = (H - 100) - coin.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 50) {
                    racingState.coins.splice(i, 1);
                    racingState.score += 20;
                    createExplosion(coin.x, coin.y, '#FFD700', 8);
                }
            }
            
            // 更新能量晶體
            for (let i = racingState.crystals.length - 1; i >= 0; i--) {
                const crystal = racingState.crystals[i];
                crystal.y += racingState.speed * dt * 0.8;
                crystal.phase += dt * 2;
                
                if (crystal.y > H + 50) {
                    racingState.crystals.splice(i, 1);
                    continue;
                }
                
                const dx = racingState.carX - crystal.x;
                const dy = (H - 100) - crystal.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 60) {
                    racingState.crystals.splice(i, 1);
                    racingState.energy = Math.min(racingState.maxEnergy, racingState.energy + 25);
                    createExplosion(crystal.x, crystal.y, '#00BFFF', 12);
                }
            }
            
            // 更新粒子
            for (let i = racingState.particles.length - 1; i >= 0; i--) {
                const p = racingState.particles[i];
                p.x += p.vx * dt * 60;
                p.y += p.vy * dt * 60;
                p.life -= p.decay;
                if (p.life <= 0) racingState.particles.splice(i, 1);
            }
            
            // 技能冷卻
            if (racingState.skillCooldown > 0) {
                racingState.skillCooldown -= dt * 1000;
            }
            
            // 技能持續時間
            if (racingState.skillActive) {
                if (Date.now() > racingState.skillEndTime) {
                    racingState.skillActive = false;
                    racingState.skillCooldown = 10000; // 10 秒冷卻
                    document.getElementById('skill-hint').classList.remove('show');
                }
            }
            
            // 張開五指觸發技能
            if (handData.isOpen && racingState.energy >= racingState.maxEnergy && 
                !racingState.skillActive && racingState.skillCooldown <= 0) {
                activateSkill();
            }
            
            updateRacingHUD();
        }

        function spawnObstacle() {
            const types = ['car', 'cone', 'truck'];
            const type = types[Math.floor(Math.random() * types.length)];
            const x = 60 + Math.random() * (W - 120);
            racingState.obstacles.push({
                x, y: -80, type,
                width: type === 'truck' ? 60 : 40,
                height: type === 'truck' ? 100 : 60
            });
        }

        function spawnCoin() {
            const x = 60 + Math.random() * (W - 120);
            racingState.coins.push({
                x, y: -30, rotation: 0
            });
        }

        function spawnCrystal() {
            const x = 60 + Math.random() * (W - 120);
            racingState.crystals.push({
                x, y: -30, phase: 0
            });
        }

        function activateSkill() {
            racingState.skillActive = true;
            racingState.energy = 0;
            racingState.skillEndTime = Date.now() + racingState.skill.duration;
            
            const hint = document.getElementById('skill-hint');
            hint.innerText = `${racingState.skill.name} 啟動！`;
            hint.style.borderColor = racingState.skill.color;
            hint.style.color = racingState.skill.color;
            hint.classList.add('show');
            
            if (racingState.skill.id === 'lightning') {
                // 閃電破壞：摧毀所有障礙物
                for (const obs of racingState.obstacles) {
                    racingState.score += 50;
                    createExplosion(obs.x, obs.y, '#FFD700', 15);
                }
                racingState.obstacles = [];
            }
            
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        function createExplosion(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count;
                const speed = 2 + Math.random() * 4;
                racingState.particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 3 + Math.random() * 4,
                    color,
                    life: 1,
                    decay: 0.03
                });
            }
        }

        function drawRacingGame() {
            // 背景：道路
            canvasCtx.fillStyle = '#333';
            canvasCtx.fillRect(0, 0, W, H);
            
            // 道路邊線
            canvasCtx.fillStyle = '#FFF';
            canvasCtx.fillRect(20, 0, 10, H);
            canvasCtx.fillRect(W - 30, 0, 10, H);
            
            // 道路中線（虛線）
            canvasCtx.fillStyle = '#FFD700';
            for (let y = -100 + racingState.roadOffset; y < H; y += 100) {
                canvasCtx.fillRect(W / 2 - 5, y, 10, 50);
            }
            
            // 速度線特效
            if (racingState.skillActive && racingState.skill.id === 'nitro') {
                canvasCtx.strokeStyle = 'rgba(255, 69, 0, 0.5)';
                canvasCtx.lineWidth = 3;
                for (let i = 0; i < 10; i++) {
                    const x = Math.random() * W;
                    const y = Math.random() * H;
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(x, y);
                    canvasCtx.lineTo(x, y + 50);
                    canvasCtx.stroke();
                }
            }
            
            // 繪製能量晶體
            for (const crystal of racingState.crystals) {
                const glow = Math.sin(crystal.phase) * 5 + 15;
                canvasCtx.fillStyle = '#00BFFF';
                canvasCtx.shadowColor = '#00BFFF';
                canvasCtx.shadowBlur = glow;
                canvasCtx.beginPath();
                canvasCtx.arc(crystal.x, crystal.y, 15, 0, Math.PI * 2);
                canvasCtx.fill();
                canvasCtx.shadowBlur = 0;
                
                canvasCtx.fillStyle = '#FFF';
                canvasCtx.font = 'bold 20px sans-serif';
                canvasCtx.textAlign = 'center';
                canvasCtx.fillText('💎', crystal.x, crystal.y + 7);
            }
            
            // 繪製硬幣
            for (const coin of racingState.coins) {
                canvasCtx.save();
                canvasCtx.translate(coin.x, coin.y);
                canvasCtx.rotate(coin.rotation);
                canvasCtx.fillStyle = '#FFD700';
                canvasCtx.shadowColor = '#FFD700';
                canvasCtx.shadowBlur = 10;
                canvasCtx.beginPath();
                canvasCtx.arc(0, 0, 15, 0, Math.PI * 2);
                canvasCtx.fill();
                canvasCtx.shadowBlur = 0;
                canvasCtx.fillStyle = '#FFF';
                canvasCtx.font = 'bold 16px sans-serif';
                canvasCtx.textAlign = 'center';
                canvasCtx.fillText('$', 0, 6);
                canvasCtx.restore();
            }
            
            // 繪製障礙物
            for (const obs of racingState.obstacles) {
                canvasCtx.fillStyle = obs.type === 'car' ? '#FF4500' : 
                                     obs.type === 'cone' ? '#FF6347' : '#4169E1';
                canvasCtx.fillRect(obs.x - obs.width/2, obs.y - obs.height/2, obs.width, obs.height);
                
                canvasCtx.fillStyle = '#FFF';
                canvasCtx.font = 'bold 30px sans-serif';
                canvasCtx.textAlign = 'center';
                const emoji = obs.type === 'car' ? '' : obs.type === 'cone' ? '' : '🚛';
                canvasCtx.fillText(emoji, obs.x, obs.y + 10);
            }
            
            // 繪製粒子
            for (const p of racingState.particles) {
                canvasCtx.globalAlpha = p.life;
                canvasCtx.fillStyle = p.color;
                canvasCtx.beginPath();
                canvasCtx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
                canvasCtx.fill();
            }
            canvasCtx.globalAlpha = 1;
            
            // 繪製車輛
            const carY = H - 100;
            canvasCtx.save();
            canvasCtx.translate(racingState.carX, carY);
            
            // 護盾效果
            if (racingState.skillActive && racingState.skill.id === 'shield') {
                canvasCtx.strokeStyle = '#1E90FF';
                canvasCtx.lineWidth = 4;
                canvasCtx.shadowColor = '#1E90FF';
                canvasCtx.shadowBlur = 20;
                canvasCtx.beginPath();
                canvasCtx.arc(0, 0, 50, 0, Math.PI * 2);
                canvasCtx.stroke();
                canvasCtx.shadowBlur = 0;
            }
            
            // 氮氣火焰
            if (racingState.skillActive && racingState.skill.id === 'nitro') {
                canvasCtx.fillStyle = '#FF4500';
                canvasCtx.beginPath();
                canvasCtx.moveTo(-15, 30);
                canvasCtx.lineTo(0, 50 + Math.random() * 20);
                canvasCtx.lineTo(15, 30);
                canvasCtx.fill();
            }
            
            // 車輛本體
            canvasCtx.fillStyle = '#FFD700';
            canvasCtx.fillRect(-25, -35, 50, 70);
            canvasCtx.fillStyle = '#FF4500';
            canvasCtx.fillRect(-20, -25, 40, 50);
            
            canvasCtx.font = '40px sans-serif';
            canvasCtx.textAlign = 'center';
            canvasCtx.fillText('🏎️', 0, 15);
            
            canvasCtx.restore();
            
            // 手部指示器
            if (handData.fistPos) {
                canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                canvasCtx.lineWidth = 2;
                canvasCtx.setLineDash([5, 5]);
                canvasCtx.beginPath();
                canvasCtx.moveTo(handData.fistPos.x, handData.fistPos.y);
                canvasCtx.lineTo(racingState.carX, carY);
                canvasCtx.stroke();
                canvasCtx.setLineDash([]);
                
                canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                canvasCtx.beginPath();
                canvasCtx.arc(handData.fistPos.x, handData.fistPos.y, 15, 0, Math.PI * 2);
                canvasCtx.fill();
            }
        }

        function updateRacingHUD() {
            document.getElementById('racing-score').innerText = racingState.score;
            document.getElementById('racing-speed').innerText = Math.floor(racingState.speed);
            document.getElementById('racing-lives').innerText = '❤️'.repeat(racingState.lives);
            
            const energyPercent = (racingState.energy / racingState.maxEnergy) * 100;
            document.getElementById('energy-bar').style.width = energyPercent + '%';
            
            if (racingState.energy >= racingState.maxEnergy && !racingState.skillActive) {
                document.getElementById('energy-bar').style.background = 
                    'linear-gradient(90deg, #FFD700, #FF4500, #FFD700)';
                document.getElementById('energy-bar').style.animation = 'pulse 1s infinite';
            } else {
                document.getElementById('energy-bar').style.background = 
                    'linear-gradient(90deg, #00BFFF, #1E90FF, #FFD700)';
                document.getElementById('energy-bar').style.animation = 'none';
            }
        }

        function endRacingGame() {
            racingState.running = false;
            
            const stats = document.getElementById('final-stats');
            stats.innerHTML = `
                <div class="stat-row">
                    <span class="label">最終分數</span>
                    <span class="value">${racingState.score}</span>
                </div>
                <div class="stat-row">
                    <span class="label">最高速度</span>
                    <span class="value">${Math.floor(racingState.speed)} km/h</span>
                </div>
                <div class="stat-row">
                    <span class="label">使用技能</span>
                    <span class="value">${racingState.skill.name}</span>
                </div>
            `;
            
            document.getElementById('game-over').classList.add('show');
        }

        document.getElementById('btn-restart').addEventListener('click', () => {
            document.getElementById('game-over').classList.remove('show');
            if (currentGame === 'racing') {
                initRacingGame();
            } else if (currentGame === 'bubble') {
                initBubbleGame();
            }
        });

        // 啟動攝影機（主頁時也啟動，這樣切換遊戲時更快）
        startCamera();
    </script>
</body>
</html>
