<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- iOS 專屬 Meta 標籤：禁止縮放、支援全螢幕、適配瀏海 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>虛擬鋼琴 - iOS 優化版</title>
    <style>
        /* 全局重置與防止 iOS 預設觸控行為 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* 防止雙擊縮放和長按選單 */
            touch-action: none; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            /* 適配 iOS 瀏海與底部 Home 指示條 */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        /* 影片與 Canvas 層疊 */
        #videoInput, #canvasOutput {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            /* 硬體加速與鏡像 */
            -webkit-transform: scaleX(-1);
            transform: scaleX(-1);
            will-change: transform;
        }
        #canvasOutput { pointer-events: none; z-index: 2; }
        #videoInput { z-index: 1; opacity: 0.3; } /* 降低影片透明度，讓鍵盤更清晰 */

        /* 鋼琴鍵盤容器 (適配底部安全區域) */
        #piano-container {
            position: absolute;
            bottom: calc(5% + env(safe-area-inset-bottom));
            left: 5%;
            width: 90%;
            height: 20vh;
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 3;
        }

        .key {
            flex: 1;
            background: linear-gradient(to bottom, #fff 80%, #ddd 100%);
            border: 1px solid #aaa;
            border-radius: 0 0 5px 5px;
            transition: background 0.1s, transform 0.1s;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
            color: #666;
            font-size: 12px;
        }

        .key.active {
            background: linear-gradient(to bottom, #ffd700 80%, #ffaa00 100%);
            transform: scaleY(0.95);
            transform-origin: top;
            color: #000;
            font-weight: bold;
        }

        /* 觸發線 */
        #trigger-line {
            position: absolute;
            bottom: 25%; 
            left: 5%;
            width: 90%;
            height: 2px;
            background: rgba(255, 50, 50, 0.8);
            border-top: 2px dashed rgba(255, 255, 255, 0.5);
            pointer-events: none;
            z-index: 3;
        }

        /* 啟動遮罩 */
        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 100;
            cursor: pointer;
            padding: 20px;
            text-align: center;
        }
        #start-overlay h1 { font-size: 2rem; margin-bottom: 1rem; }
        #start-overlay p { font-size: 1rem; color: #ccc; line-height: 1.5; margin-bottom: 10px;}
        .hidden { display: none !important; }
        
        /* 狀態提示 */
        #status {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            color: #0f0;
            font-size: 14px;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <video id="videoInput" autoplay playsinline muted></video>
    <canvas id="canvasOutput"></canvas>
    <div id="trigger-line"></div>
    <div id="status">初始化中...</div>

    <div id="piano-container">
        <div class="key" data-index="0">C4</div>
        <div class="key" data-index="1">D4</div>
        <div class="key" data-index="2">E4</div>
        <div class="key" data-index="3">F4</div>
        <div class="key" data-index="4">G4</div>
        <div class="key" data-index="5">A4</div>
        <div class="key" data-index="6">B4</div>
        <div class="key" data-index="7">C5</div>
        <div class="key" data-index="8">D5</div>
        <div class="key" data-index="9">E5</div>
    </div>

    <div id="start-overlay">
        <h1>🎹 虛擬鋼琴</h1>
        <p>點擊螢幕啟動攝影機與音訊</p>
        <p style="font-size: 0.8rem; color: #888;">
            ※ iOS 用戶請確保允許攝影機權限<br>
            ※ 請在光線充足的環境下使用<br>
            ※ 將手指往下彎曲穿過紅線即可發聲
        </p>
    </div>

    <!-- 引入 MediaPipe 與 Tone.js -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>

    <script>
        const statusEl = document.getElementById('status');
        
        // ================= 1. 音訊初始化 (Tone.js) =================
        // iOS 優化：使用較簡單的波形，減少 CPU 負擔
        const synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" }, 
            envelope: { attack: 0.02, decay: 0.1, sustain: 0.2, release: 0.8 }
        }).toDestination();
        synth.volume.value = -5; // 稍微降低音量防止破音
        
        const notes = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5', 'D5', 'E5'];
        const keyElements = document.querySelectorAll('.key');
        const keyStates = new Array(10).fill(false);

        function playNote(index, isDown) {
            if (isDown) {
                synth.triggerAttack(notes[index], Tone.now());
                keyElements[index].classList.add('active');
            } else {
                synth.triggerRelease(notes[index], Tone.now());
                keyElements[index].classList.remove('active');
            }
        }

        // ================= 2. MediaPipe 初始化 =================
        const videoElement = document.getElementById('videoInput');
        const canvasElement = document.getElementById('canvasOutput');
        const canvasCtx = canvasElement.getContext('2d');
        
        // 初始化 Canvas 尺寸 (避免 iOS 上每幀重設導致閃爍)
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const TRIGGER_Y = 0.65; // iOS 鏡頭視角可能不同，微調觸發線

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // 鏡像繪製
            canvasCtx.scale(-1, 1);
            canvasCtx.translate(-canvasElement.width, 0);

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 3});

                    const fingersToTrack = [8, 12]; // 食指、中指
                    
                    for (const idx of fingersToTrack) {
                        const tip = landmarks[idx];
                        const pip = landmarks[idx - 3]; 
                        const mirrorX = 1.0 - tip.x;
                        
                        // 鍵盤區域映射 (左右各留 5%)
                        const margin = 0.05;
                        const keyWidth = 0.90 / 10;
                        let keyIndex = Math.floor((mirrorX - margin) / keyWidth);

                        const isBent = tip.y > pip.y;

                        if (keyIndex >= 0 && keyIndex < 10) {
                            if (tip.y > TRIGGER_Y && isBent) {
                                if (!keyStates[keyIndex]) {
                                    keyStates[keyIndex] = true;
                                    playNote(keyIndex, true);
                                }
                            } else {
                                if (keyStates[keyIndex]) {
                                    keyStates[keyIndex] = false;
                                    playNote(keyIndex, false);
                                }
                            }
                        }
                    }
                }
            } else {
                for (let i = 0; i < 10; i++) {
                    if (keyStates[i]) {
                        keyStates[i] = false;
                        playNote(i, false);
                    }
                }
            }
            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        // iOS 效能優化：降低模型複雜度，限制偵測手數
        hands.setOptions({
            maxNumHands: 1, // 手機端追蹤雙手極易卡頓，建議先限制單手
            modelComplexity: 0, // 核心優化：0 代表最輕量模型，大幅提升手機幀率
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        // ================= 3. 啟動攝影機與音訊 (iOS 核心邏輯) =================
        const startOverlay = document.getElementById('start-overlay');
        
        startOverlay.addEventListener('click', async () => {
            startOverlay.classList.add('hidden');
            statusEl.innerText = "正在啟動音訊...";

            try {
                // 1. 解鎖 iOS 音訊限制 (必須在用戶點擊事件中 await)
                await Tone.start();
                console.log('Audio Context Resumed');
                
                // 播放一個極短的空聲音，確保 iOS 音訊管線完全打開
                synth.triggerAttackRelease("C4", "16n", Tone.now()); 
                
                statusEl.innerText = "正在啟動攝影機...";

                // 2. 獲取攝影機 (iOS 優化：強制前置鏡頭、限制解析度)
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user', // 強制前置鏡頭
                        width: { ideal: 640 }, // 限制解析度，防止手機 CPU 滿載
                        height: { ideal: 480 }
                    },
                    audio: false
                });
                
                videoElement.srcObject = stream;
                
                // 等待影片準備好再開始推理
                videoElement.onloadeddata = () => {
                    statusEl.innerText = "就緒！請將手放在紅線下方";
                    startDetectionLoop();
                };

            } catch (err) {
                console.error("啟動失敗:", err);
                statusEl.innerText = "啟動失敗，請檢查權限或 HTTPS";
                statusEl.style.color = "red";
            }
        });

        // 自定義推理循環 (比 MediaPipe Camera 工具類更穩定)
        async function startDetectionLoop() {
            if (videoElement.readyState >= 2) {
                await hands.send({image: videoElement});
            }
            requestAnimationFrame(startDetectionLoop);
        }
    </script>
</body>
</html>
