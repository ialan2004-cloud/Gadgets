<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🎮 手部追蹤遊戲廳 v2.0.1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Marker Felt', -apple-system, sans-serif;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* 🔧 修復：Video 鏡像，Canvas 不鏡像 */
        #videoInput {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0;
        }
        #canvasOutput {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* 主頁 */
        #home-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        #home-screen.hidden { display: none; }
        
        .home-title {
            font-size: 2.2rem;
            color: #FFF;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
            margin-bottom: 8px;
            text-align: center;
        }
        .home-subtitle {
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 30px;
            text-align: center;
        }
        .home-version {
            position: absolute;
            top: calc(15px + env(safe-area-inset-top));
            right: 15px;
            background: rgba(255,255,255,0.2);
            color: #FFF;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
        }

        .game-cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }
        .game-card {
            background: rgba(255,255,255,0.95);
            border-radius: 25px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 20px;
            border: 4px solid transparent;
        }
        .game-card:active { transform: scale(0.95); }
        .game-card.bubble { border-color: #FF69B4; }
        .game-card.racing { border-color: #FF4500; }
        
        .game-icon { font-size: 3.5rem; min-width: 70px; text-align: center; }
        .game-info { flex: 1; }
        .game-name { font-size: 1.4rem; font-weight: bold; color: #333; margin-bottom: 5px; }
        .game-desc { font-size: 0.85rem; color: #666; line-height: 1.4; }
        .game-tag {
            display: inline-block;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #FFF;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 8px;
        }
        .game-tag.new {
            background: linear-gradient(135deg, #FF4500, #FF6347);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* 相機啟動提示 */
        #camera-loading {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: #FFF;
        }
        #camera-loading.show { display: flex; }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 泡泡遊戲 HUD */
        #bubble-hud {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top));
            left: 10px; right: 10px;
            display: none;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
            gap: 8px;
        }
        #bubble-hud.show { display: flex; }
        .bubble-hud-card {
            background: rgba(255, 255, 255, 0.85);
            border: 3px solid #FF69B4;
            border-radius: 20px;
            padding: 8px 14px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            text-align: center;
            flex: 1;
        }
        .bubble-hud-label { font-size: 10px; color: #FF1493; font-weight: bold; }
        .bubble-hud-value { font-size: 20px; color: #FF1493; font-weight: bold; }

        #bubble-time-text {
            position: absolute;
            bottom: calc(35px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            color: #FFF;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #FF1493;
            z-index: 10;
            display: none;
        }
        #bubble-time-text.show { display: block; }
        #bubble-time-bar-container {
            position: absolute;
            bottom: calc(15px + env(safe-area-inset-bottom));
            left: 15px; right: 15px;
            height: 14px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid #FFF;
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
            display: none;
        }
        #bubble-time-bar-container.show { display: block; }
        #bubble-time-bar {
            height: 100%;
            background: linear-gradient(90deg, #00FF00, #FFFF00, #FF69B4);
            width: 100%;
        }

        /* 賽車遊戲 HUD */
        #game-hud {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top));
            left: 10px; right: 10px;
            display: none;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
            gap: 8px;
        }
        #game-hud.show { display: flex; }
        .hud-item {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 8px 12px;
            text-align: center;
            flex: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .hud-label { font-size: 10px; color: #666; font-weight: bold; }
        .hud-value { font-size: 16px; font-weight: bold; color: #333; }

        #energy-bar-container {
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom));
            left: 15px; right: 15px;
            height: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
            display: none;
            border: 2px solid rgba(255,255,255,0.5);
        }
        #energy-bar-container.show { display: block; }
        #energy-bar {
            height: 100%;
            background: linear-gradient(90deg, #00BFFF, #1E90FF, #FFD700);
            width: 0%;
            transition: width 0.3s;
        }
        #energy-label {
            position: absolute;
            bottom: calc(45px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            color: #FFF;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
            z-index: 10;
            display: none;
            white-space: nowrap;
        }
        #energy-label.show { display: block; }

        #skill-hint {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #FFD700;
            padding: 15px 25px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 15;
            display: none;
            text-align: center;
            border: 3px solid #FFD700;
        }
        #skill-hint.show { display: block; }

        /* 遊戲結束 */
        #game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        #game-over.show { display: flex; }
        #game-over h2 {
            font-size: 2.5rem;
            color: #FFD700;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .final-stats {
            background: rgba(255,255,255,0.95);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 20px;
            min-width: 280px;
            border: 4px solid #FF4500;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 1.1rem;
            color: #333;
        }
        .stat-row .label { color: #666; }
        .stat-row .value { color: #FF4500; font-weight: bold; }
        
        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            margin: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn-primary { background: linear-gradient(135deg, #FF4500, #FF6347); color: #FFF; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: #FFF; border: 2px solid rgba(255,255,255,0.5); }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <video id="videoInput" autoplay playsinline muted></video>
    <canvas id="canvasOutput"></canvas>

    <!-- 相機啟動提示 -->
    <div id="camera-loading">
        <div class="loading-spinner"></div>
        <div>正在啟動攝影機...</div>
        <div style="font-size: 0.85rem; margin-top: 10px; color: #aaa;">請允許攝影機權限</div>
    </div>

    <!-- 主頁 -->
    <div id="home-screen">
        <div class="home-version">v2.0.1</div>
        <div class="home-title">🎮 手部追蹤遊戲廳</div>
        <div class="home-subtitle">用你的手玩遊戲！</div>
        
        <div class="game-cards">
            <div class="game-card bubble" id="card-bubble">
                <div class="game-icon">🫧</div>
                <div class="game-info">
                    <div class="game-name">泡泡大作戰</div>
                    <div class="game-desc">戳破飛來的彩色泡泡，小心炸彈！</div>
                    <div class="game-tag">經典</div>
                </div>
            </div>
            
            <div class="game-card racing" id="card-racing">
                <div class="game-icon">🏎️</div>
                <div class="game-info">
                    <div class="game-name">極速狂飆</div>
                    <div class="game-desc">握拳控制賽車，張開五指觸發技能！</div>
                    <div class="game-tag new">NEW!</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 泡泡遊戲 HUD -->
    <div id="bubble-hud">
        <div class="bubble-hud-card">
            <div class="bubble-hud-label">⭐ 分數</div>
            <div class="bubble-hud-value" id="bubble-score">0</div>
        </div>
        <div class="bubble-hud-card">
            <div class="bubble-hud-label">🏆 等級</div>
            <div class="bubble-hud-value" id="bubble-level">Lv.1</div>
        </div>
        <div class="bubble-hud-card">
            <div class="bubble-hud-label">🎯 連擊</div>
            <div class="bubble-hud-value" id="bubble-combo">0</div>
        </div>
    </div>
    <div id="bubble-time-text">60</div>
    <div id="bubble-time-bar-container"><div id="bubble-time-bar"></div></div>

    <!-- 賽車遊戲 HUD -->
    <div id="game-hud">
        <div class="hud-item">
            <div class="hud-label">🏆 分數</div>
            <div class="hud-value" id="racing-score">0</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">💨 速度</div>
            <div class="hud-value" id="racing-speed">100</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">❤️ 生命</div>
            <div class="hud-value" id="racing-lives">3</div>
        </div>
    </div>
    <div id="energy-label">⚡ 能量槽 - 張開五指觸發技能！</div>
    <div id="energy-bar-container"><div id="energy-bar"></div></div>
    <div id="skill-hint">🚀 氮氣衝刺啟動！</div>

    <!-- 遊戲結束 -->
    <div id="game-over">
        <h2 id="game-over-title">🎉 遊戲結束！</h2>
        <div class="final-stats" id="final-stats"></div>
        <button class="btn btn-primary" id="btn-restart">再玩一次！</button>
        <button class="btn btn-secondary" id="btn-home">返回主頁</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>

    <script>
        const VERSION = '2.0.1';
        console.log(`🎮 手部追蹤遊戲廳 v${VERSION} 啟動`);
        console.log(`🔧 修復：選擇遊戲後才啟動相機`);

        // ============ 全局狀態 ============
        let currentGame = null;
        let audioReady = false;
        const MIRROR = true; // 鏡像模式

        // ============ 🔧 相機管理（防重複啟動） ============
        let cameraStarted = false;
        let handsLoopRunning = false;

        async function startCamera() {
            // 🔧 修復：如果已啟動，直接返回成功
            if (cameraStarted) {
                console.log('相機已啟動，跳過');
                return true;
            }
            
            document.getElementById('camera-loading').classList.add('show');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                videoElement.srcObject = stream;
                await videoElement.play();
                
                // 🔧 套用鏡像
                if (MIRROR) {
                    videoElement.style.transform = 'scaleX(-1)';
                    videoElement.style.webkitTransform = 'scaleX(-1)';
                }
                
                cameraStarted = true;
                document.getElementById('camera-loading').classList.remove('show');
                
                // 啟動手部追蹤循環（只啟動一次）
                startHandsLoop();
                return true;
            } catch (err) {
                console.error('攝影機啟動失敗:', err);
                document.getElementById('camera-loading').classList.remove('show');
                alert('無法啟動攝影機！請檢查權限設定。');
                return false;
            }
        }

        function startHandsLoop() {
            if (handsLoopRunning) return;
            handsLoopRunning = true;
            
            async function processFrame() {
                if (videoElement.readyState >= 2) {
                    await hands.send({image: videoElement});
                }
                requestAnimationFrame(processFrame);
            }
            processFrame();
        }

        // ============ Canvas 設定 ============
        const videoElement = document.getElementById('videoInput');
        const canvasElement = document.getElementById('canvasOutput');
        const canvasCtx = canvasElement.getContext('2d');
        let dpr = window.devicePixelRatio || 1;
        let W = window.innerWidth, H = window.innerHeight;

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            W = window.innerWidth;
            H = window.innerHeight;
            canvasElement.style.width = W + 'px';
            canvasElement.style.height = H + 'px';
            canvasElement.width = W * dpr;
            canvasElement.height = H * dpr;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ============ 手部資料 ============
        let handData = {
            fistPos: null,
            fingerPos: null,
            isOpen: false,
            isFist: false,
            visible: false
        };

        function analyzeHand(landmarks) {
            const mcps = [5, 9, 13, 17].map(i => landmarks[i]);
            const fistX = mcps.reduce((s, p) => s + p.x, 0) / 4;
            const fistY = mcps.reduce((s, p) => s + p.y, 0) / 4;
            
            const indexTip = landmarks[8];
            
            const fingers = [
                { tip: 4, mcp: 2 },
                { tip: 8, mcp: 5 },
                { tip: 12, mcp: 9 },
                { tip: 16, mcp: 13 },
                { tip: 20, mcp: 17 }
            ];
            
            let openCount = 0;
            for (const f of fingers) {
                const tip = landmarks[f.tip];
                const mcp = landmarks[f.mcp];
                const wrist = landmarks[0];
                const tipDist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
                const mcpDist = Math.hypot(mcp.x - wrist.x, mcp.y - wrist.y);
                if (tipDist > mcpDist * 1.3) openCount++;
            }
            
            // 🔧 鏡像處理
            const fx = MIRROR ? (1 - fistX) : fistX;
            const ix = MIRROR ? (1 - indexTip.x) : indexTip.x;
            
            handData = {
                fistPos: { x: fx * W, y: fistY * H },
                fingerPos: { x: ix * W, y: indexTip.y * H },
                isOpen: openCount >= 4,
                isFist: openCount <= 1,
                visible: true
            };
        }

        // 🔧 修復：onResults 只更新手部資料，不呼叫遊戲函數
        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                analyzeHand(results.multiHandLandmarks[0]);
            } else {
                handData.visible = false;
                handData.fistPos = null;
                handData.fingerPos = null;
                handData.isOpen = false;
                handData.isFist = false;
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        // ============ 音效 ============
        const popSynth = new Tone.MembraneSynth({
            pitchDecay: 0.01, octaves: 6,
            envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.05 }
        }).toDestination();
        popSynth.volume.value = -8;

        const crashSynth = new Tone.MembraneSynth({
            pitchDecay: 0.05, octaves: 8,
            envelope: { attack: 0.001, decay: 0.5, sustain: 0.2, release: 0.3 }
        }).toDestination();
        crashSynth.volume.value = -4;

        const skillSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.01, decay: 0.4, sustain: 0.4, release: 0.8 }
        }).toDestination();
        skillSynth.volume.value = -5;

        function playPop() { if (audioReady) popSynth.triggerAttackRelease('C5', '32n', Tone.now()); }
        function playCrash() { if (audioReady) crashSynth.triggerAttackRelease('C2', '2n', Tone.now()); }
        function playSkill() { if (audioReady) skillSynth.triggerAttackRelease(['C5','E5','G5'], '4n', Tone.now()); }
        function playCoin() { if (audioReady) popSynth.triggerAttackRelease('G5', '32n', Tone.now()); }

        // ============ 遊戲切換 ============
        async function startBubbleGame() {
            // 🔧 修復：選擇遊戲後才啟動相機
            const ok = await startCamera();
            if (!ok) return;
            
            try { await Tone.start(); audioReady = true; } catch(e) {}
            
            currentGame = 'bubble';
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('game-over').classList.remove('show');
            showHUD('bubble');
            initBubbleGame();
        }

        async function startRacingGame() {
            // 🔧 修復：選擇遊戲後才啟動相機
            const ok = await startCamera();
            if (!ok) return;
            
            try { await Tone.start(); audioReady = true; } catch(e) {}
            
            currentGame = 'racing';
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('game-over').classList.remove('show');
            showHUD('racing');
            initRacingGame();
        }

        function goHome() {
            currentGame = null;
            document.getElementById('home-screen').classList.remove('hidden');
            document.getElementById('game-over').classList.remove('show');
            showHUD(null);
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        }

        function showHUD(game) {
            document.getElementById('bubble-hud').classList.toggle('show', game === 'bubble');
            document.getElementById('bubble-time-text').classList.toggle('show', game === 'bubble');
            document.getElementById('bubble-time-bar-container').classList.toggle('show', game === 'bubble');
            document.getElementById('game-hud').classList.toggle('show', game === 'racing');
            document.getElementById('energy-bar-container').classList.toggle('show', game === 'racing');
            document.getElementById('energy-label').classList.toggle('show', game === 'racing');
            if (game !== 'racing') document.getElementById('skill-hint').classList.remove('show');
        }

        document.getElementById('card-bubble').addEventListener('click', startBubbleGame);
        document.getElementById('card-racing').addEventListener('click', startRacingGame);
        document.getElementById('btn-home').addEventListener('click', goHome);

        // ============ 泡泡遊戲 ============
        const BUBBLE_TYPES = {
            normal: { color: '#FF69B4', points: 10, weight: 60 },
            blue: { color: '#00BFFF', points: 10, weight: 20 },
            green: { color: '#32CD32', points: 10, weight: 15 },
            gold: { color: '#FFD700', points: 50, weight: 8, special: 'gold' },
            rainbow: { color: 'rainbow', points: 100, weight: 3, special: 'rainbow' },
            bomb: { color: '#2C2C2C', points: -30, weight: 5, special: 'bomb' }
        };

        let bubbleState = null;

        function initBubbleGame() {
            bubbleState = {
                score: 0, combo: 0, level: 1, timeLeft: 60,
                running: true, bubbles: [], particles: [], texts: [],
                lastTime: performance.now(), spawnTimer: 0, lastComboTime: Date.now()
            };
            updateBubbleHUD();
            requestAnimationFrame(bubbleLoop);
        }

        function bubbleLoop(timestamp) {
            if (currentGame !== 'bubble' || !bubbleState || !bubbleState.running) return;
            
            const dt = Math.min(0.05, (timestamp - bubbleState.lastTime) / 1000);
            bubbleState.lastTime = timestamp;
            
            updateBubbleGame(dt);
            drawBubbleGame();
            
            requestAnimationFrame(bubbleLoop);
        }

        function spawnBubble() {
            const types = Object.keys(BUBBLE_TYPES);
            const totalWeight = types.reduce((s, t) => s + BUBBLE_TYPES[t].weight, 0);
            let r = Math.random() * totalWeight;
            let type = 'normal';
            for (const t of types) { r -= BUBBLE_TYPES[t].weight; if (r <= 0) { type = t; break; } }
            
            const config = BUBBLE_TYPES[type];
            const radius = 25 + Math.random() * 20;
            const side = Math.floor(Math.random() * 4);
            const speed = (1 + bubbleState.level * 0.3) * (0.5 + Math.random() * 0.8);
            let x, y, vx, vy;
            
            if (side === 0) { x = Math.random() * W; y = H + radius; vx = (Math.random()-0.5)*speed; vy = -speed; }
            else if (side === 1) { x = Math.random() * W; y = -radius; vx = (Math.random()-0.5)*speed; vy = speed*0.7; }
            else if (side === 2) { x = -radius; y = Math.random() * H; vx = speed; vy = (Math.random()-0.5)*speed*0.5; }
            else { x = W + radius; y = Math.random() * H; vx = -speed; vy = (Math.random()-0.5)*speed*0.5; }
            
            bubbleState.bubbles.push({ x, y, vx, vy, radius, color: config.color, points: config.points, special: config.special, phase: Math.random()*Math.PI*2 });
        }

        function updateBubbleGame(dt) {
            bubbleState.timeLeft -= dt;
            if (bubbleState.timeLeft <= 0) { endBubbleGame(); return; }
            
            if (bubbleState.combo > 0 && Date.now() - bubbleState.lastComboTime > 2000) {
                bubbleState.combo = 0;
            }
            
            bubbleState.spawnTimer += dt;
            const interval = Math.max(0.3, 1.2 - bubbleState.level * 0.1);
            if (bubbleState.spawnTimer >= interval) { spawnBubble(); bubbleState.spawnTimer = 0; }
            
            for (let i = bubbleState.bubbles.length - 1; i >= 0; i--) {
                const b = bubbleState.bubbles[i];
                b.x += b.vx * dt * 60;
                b.y += b.vy * dt * 60;
                b.phase += dt * 2;
                b.x += Math.sin(b.phase) * 0.3;
                if (b.x < -100 || b.x > W+100 || b.y < -100 || b.y > H+100) {
                    bubbleState.bubbles.splice(i, 1);
                    if (b.special !== 'bomb') bubbleState.combo = 0;
                }
            }
            
            // 碰撞
            if (handData.fingerPos) {
                for (let i = bubbleState.bubbles.length - 1; i >= 0; i--) {
                    const b = bubbleState.bubbles[i];
                    const dx = handData.fingerPos.x - b.x;
                    const dy = handData.fingerPos.y - b.y;
                    if (Math.sqrt(dx*dx + dy*dy) < b.radius + 15) {
                        popBubble(b, i);
                        break;
                    }
                }
            }
            
            for (let i = bubbleState.particles.length - 1; i >= 0; i--) {
                const p = bubbleState.particles[i];
                p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += 0.15; p.life -= p.decay;
                if (p.life <= 0) bubbleState.particles.splice(i, 1);
            }
            for (let i = bubbleState.texts.length - 1; i >= 0; i--) {
                const t = bubbleState.texts[i];
                t.y += t.vy * dt * 60; t.life -= 0.02;
                if (t.life <= 0) bubbleState.texts.splice(i, 1);
            }
            
            document.getElementById('bubble-time-bar').style.width = (bubbleState.timeLeft / 60 * 100) + '%';
            document.getElementById('bubble-time-text').innerText = Math.ceil(bubbleState.timeLeft);
            updateBubbleHUD();
        }

        function popBubble(b, index) {
            bubbleState.bubbles.splice(index, 1);
            
            if (b.special === 'bomb') {
                bubbleState.score = Math.max(0, bubbleState.score + b.points);
                bubbleState.combo = 0;
                playCrash();
                if (navigator.vibrate) navigator.vibrate(200);
            } else {
                bubbleState.combo++;
                bubbleState.lastComboTime = Date.now();
                const mult = Math.min(5, 1 + Math.floor(bubbleState.combo / 5));
                bubbleState.score += b.points * mult;
                playPop();
            }
            
            for (let i = 0; i < 12; i++) {
                const angle = (Math.PI * 2 * i) / 12;
                const speed = 2 + Math.random() * 4;
                bubbleState.particles.push({ x: b.x, y: b.y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, radius: 3+Math.random()*4, color: b.color === 'rainbow' ? '#FF69B4' : b.color, life: 1, decay: 0.03 });
            }
            bubbleState.texts.push({ x: b.x, y: b.y, text: (b.special === 'bomb' ? '' : '+') + b.points, color: b.special === 'bomb' ? '#FF0000' : '#FFF', life: 1, vy: -2 });
            
            const newLevel = Math.floor(bubbleState.score / 200) + 1;
            if (newLevel > bubbleState.level) bubbleState.level = newLevel;
        }

        function drawBubbleGame() {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.save();
            canvasCtx.scale(dpr, dpr);
            
            for (const b of bubbleState.bubbles) {
                canvasCtx.save();
                canvasCtx.translate(b.x, b.y);
                let grad;
                if (b.color === 'rainbow') {
                    grad = canvasCtx.createLinearGradient(-b.radius, -b.radius, b.radius, b.radius);
                    const t = (Date.now()/500) % 1;
                    grad.addColorStop(0, `hsl(${t*360},100%,60%)`);
                    grad.addColorStop(0.5, `hsl(${(t*360+180)%360},100%,60%)`);
                    grad.addColorStop(1, `hsl(${(t*360+360)%360},100%,60%)`);
                } else {
                    grad = canvasCtx.createRadialGradient(-b.radius*0.3, -b.radius*0.3, b.radius*0.1, 0, 0, b.radius);
                    grad.addColorStop(0, '#FFF');
                    grad.addColorStop(0.3, b.color);
                    grad.addColorStop(1, b.color);
                }
                canvasCtx.fillStyle = grad;
                canvasCtx.beginPath();
                canvasCtx.arc(0, 0, b.radius, 0, Math.PI*2);
                canvasCtx.fill();
                if (b.special === 'bomb') {
                    canvasCtx.fillStyle = '#FFF';
                    canvasCtx.font = `bold ${b.radius*0.8}px sans-serif`;
                    canvasCtx.textAlign = 'center';
                    canvasCtx.fillText('💣', 0, b.radius*0.3);
                }
                canvasCtx.restore();
            }
            
            for (const p of bubbleState.particles) {
                canvasCtx.globalAlpha = p.life;
                canvasCtx.fillStyle = p.color;
                canvasCtx.beginPath();
                canvasCtx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI*2);
                canvasCtx.fill();
            }
            canvasCtx.globalAlpha = 1;
            
            for (const t of bubbleState.texts) {
                canvasCtx.globalAlpha = t.life;
                canvasCtx.fillStyle = t.color;
                canvasCtx.font = "bold 28px 'Comic Sans MS', sans-serif";
                canvasCtx.textAlign = 'center';
                canvasCtx.fillText(t.text, t.x, t.y);
            }
            canvasCtx.globalAlpha = 1;
            
            if (handData.fingerPos) {
                const g = canvasCtx.createRadialGradient(handData.fingerPos.x, handData.fingerPos.y, 0, handData.fingerPos.x, handData.fingerPos.y, 30);
                g.addColorStop(0, 'rgba(255,255,255,0.8)');
                g.addColorStop(0.5, 'rgba(255,105,180,0.5)');
                g.addColorStop(1, 'rgba(255,105,180,0)');
                canvasCtx.fillStyle = g;
                canvasCtx.beginPath();
                canvasCtx.arc(handData.fingerPos.x, handData.fingerPos.y, 30, 0, Math.PI*2);
                canvasCtx.fill();
            }
            
            canvasCtx.restore();
        }

        function updateBubbleHUD() {
            document.getElementById('bubble-score').innerText = bubbleState.score;
            document.getElementById('bubble-level').innerText = 'Lv.' + bubbleState.level;
            document.getElementById('bubble-combo').innerText = bubbleState.combo;
        }

        function endBubbleGame() {
            bubbleState.running = false;
            showGameOver([
                ['最終分數', bubbleState.score],
                ['最終等級', 'Lv.' + bubbleState.level],
                ['最高連擊', bubbleState.combo]
            ]);
        }

        // ============ 賽車遊戲 ============
        const SKILLS = [
            { id: 'nitro', name: '🚀 氮氣衝刺', color: '#FF4500', duration: 4000 },
            { id: 'shield', name: '🛡️ 能量護盾', color: '#1E90FF', duration: 5000 },
            { id: 'lightning', name: '⚡ 閃電破壞', color: '#FFD700', duration: 500 }
        ];

        let racingState = null;

        function initRacingGame() {
            racingState = {
                score: 0, speed: 100, lives: 3, energy: 0, maxEnergy: 100,
                carX: W/2, targetCarX: W/2,
                obstacles: [], coins: [], crystals: [], particles: [],
                roadOffset: 0,
                skill: SKILLS[Math.floor(Math.random() * SKILLS.length)],
                skillActive: false, skillEndTime: 0, skillCooldown: 0,
                running: true, lastTime: performance.now(),
                spawnTimer: 0, coinTimer: 0, crystalTimer: 0
            };
            document.getElementById('energy-label').innerText = `⚡ ${racingState.skill.name} - 張開五指觸發！`;
            updateRacingHUD();
            requestAnimationFrame(racingLoop);
        }

        function racingLoop(timestamp) {
            if (currentGame !== 'racing' || !racingState || !racingState.running) return;
            
            const dt = Math.min(0.05, (timestamp - racingState.lastTime) / 1000);
            racingState.lastTime = timestamp;
            
            updateRacingGame(dt);
            drawRacingGame();
            
            requestAnimationFrame(racingLoop);
        }

        function updateRacingGame(dt) {
            if (handData.fistPos) racingState.targetCarX = handData.fistPos.x;
            racingState.carX += (racingState.targetCarX - racingState.carX) * 0.15;
            racingState.carX = Math.max(40, Math.min(W - 40, racingState.carX));
            
            racingState.roadOffset += racingState.speed * dt * 0.5;
            if (racingState.roadOffset > 100) racingState.roadOffset = 0;
            racingState.speed = Math.min(300, 100 + racingState.score * 0.3);
            
            racingState.spawnTimer += dt;
            if (racingState.spawnTimer >= Math.max(0.8, 2 - racingState.speed * 0.003)) {
                const types = ['car', 'cone', 'truck'];
                racingState.obstacles.push({
                    x: 60 + Math.random() * (W - 120), y: -80,
                    type: types[Math.floor(Math.random() * types.length)]
                });
                racingState.spawnTimer = 0;
            }
            
            racingState.coinTimer += dt;
            if (racingState.coinTimer >= 0.6) {
                racingState.coins.push({ x: 60 + Math.random() * (W - 120), y: -30, rotation: 0 });
                racingState.coinTimer = 0;
            }
            
            racingState.crystalTimer += dt;
            if (racingState.crystalTimer >= 3) {
                racingState.crystals.push({ x: 60 + Math.random() * (W - 120), y: -30, phase: 0 });
                racingState.crystalTimer = 0;
            }
            
            const carY = H - 100;
            
            for (let i = racingState.obstacles.length - 1; i >= 0; i--) {
                const obs = racingState.obstacles[i];
                obs.y += racingState.speed * dt * 0.8;
                if (obs.y > H + 100) { racingState.obstacles.splice(i, 1); racingState.score += 10; continue; }
                
                const dx = racingState.carX - obs.x;
                const dy = carY - obs.y;
                if (Math.sqrt(dx*dx + dy*dy) < 50) {
                    if (racingState.skillActive && (racingState.skill.id === 'nitro' || racingState.skill.id === 'shield')) {
                        racingState.obstacles.splice(i, 1);
                        racingState.score += 50;
                        createExplosion(obs.x, obs.y, '#FF4500');
                    } else {
                        racingState.lives--;
                        racingState.obstacles.splice(i, 1);
                        createExplosion(obs.x, obs.y, '#FF0000');
                        playCrash();
                        if (navigator.vibrate) navigator.vibrate(200);
                        if (racingState.lives <= 0) { endRacingGame(); return; }
                    }
                }
            }
            
            for (let i = racingState.coins.length - 1; i >= 0; i--) {
                const c = racingState.coins[i];
                c.y += racingState.speed * dt * 0.8;
                c.rotation += dt * 3;
                if (c.y > H + 50) { racingState.coins.splice(i, 1); continue; }
                const dx = racingState.carX - c.x, dy = carY - c.y;
                if (Math.sqrt(dx*dx + dy*dy) < 50) {
                    racingState.coins.splice(i, 1);
                    racingState.score += 20;
                    playCoin();
                    createExplosion(c.x, c.y, '#FFD700', 8);
                }
            }
            
            for (let i = racingState.crystals.length - 1; i >= 0; i--) {
                const c = racingState.crystals[i];
                c.y += racingState.speed * dt * 0.8;
                c.phase += dt * 2;
                if (c.y > H + 50) { racingState.crystals.splice(i, 1); continue; }
                const dx = racingState.carX - c.x, dy = carY - c.y;
                if (Math.sqrt(dx*dx + dy*dy) < 60) {
                    racingState.crystals.splice(i, 1);
                    racingState.energy = Math.min(racingState.maxEnergy, racingState.energy + 25);
                    playCoin();
                    createExplosion(c.x, c.y, '#00BFFF', 12);
                }
            }
            
            for (let i = racingState.particles.length - 1; i >= 0; i--) {
                const p = racingState.particles[i];
                p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.life -= p.decay;
                if (p.life <= 0) racingState.particles.splice(i, 1);
            }
            
            if (racingState.skillCooldown > 0) racingState.skillCooldown -= dt * 1000;
            if (racingState.skillActive && Date.now() > racingState.skillEndTime) {
                racingState.skillActive = false;
                racingState.skillCooldown = 10000;
                document.getElementById('skill-hint').classList.remove('show');
            }
            
            if (handData.isOpen && racingState.energy >= racingState.maxEnergy && !racingState.skillActive && racingState.skillCooldown <= 0) {
                activateSkill();
            }
            
            updateRacingHUD();
        }

        function activateSkill() {
            racingState.skillActive = true;
            racingState.energy = 0;
            racingState.skillEndTime = Date.now() + racingState.skill.duration;
            
            const hint = document.getElementById('skill-hint');
            hint.innerText = `${racingState.skill.name} 啟動！`;
            hint.style.borderColor = racingState.skill.color;
            hint.style.color = racingState.skill.color;
            hint.classList.add('show');
            playSkill();
            
            if (racingState.skill.id === 'lightning') {
                for (const obs of racingState.obstacles) {
                    racingState.score += 50;
                    createExplosion(obs.x, obs.y, '#FFD700', 15);
                }
                racingState.obstacles = [];
            }
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        function createExplosion(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count;
                const speed = 2 + Math.random() * 4;
                racingState.particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, radius: 3+Math.random()*4, color, life: 1, decay: 0.03 });
            }
        }

        function drawRacingGame() {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.save();
            canvasCtx.scale(dpr, dpr);
            
            canvasCtx.fillStyle = '#333';
            canvasCtx.fillRect(0, 0, W, H);
            canvasCtx.fillStyle = '#FFF';
            canvasCtx.fillRect(20, 0, 10, H);
            canvasCtx.fillRect(W - 30, 0, 10, H);
            canvasCtx.fillStyle = '#FFD700';
            for (let y = -100 + racingState.roadOffset; y < H; y += 100) {
                canvasCtx.fillRect(W/2 - 5, y, 10, 50);
            }
            
            if (racingState.skillActive && racingState.skill.id === 'nitro') {
                canvasCtx.strokeStyle = 'rgba(255,69,0,0.5)';
                canvasCtx.lineWidth = 3;
                for (let i = 0; i < 10; i++) {
                    const x = Math.random() * W, y = Math.random() * H;
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(x, y);
                    canvasCtx.lineTo(x, y + 50);
                    canvasCtx.stroke();
                }
            }
            
            for (const c of racingState.crystals) {
                canvasCtx.fillStyle = '#00BFFF';
                canvasCtx.shadowColor = '#00BFFF';
                canvasCtx.shadowBlur = 15;
                canvasCtx.beginPath();
                canvasCtx.arc(c.x, c.y, 15, 0, Math.PI*2);
                canvasCtx.fill();
                canvasCtx.shadowBlur = 0;
                canvasCtx.font = '20px sans-serif';
                canvasCtx.textAlign = 'center';
                canvasCtx.fillText('💎', c.x, c.y + 7);
            }
            
            for (const c of racingState.coins) {
                canvasCtx.save();
                canvasCtx.translate(c.x, c.y);
                canvasCtx.rotate(c.rotation);
                canvasCtx.fillStyle = '#FFD700';
                canvasCtx.beginPath();
                canvasCtx.arc(0, 0, 15, 0, Math.PI*2);
                canvasCtx.fill();
                canvasCtx.fillStyle = '#FFF';
                canvasCtx.font = 'bold 16px sans-serif';
                canvasCtx.textAlign = 'center';
                canvasCtx.fillText('$', 0, 6);
                canvasCtx.restore();
            }
            
            for (const obs of racingState.obstacles) {
                const emoji = obs.type === 'car' ? '🚗' : obs.type === 'cone' ? '🚧' : '🚛';
                canvasCtx.font = '40px sans-serif';
                canvasCtx.textAlign = 'center';
                canvasCtx.fillText(emoji, obs.x, obs.y + 15);
            }
            
            for (const p of racingState.particles) {
                canvasCtx.globalAlpha = p.life;
                canvasCtx.fillStyle = p.color;
                canvasCtx.beginPath();
                canvasCtx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI*2);
                canvasCtx.fill();
            }
            canvasCtx.globalAlpha = 1;
            
            const carY = H - 100;
            canvasCtx.save();
            canvasCtx.translate(racingState.carX, carY);
            if (racingState.skillActive && racingState.skill.id === 'shield') {
                canvasCtx.strokeStyle = '#1E90FF';
                canvasCtx.lineWidth = 4;
                canvasCtx.shadowColor = '#1E90FF';
                canvasCtx.shadowBlur = 20;
                canvasCtx.beginPath();
                canvasCtx.arc(0, 0, 50, 0, Math.PI*2);
                canvasCtx.stroke();
                canvasCtx.shadowBlur = 0;
            }
            if (racingState.skillActive && racingState.skill.id === 'nitro') {
                canvasCtx.fillStyle = '#FF4500';
                canvasCtx.beginPath();
                canvasCtx.moveTo(-15, 30);
                canvasCtx.lineTo(0, 50 + Math.random()*20);
                canvasCtx.lineTo(15, 30);
                canvasCtx.fill();
            }
            canvasCtx.font = '45px sans-serif';
            canvasCtx.textAlign = 'center';
            canvasCtx.fillText('🏎️', 0, 15);
            canvasCtx.restore();
            
            if (handData.fistPos) {
                canvasCtx.strokeStyle = 'rgba(255,255,255,0.4)';
                canvasCtx.lineWidth = 2;
                canvasCtx.setLineDash([5, 5]);
                canvasCtx.beginPath();
                canvasCtx.moveTo(handData.fistPos.x, handData.fistPos.y);
                canvasCtx.lineTo(racingState.carX, carY);
                canvasCtx.stroke();
                canvasCtx.setLineDash([]);
                canvasCtx.fillStyle = 'rgba(255,255,255,0.3)';
                canvasCtx.beginPath();
                canvasCtx.arc(handData.fistPos.x, handData.fistPos.y, 15, 0, Math.PI*2);
                canvasCtx.fill();
            }
            
            canvasCtx.restore();
        }

        function updateRacingHUD() {
            document.getElementById('racing-score').innerText = racingState.score;
            document.getElementById('racing-speed').innerText = Math.floor(racingState.speed);
            document.getElementById('racing-lives').innerText = '❤️'.repeat(Math.max(0, racingState.lives));
            document.getElementById('energy-bar').style.width = (racingState.energy / racingState.maxEnergy * 100) + '%';
        }

        function endRacingGame() {
            racingState.running = false;
            showGameOver([
                ['最終分數', racingState.score],
                ['最高速度', Math.floor(racingState.speed) + ' km/h'],
                ['使用技能', racingState.skill.name]
            ]);
        }

        // ============ 遊戲結束 ============
        function showGameOver(stats) {
            const el = document.getElementById('final-stats');
            el.innerHTML = stats.map(([label, value]) => 
                `<div class="stat-row"><span class="label">${label}</span><span class="value">${value}</span></div>`
            ).join('');
            document.getElementById('game-over').classList.add('show');
        }

        document.getElementById('btn-restart').addEventListener('click', () => {
            document.getElementById('game-over').classList.remove('show');
            if (currentGame === 'bubble') initBubbleGame();
            else if (currentGame === 'racing') initRacingGame();
        });

        // 🔧 修復：移除頁面載入時的 startCamera() 呼叫
        console.log('✅ 相機將在選擇遊戲後啟動');
    </script>
</body>
