<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🫧 泡泡大作戰 v1.1.1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Marker Felt', -apple-system, sans-serif;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background: linear-gradient(180deg, #87CEEB 0%, #FFB6C1 50%, #FFD700 100%);
        }

        /* 🔧 關鍵修復：Video 鏡像，Canvas 不鏡像（由 JS 控制繪圖鏡像） */
        #videoInput {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1; 
            opacity: 0.25; 
            filter: blur(3px) brightness(1.1);
        }
        #canvasOutput {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2; 
            pointer-events: none;
            /* 不設 transform，由 JS 控制 */
        }

        /* 版本號 */
        #version-tag {
            position: absolute;
            top: calc(5px + env(safe-area-inset-top));
            right: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #FFF;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            z-index: 50;
            pointer-events: none;
        }

        /* HUD */
        #hud-top {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top));
            left: 10px; right: 70px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
            gap: 8px;
        }
        .hud-card {
            background: rgba(255, 255, 255, 0.85);
            border: 3px solid #FF69B4;
            border-radius: 20px;
            padding: 8px 14px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            text-align: center;
            flex: 1;
        }
        .hud-label { font-size: 10px; color: #FF1493; font-weight: bold; letter-spacing: 1px; }
        .hud-value {
            font-size: 22px; color: #FF1493; font-weight: bold;
            text-shadow: 2px 2px 0 #FFF, 3px 3px 0 rgba(255, 105, 180, 0.3);
        }

        #combo-display {
            position: absolute;
            top: 30%; left: 50%;
            transform: translateX(-50%) scale(0);
            font-size: 60px; font-weight: bold;
            color: #FF6B00;
            text-shadow: 3px 3px 0 #FFF, 5px 5px 0 rgba(255, 107, 0, 0.5);
            z-index: 15; pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        #combo-display.show { transform: translateX(-50%) scale(1); }

        #level-up {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 40px; font-weight: bold;
            background: linear-gradient(45deg, #FFD700, #FF69B4, #00BFFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            z-index: 15; pointer-events: none;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        #level-up.show { transform: translate(-50%, -50%) scale(1.2); }

        #screen-effects {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
        }
        .screen-flash {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: white;
            opacity: 0;
            animation: flash 0.3s ease-out;
        }
        @keyframes flash { 0% { opacity: 0.6; } 100% { opacity: 0; } }
        .screen-shake { animation: shake 0.3s ease-out; }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-10px, -5px); }
            50% { transform: translate(10px, 5px); }
            75% { transform: translate(-5px, 10px); }
        }
        .screen-vignette {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(255, 0, 0, 0.3) 100%);
            opacity: 0;
            animation: vignette 0.5s ease-out;
        }
        @keyframes vignette { 0% { opacity: 0.8; } 100% { opacity: 0; } }

        /* 設定畫面 */
        #settings-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 150;
            padding: calc(20px + env(safe-area-inset-top)) 20px 20px;
            overflow-y: auto;
        }
        #settings-screen.hidden { display: none; }
        
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .settings-title { font-size: 1.8rem; color: #FFF; text-shadow: 2px 2px 0 rgba(0,0,0,0.3); }
        .settings-version {
            background: rgba(255, 255, 255, 0.2);
            color: #FFF;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .settings-group {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .settings-group-title {
            font-size: 1rem;
            color: #764ba2;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .settings-group-desc { font-size: 0.8rem; color: #888; margin-bottom: 10px; line-height: 1.4; }

        .option-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .option-btn {
            flex: 1;
            min-width: 80px;
            padding: 12px 8px;
            background: #f0f0f0;
            border: 3px solid transparent;
            border-radius: 15px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .option-btn .icon { font-size: 1.5rem; display: block; margin-bottom: 4px; }
        .option-btn.active {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #FFF;
            border-color: #FFF;
            box-shadow: 0 4px 10px rgba(255, 165, 0, 0.4);
            transform: scale(1.05);
        }
        .option-btn:active { transform: scale(0.95); }

        .option-btn[data-difficulty="easy"].active { background: linear-gradient(135deg, #90EE90, #32CD32); }
        .option-btn[data-difficulty="normal"].active { background: linear-gradient(135deg, #FFD700, #FFA500); }
        .option-btn[data-difficulty="hard"].active { background: linear-gradient(135deg, #FF6B6B, #C62828); }

        .main-menu-btn {
            margin-top: 10px;
            padding: 18px 50px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #FFF;
            border: 4px solid #FFF;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: inherit;
            box-shadow: 0 8px 20px rgba(255, 165, 0, 0.5), inset 0 -4px 0 rgba(0,0,0,0.2);
            cursor: pointer;
            width: 100%;
            max-width: 400px;
        }
        .main-menu-btn:active { transform: scale(0.95); }

        .secondary-btn {
            margin-top: 10px;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            color: #FFF;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
        }

        /* 開始畫面 */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #FF9A9E 0%, #FAD0C4 50%, #FBC2EB 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }
        #start-screen.show { display: flex; }
        #start-version {
            position: absolute;
            top: calc(15px + env(safe-area-inset-top));
            right: 15px;
            background: rgba(255, 255, 255, 0.3);
            color: #FFF;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        #start-screen h1 {
            font-size: 3rem;
            color: #FFF;
            text-shadow: 3px 3px 0 #FF1493, 6px 6px 0 rgba(0,0,0,0.2);
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        #start-screen .mascot { font-size: 80px; margin: 20px 0; animation: wiggle 3s infinite; }
        @keyframes wiggle { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
        #start-screen p {
            font-size: 1.1rem;
            color: #FFF;
            text-shadow: 2px 2px 0 rgba(255, 20, 147, 0.5);
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .current-settings {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 10px 20px;
            margin: 15px 0;
            color: #FFF;
            font-size: 0.9rem;
            border: 2px dashed rgba(255, 255, 255, 0.6);
        }
        .btn-start {
            margin-top: 10px;
            padding: 18px 50px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #FFF;
            border: 4px solid #FFF;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: inherit;
            box-shadow: 0 8px 20px rgba(255, 165, 0, 0.5), inset 0 -4px 0 rgba(0,0,0,0.2);
            cursor: pointer;
        }
        .btn-start:active { transform: scale(0.95); }

        /* 結算畫面 */
        #game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        #game-over.show { display: flex; }
        #game-over h2 {
            font-size: 2.5rem;
            color: #FFD700;
            text-shadow: 3px 3px 0 #FF1493;
            margin-bottom: 20px;
        }
        .final-stats {
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #FF69B4;
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 20px;
            min-width: 280px;
        }
        .stat-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 1.2rem; color: #333; }
        .stat-row .label { color: #888; }
        .stat-row .value { color: #FF1493; font-weight: bold; }
        .badges { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 15px; }
        .badge {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #FFF;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        #time-bar-container {
            position: absolute;
            bottom: calc(15px + env(safe-area-inset-bottom));
            left: 15px; right: 15px;
            height: 14px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid #FFF;
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
            pointer-events: none;
        }
        #time-bar {
            height: 100%;
            background: linear-gradient(90deg, #00FF00, #FFFF00, #FF69B4);
            width: 100%;
            transition: width 0.1s linear;
            border-radius: 8px;
        }
        #time-text {
            position: absolute;
            bottom: calc(35px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            color: #FFF;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #FF1493;
            z-index: 10;
            pointer-events: none;
        }

        #difficulty-indicator {
            position: absolute;
            top: calc(75px + env(safe-area-inset-top));
            right: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #FFF;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            z-index: 10;
            pointer-events: none;
        }

        /* 🔧 新增：除錯模式指示器 */
        #debug-info {
            position: absolute;
            bottom: calc(60px + env(safe-area-inset-bottom));
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #0f0;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-family: monospace;
            z-index: 50;
            pointer-events: none;
            display: none;
        }
        #debug-info.show { display: block; }
    </style>
</head>
<body>

    <video id="videoInput" autoplay playsinline muted></video>
    <canvas id="canvasOutput"></canvas>
    <div id="screen-effects"></div>
    <div id="version-tag">v1.1.1</div>
    <div id="difficulty-indicator"></div>
    <div id="debug-info"></div>

    <div id="hud-top">
        <div class="hud-card">
            <div class="hud-label">⭐ 分數</div>
            <div class="hud-value" id="score">0</div>
        </div>
        <div class="hud-card">
            <div class="hud-label">🏆 等級</div>
            <div class="hud-value" id="level">Lv.1</div>
        </div>
        <div class="hud-card">
            <div class="hud-label">🎯 連擊</div>
            <div class="hud-value" id="combo">0</div>
        </div>
    </div>

    <div id="combo-display"></div>
    <div id="level-up"></div>
    <div id="time-text">60</div>
    <div id="time-bar-container"><div id="time-bar"></div></div>

    <!-- 設定畫面 -->
    <div id="settings-screen">
        <div class="settings-header">
            <div class="settings-title">⚙️ 設定</div>
            <div class="settings-version">v1.1.1</div>
        </div>

        <div class="settings-group">
            <div class="settings-group-title">🪞 鏡頭方向</div>
            <div class="settings-group-desc">
                如果手指移動方向與激光點相反，請切換此選項
            </div>
            <div class="option-group" id="mirror-options">
                <button class="option-btn active" data-mirror="mirror">
                    <span class="icon">🪞</span>
                    鏡像模式
                </button>
                <button class="option-btn" data-mirror="real">
                    <span class="icon">📷</span>
                    真實模式
                </button>
            </div>
        </div>

        <div class="settings-group">
            <div class="settings-group-title">🎮 遊戲難度</div>
            <div class="settings-group-desc">選擇適合你的挑戰程度</div>
            <div class="option-group" id="difficulty-options">
                <button class="option-btn" data-difficulty="easy">
                    <span class="icon">🌱</span>
                    簡單
                </button>
                <button class="option-btn active" data-difficulty="normal">
                    <span class="icon">⭐</span>
                    普通
                </button>
                <button class="option-btn" data-difficulty="hard">
                    <span class="icon">🔥</span>
                    困難
                </button>
            </div>
        </div>

        <div class="settings-group">
            <div class="settings-group-title">📹 攝影機</div>
            <div class="settings-group-desc">前置鏡頭適合自拍，後置鏡頭畫質更好</div>
            <div class="option-group" id="camera-options">
                <button class="option-btn active" data-camera="user">
                    <span class="icon">🤳</span>
                    前置鏡頭
                </button>
                <button class="option-btn" data-camera="environment">
                    <span class="icon">📷</span>
                    後置鏡頭
                </button>
            </div>
        </div>

        <div class="settings-group">
            <div class="settings-group-title">🐛 除錯模式</div>
            <div class="settings-group-desc">顯示激光點座標，幫助確認方向是否正確</div>
            <div class="option-group" id="debug-options">
                <button class="option-btn" data-debug="off">
                    <span class="icon">🚫</span>
                    關閉
                </button>
                <button class="option-btn active" data-debug="on">
                    <span class="icon">🔍</span>
                    開啟
                </button>
            </div>
        </div>

        <button class="main-menu-btn" id="btn-to-start">下一步 →</button>
    </div>

    <!-- 開始畫面 -->
    <div id="start-screen">
        <div id="start-version">v1.1.1</div>
        <h1>泡泡大作戰</h1>
        <div class="mascot">🫧</div>
        <p>用你的手指戳破飛來的泡泡！<br>小心黑色的炸彈泡泡喔 💣</p>
        <div class="current-settings" id="current-settings">
            難度：⭐ 普通 | 鏡頭：🪞 鏡像
        </div>
        <button class="btn-start" id="btn-start">開始遊戲！</button>
        <button class="secondary-btn" id="btn-back-settings">← 返回設定</button>
    </div>

    <!-- 結算畫面 -->
    <div id="game-over">
        <h2>🎉 遊戲結束！</h2>
        <div class="final-stats">
            <div class="stat-row">
                <span class="label">最終分數</span>
                <span class="value" id="final-score">0</span>
            </div>
            <div class="stat-row">
                <span class="label">戳破泡泡</span>
                <span class="value" id="final-popped">0</span>
            </div>
            <div class="stat-row">
                <span class="label">最高連擊</span>
                <span class="value" id="final-combo">0</span>
            </div>
            <div class="stat-row">
                <span class="label">最終等級</span>
                <span class="value" id="final-level">Lv.1</span>
            </div>
            <div class="badges" id="badges"></div>
        </div>
        <button class="btn-start" id="btn-restart">再玩一次！</button>
        <button class="secondary-btn" id="btn-to-settings">⚙️ 修改設定</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>

    <script>
        // ============ 版本資訊 ============
        const VERSION = '1.1.1';
        console.log(`🫧 泡泡大作戰 v${VERSION} 啟動`);
        console.log(`🔧 修復：激光點與手指方向對齊問題`);

        // ============ 設定系統 ============
        const DEFAULT_SETTINGS = {
            mirror: 'mirror',
            difficulty: 'normal',
            camera: 'user',
            debug: 'on'  // 🔧 預設開啟除錯模式
        };

        const DIFFICULTY_CONFIG = {
            easy: { name: '🌱 簡單', duration: 90, speedMul: 0.7, bombWeight: 2, spawnInterval: 1.5, levelUpScore: 300 },
            normal: { name: '⭐ 普通', duration: 60, speedMul: 1.0, bombWeight: 5, spawnInterval: 1.2, levelUpScore: 200 },
            hard: { name: '🔥 困難', duration: 45, speedMul: 1.4, bombWeight: 10, spawnInterval: 0.8, levelUpScore: 150 }
        };

        function loadSettings() {
            try {
                const saved = localStorage.getItem('bubble_game_settings_v2');
                if (saved) return { ...DEFAULT_SETTINGS, ...JSON.parse(saved) };
            } catch (e) {}
            return { ...DEFAULT_SETTINGS };
        }

        function saveSettings() {
            try {
                localStorage.setItem('bubble_game_settings_v2', JSON.stringify(settings));
            } catch (e) {}
        }

        let settings = loadSettings();

        // ============ 設定 UI ============
        function setupSettingsUI() {
            // 鏡像模式
            document.querySelectorAll('#mirror-options .option-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mirror === settings.mirror);
                btn.addEventListener('click', () => {
                    settings.mirror = btn.dataset.mirror;
                    document.querySelectorAll('#mirror-options .option-btn').forEach(b => {
                        b.classList.toggle('active', b.dataset.mirror === settings.mirror);
                    });
                    saveSettings();
                    applyMirrorMode();
                    updateStartScreenInfo();
                });
            });

            // 難度
            document.querySelectorAll('#difficulty-options .option-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.difficulty === settings.difficulty);
                btn.addEventListener('click', () => {
                    settings.difficulty = btn.dataset.difficulty;
                    document.querySelectorAll('#difficulty-options .option-btn').forEach(b => {
                        b.classList.toggle('active', b.dataset.difficulty === settings.difficulty);
                    });
                    saveSettings();
                    updateStartScreenInfo();
                });
            });

            // 鏡頭
            document.querySelectorAll('#camera-options .option-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.camera === settings.camera);
                btn.addEventListener('click', () => {
                    settings.camera = btn.dataset.camera;
                    document.querySelectorAll('#camera-options .option-btn').forEach(b => {
                        b.classList.toggle('active', b.dataset.camera === settings.camera);
                    });
                    saveSettings();
                    updateStartScreenInfo();
                });
            });

            // 除錯模式
            document.querySelectorAll('#debug-options .option-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.debug === settings.debug);
                btn.addEventListener('click', () => {
                    settings.debug = btn.dataset.debug;
                    document.querySelectorAll('#debug-options .option-btn').forEach(b => {
                        b.classList.toggle('active', b.dataset.debug === settings.debug);
                    });
                    saveSettings();
                    applyDebugMode();
                });
            });

            applyMirrorMode();
            applyDebugMode();
            updateStartScreenInfo();
        }

        // 🔧 關鍵修復：只鏡像 Video，不鏡像 Canvas（由 JS 控制）
        function applyMirrorMode() {
            const video = document.getElementById('videoInput');
            if (settings.mirror === 'mirror') {
                video.style.transform = 'scaleX(-1)';
                video.style.webkitTransform = 'scaleX(-1)';
            } else {
                video.style.transform = 'scaleX(1)';
                video.style.webkitTransform = 'scaleX(1)';
            }
        }

        function applyDebugMode() {
            const debugEl = document.getElementById('debug-info');
            if (settings.debug === 'on') {
                debugEl.classList.add('show');
            } else {
                debugEl.classList.remove('show');
            }
        }

        function updateStartScreenInfo() {
            const diff = DIFFICULTY_CONFIG[settings.difficulty];
            const mirrorText = settings.mirror === 'mirror' ? '🪞 鏡像' : '📷 真實';
            const cameraText = settings.camera === 'user' ? '🤳 前置' : '📷 後置';
            document.getElementById('current-settings').innerHTML = 
                `難度：${diff.name} | 鏡頭：${mirrorText} | ${cameraText}<br>` +
                `<small>遊戲時間：${diff.duration} 秒</small>`;
        }

        setupSettingsUI();

        // ============ 畫面切換 ============
        function showSettings() {
            document.getElementById('settings-screen').classList.remove('hidden');
            document.getElementById('start-screen').classList.remove('show');
            document.getElementById('game-over').classList.remove('show');
        }

        function showStartScreen() {
            document.getElementById('settings-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.add('show');
            document.getElementById('game-over').classList.remove('show');
            updateStartScreenInfo();
        }

        document.getElementById('btn-to-start').addEventListener('click', showStartScreen);
        document.getElementById('btn-back-settings').addEventListener('click', showSettings);
        document.getElementById('btn-to-settings').addEventListener('click', showSettings);

        // ============ 遊戲狀態 ============
        let gameState = {
            score: 0, combo: 0, maxCombo: 0, level: 1,
            popped: 0, timeLeft: 60,
            slowMotion: false, slowMotionEnd: 0,
            running: false, lastComboTime: 0
        };

        // ============ 音效系統 ============
        let audioReady = false;
        
        const popSynth = new Tone.MembraneSynth({
            pitchDecay: 0.01, octaves: 6,
            envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.05 }
        }).toDestination();
        popSynth.volume.value = -8;

        const comboSynth = new Tone.Synth({
            oscillator: { type: "triangle8" },
            envelope: { attack: 0.005, decay: 0.1, sustain: 0.3, release: 0.4 }
        }).toDestination();
        comboSynth.volume.value = -6;

        const specialSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.01, decay: 0.4, sustain: 0.4, release: 0.8 }
        }).toDestination();
        specialSynth.volume.value = -5;

        const bombSynth = new Tone.MembraneSynth({
            pitchDecay: 0.05, octaves: 8,
            envelope: { attack: 0.001, decay: 0.5, sustain: 0.2, release: 0.3 }
        }).toDestination();
        bombSynth.volume.value = -4;

        const levelUpSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sawtooth" },
            envelope: { attack: 0.01, decay: 0.2, sustain: 0.5, release: 1 }
        }).toDestination();
        levelUpSynth.volume.value = -6;

        const gameOverSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.05, decay: 0.3, sustain: 0.4, release: 1.5 }
        }).toDestination();
        gameOverSynth.volume.value = -5;

        function playPopSound(pitch = 'C5') { if (!audioReady) return; popSynth.triggerAttackRelease(pitch, '32n', Tone.now()); }
        function playComboSound(combo) {
            if (!audioReady) return;
            const notes = ['C5', 'E5', 'G5', 'B5', 'C6', 'D6', 'E6'];
            comboSynth.triggerAttackRelease(notes[Math.min(combo - 1, notes.length - 1)], '8n', Tone.now());
        }
        function playSpecialSound(type) {
            if (!audioReady) return;
            if (type === 'gold') specialSynth.triggerAttackRelease(['C5', 'E5', 'G5'], '4n', Tone.now());
            else if (type === 'rainbow') specialSynth.triggerAttackRelease(['C5', 'E5', 'G5', 'B5'], '2n', Tone.now());
            else if (type === 'clock') specialSynth.triggerAttackRelease(['G4', 'C5'], '4n', Tone.now());
        }
        function playBombSound() { if (!audioReady) return; bombSynth.triggerAttackRelease('C2', '2n', Tone.now()); }
        function playLevelUpSound() { if (!audioReady) return; levelUpSynth.triggerAttackRelease(['C5', 'E5', 'G5', 'C6'], '2n', Tone.now()); }
        function playGameOverSound() { if (!audioReady) return; gameOverSynth.triggerAttackRelease(['C5', 'E5', 'G5'], '1n', Tone.now()); }

        // ============ 屏幕特效 ============
        const screenEffects = document.getElementById('screen-effects');
        function triggerScreenFlash(color = 'white') {
            const flash = document.createElement('div');
            flash.className = 'screen-flash';
            flash.style.background = color;
            screenEffects.appendChild(flash);
            setTimeout(() => flash.remove(), 300);
        }
        function triggerScreenShake() {
            document.body.classList.add('screen-shake');
            setTimeout(() => document.body.classList.remove('screen-shake'), 300);
        }
        function triggerScreenVignette(color = 'rgba(255, 0, 0, 0.3)') {
            const v = document.createElement('div');
            v.className = 'screen-vignette';
            v.style.background = `radial-gradient(circle, transparent 50%, ${color} 100%)`;
            screenEffects.appendChild(v);
            setTimeout(() => v.remove(), 500);
        }

        // ============ Canvas 設定 ============
        const videoElement = document.getElementById('videoInput');
        const canvasElement = document.getElementById('canvasOutput');
        const canvasCtx = canvasElement.getContext('2d');
        let dpr = window.devicePixelRatio || 1;
        let W = window.innerWidth, H = window.innerHeight;

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            W = window.innerWidth;
            H = window.innerHeight;
            canvasElement.style.width = W + 'px';
            canvasElement.style.height = H + 'px';
            canvasElement.width = W * dpr;
            canvasElement.height = H * dpr;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ============ 泡泡系統 ============
        const bubbles = [];
        const particles = [];
        const floatingTexts = [];
        
        const BUBBLE_TYPES = {
            normal: { color: '#FF69B4', points: 10, weight: 60 },
            blue: { color: '#00BFFF', points: 10, weight: 20 },
            green: { color: '#32CD32', points: 10, weight: 15 },
            gold: { color: '#FFD700', points: 50, weight: 8, special: 'gold' },
            rainbow: { color: 'rainbow', points: 100, weight: 3, special: 'rainbow' },
            clock: { color: '#4169E1', points: 20, weight: 4, special: 'clock' },
            bomb: { color: '#2C2C2C', points: -30, weight: 5, special: 'bomb' }
        };

        function getRandomBubbleType() {
            const types = Object.keys(BUBBLE_TYPES);
            const bombWeight = DIFFICULTY_CONFIG[settings.difficulty].bombWeight;
            const totalWeight = types.reduce((sum, t) => sum + (t === 'bomb' ? bombWeight : BUBBLE_TYPES[t].weight), 0);
            let r = Math.random() * totalWeight;
            for (const t of types) {
                const w = t === 'bomb' ? bombWeight : BUBBLE_TYPES[t].weight;
                r -= w;
                if (r <= 0) return t;
            }
            return 'normal';
        }

        function spawnBubble() {
            const type = getRandomBubbleType();
            const config = BUBBLE_TYPES[type];
            const radius = 25 + Math.random() * 20;
            const diffConfig = DIFFICULTY_CONFIG[settings.difficulty];
            
            const side = Math.floor(Math.random() * 4);
            let x, y, vx, vy;
            const speed = (1 + gameState.level * 0.3) * (0.5 + Math.random() * 0.8) * diffConfig.speedMul;
            
            if (side === 0) { x = Math.random() * W; y = H + radius; vx = (Math.random() - 0.5) * speed; vy = -speed; }
            else if (side === 1) { x = Math.random() * W; y = -radius; vx = (Math.random() - 0.5) * speed; vy = speed * 0.7; }
            else if (side === 2) { x = -radius; y = Math.random() * H; vx = speed; vy = (Math.random() - 0.5) * speed * 0.5; }
            else { x = W + radius; y = Math.random() * H; vx = -speed; vy = (Math.random() - 0.5) * speed * 0.5; }

            bubbles.push({
                x, y, vx, vy, radius, type,
                color: config.color, points: config.points, special: config.special,
                phase: Math.random() * Math.PI * 2, life: 1
            });
        }

        function updateBubbles(dt) {
            const speedMul = gameState.slowMotion ? 0.3 : 1;
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                b.x += b.vx * dt * 60 * speedMul;
                b.y += b.vy * dt * 60 * speedMul;
                b.phase += dt * 2;
                b.x += Math.sin(b.phase) * 0.3;
                if (b.x < -100 || b.x > W + 100 || b.y < -100 || b.y > H + 100) {
                    bubbles.splice(i, 1);
                    if (b.special !== 'bomb') { gameState.combo = 0; updateHUD(); }
                }
            }
        }

        function drawBubble(ctx, b) {
            ctx.save();
            ctx.translate(b.x, b.y);
            
            if (b.color === 'rainbow') {
                const grad = ctx.createLinearGradient(-b.radius, -b.radius, b.radius, b.radius);
                const t = (Date.now() / 500) % 1;
                grad.addColorStop(0, `hsl(${t * 360}, 100%, 60%)`);
                grad.addColorStop(0.33, `hsl(${(t * 360 + 120) % 360}, 100%, 60%)`);
                grad.addColorStop(0.66, `hsl(${(t * 360 + 240) % 360}, 100%, 60%)`);
                grad.addColorStop(1, `hsl(${(t * 360 + 360) % 360}, 100%, 60%)`);
                ctx.fillStyle = grad;
            } else {
                const grad = ctx.createRadialGradient(-b.radius * 0.3, -b.radius * 0.3, b.radius * 0.1, 0, 0, b.radius);
                grad.addColorStop(0, '#FFFFFF');
                grad.addColorStop(0.3, b.color);
                grad.addColorStop(1, shadeColor(b.color, -30));
                ctx.fillStyle = grad;
            }
            
            if (b.special === 'gold') { ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 20; }
            else if (b.special === 'rainbow') { ctx.shadowColor = '#FF69B4'; ctx.shadowBlur = 25; }
            else if (b.special === 'bomb') { ctx.shadowColor = '#FF0000'; ctx.shadowBlur = 15; }
            
            ctx.beginPath();
            ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.ellipse(-b.radius * 0.3, -b.radius * 0.3, b.radius * 0.25, b.radius * 0.15, -0.5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#FFF';
            ctx.font = `bold ${b.radius * 0.8}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (b.special === 'gold') ctx.fillText('⭐', 0, 2);
            else if (b.special === 'rainbow') ctx.fillText('🌈', 0, 2);
            else if (b.special === 'clock') ctx.fillText('⏱️', 0, 2);
            else if (b.special === 'bomb') ctx.fillText('💣', 0, 2);
            
            ctx.restore();
        }

        function shadeColor(color, percent) {
            if (color === 'rainbow') return color;
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, Math.min(255, (num >> 16) + amt));
            const G = Math.max(0, Math.min(255, (num >> 8 & 0x00FF) + amt));
            const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
            return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        // ============ 粒子系統 ============
        function createPopEffect(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                const speed = 2 + Math.random() * 4;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 3 + Math.random() * 4,
                    color, life: 1,
                    decay: 0.02 + Math.random() * 0.02
                });
            }
        }

        function createSpecialEffect(x, y, type) {
            if (type === 'gold') {
                for (let i = 0; i < 25; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 3 + Math.random() * 5;
                    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: 4 + Math.random() * 3, color: '#FFD700', life: 1, decay: 0.015, isStar: true });
                }
            } else if (type === 'rainbow') {
                for (let i = 0; i < 80; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 8;
                    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: 3 + Math.random() * 5, color: `hsl(${Math.random() * 360}, 100%, 60%)`, life: 1, decay: 0.01 });
                }
            } else if (type === 'bomb') {
                for (let i = 0; i < 30; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1 + Math.random() * 3;
                    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1, radius: 8 + Math.random() * 8, color: '#333', life: 1, decay: 0.015, isSmoke: true });
                }
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt * 60;
                p.y += p.vy * dt * 60;
                p.vy += 0.15;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles(ctx) {
            for (const p of particles) {
                ctx.save();
                ctx.globalAlpha = p.life;
                if (p.isStar) {
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 10;
                    ctx.font = `${p.radius * 3}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⭐', p.x, p.y);
                } else if (p.isSmoke) {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius * (2 - p.life), 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // ============ 飄字系統 ============
        function addFloatingText(x, y, text, color, size = 30) {
            floatingTexts.push({ x, y, text, color, size, life: 1, vy: -2 });
        }

        function updateFloatingTexts(dt) {
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const t = floatingTexts[i];
                t.y += t.vy * dt * 60;
                t.life -= 0.02;
                if (t.life <= 0) floatingTexts.splice(i, 1);
            }
        }

        function drawFloatingTexts(ctx) {
            for (const t of floatingTexts) {
                ctx.save();
                ctx.globalAlpha = t.life;
                ctx.fillStyle = t.color;
                ctx.strokeStyle = '#FFF';
                ctx.lineWidth = 4;
                ctx.font = `bold ${t.size}px 'Comic Sans MS', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeText(t.text, t.x, t.y);
                ctx.fillText(t.text, t.x, t.y);
                ctx.restore();
            }
        }

        // ============ 手指追蹤與碰撞 ============
        let fingerPos = null;
        let fingerVisible = false;
        let rawLandmarkX = 0;  // 🔧 用於除錯顯示

        function checkCollisions() {
            if (!fingerPos) return;
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                const dx = fingerPos.x - b.x;
                const dy = fingerPos.y - b.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < b.radius + 15) {
                    popBubble(b, i);
                    break;
                }
            }
        }

        function popBubble(b, index) {
            bubbles.splice(index, 1);
            
            if (b.special === 'bomb') {
                gameState.score = Math.max(0, gameState.score + b.points);
                gameState.combo = 0;
                createPopEffect(b.x, b.y, '#333', 10);
                createSpecialEffect(b.x, b.y, 'bomb');
                addFloatingText(b.x, b.y, b.points, '#FF0000', 40);
                playBombSound();
                triggerScreenShake();
                triggerScreenVignette('rgba(255, 0, 0, 0.4)');
                if (navigator.vibrate) navigator.vibrate(200);
            } else {
                gameState.combo++;
                gameState.popped++;
                if (gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;
                gameState.lastComboTime = Date.now();
                
                const comboMultiplier = Math.min(5, 1 + Math.floor(gameState.combo / 5));
                const points = b.points * comboMultiplier;
                gameState.score += points;
                
                createPopEffect(b.x, b.y, b.color === 'rainbow' ? '#FF69B4' : b.color);
                if (b.special) createSpecialEffect(b.x, b.y, b.special);
                
                let text = '+' + points;
                if (comboMultiplier > 1) text += ' x' + comboMultiplier;
                addFloatingText(b.x, b.y, text, b.color === 'rainbow' ? '#FF69B4' : b.color, 28);
                
                if (b.special === 'gold' || b.special === 'rainbow') {
                    playSpecialSound(b.special);
                    triggerScreenFlash(b.special === 'gold' ? 'rgba(255, 215, 0, 0.3)' : 'rgba(255, 105, 180, 0.3)');
                } else {
                    playPopSound();
                }
                
                if (gameState.combo > 1 && gameState.combo % 5 === 0) {
                    playComboSound(Math.floor(gameState.combo / 5));
                }
                
                if (b.special === 'clock') {
                    gameState.slowMotion = true;
                    gameState.slowMotionEnd = Date.now() + 5000;
                    addFloatingText(b.x, b.y - 40, '⏱️ 慢動作！', '#4169E1', 32);
                    playSpecialSound('clock');
                    triggerScreenFlash('rgba(65, 105, 225, 0.3)');
                }
                
                if (gameState.combo >= 3) showCombo(gameState.combo);
            }
            
            checkLevelUp();
            updateHUD();
        }

        function showCombo(combo) {
            const el = document.getElementById('combo-display');
            el.innerText = combo + ' COMBO!';
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 800);
        }

        function checkLevelUp() {
            const levelUpScore = DIFFICULTY_CONFIG[settings.difficulty].levelUpScore;
            const newLevel = Math.floor(gameState.score / levelUpScore) + 1;
            if (newLevel > gameState.level) {
                gameState.level = newLevel;
                const el = document.getElementById('level-up');
                el.innerText = '🎉 LEVEL ' + newLevel + '！';
                el.classList.add('show');
                setTimeout(() => el.classList.remove('show'), 1500);
                playLevelUpSound();
                triggerScreenFlash('rgba(255, 215, 0, 0.4)');
            }
        }

        function updateHUD() {
            document.getElementById('score').innerText = gameState.score;
            document.getElementById('level').innerText = 'Lv.' + gameState.level;
            document.getElementById('combo').innerText = gameState.combo;
        }

        // ============ 手指指示器 ============
        function drawFingerIndicator(ctx) {
            if (!fingerPos) return;
            ctx.save();
            const grad = ctx.createRadialGradient(fingerPos.x, fingerPos.y, 0, fingerPos.x, fingerPos.y, 30);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
            grad.addColorStop(0.5, 'rgba(255, 105, 180, 0.5)');
            grad.addColorStop(1, 'rgba(255, 105, 180, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(fingerPos.x, fingerPos.y, 30, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#FFF';
            ctx.shadowColor = '#FF69B4';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(fingerPos.x, fingerPos.y, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // ============ 🔧 關鍵修復：MediaPipe 設定 ============
        function onResults(results) {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.save();
            canvasCtx.scale(dpr, dpr);
            
            // 🔧 核心修復邏輯：
            // 鏡像模式：Video CSS 鏡像 + Canvas JS 鏡像 + landmarks 鏡像
            // 真實模式：都不鏡像
            if (settings.mirror === 'mirror') {
                canvasCtx.scale(-1, 1);
                canvasCtx.translate(-W, 0);
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const tip = landmarks[8];
                
                // 🔧 關鍵修復：landmarks 座標必須與 Canvas 繪圖鏡像一致
                // 鏡像模式：landmark.x 需要 1-x 來鏡像
                // 真實模式：直接使用原始座標
                const fx = settings.mirror === 'mirror' ? (1 - tip.x) : tip.x;
                
                rawLandmarkX = tip.x;  // 記錄原始座標用於除錯
                fingerPos = { x: fx * W, y: tip.y * H };
                fingerVisible = true;
                
                // 🔧 除錯資訊
                if (settings.debug === 'on') {
                    const debugEl = document.getElementById('debug-info');
                    const mode = settings.mirror === 'mirror' ? '鏡像' : '真實';
                    debugEl.innerHTML = 
                        `模式：${mode}<br>` +
                        `原始 X：${(tip.x * 100).toFixed(1)}%<br>` +
                        `激光 X：${(fx * 100).toFixed(1)}%<br>` +
                        `激光 Y：${(tip.y * 100).toFixed(1)}%<br>` +
                        `螢幕：${W}x${H}`;
                }
            } else {
                fingerVisible = false;
                fingerPos = null;
            }

            if (gameState.running) {
                for (const b of bubbles) drawBubble(canvasCtx, b);
                drawParticles(canvasCtx);
                drawFloatingTexts(canvasCtx);
                drawFingerIndicator(canvasCtx);
                if (fingerVisible) checkCollisions();
            }

            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        // ============ 遊戲循環 ============
        let lastTime = 0;
        let spawnTimer = 0;
        let gameStartTime = 0;

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
            lastTime = timestamp;

            if (gameState.running) {
                const diffConfig = DIFFICULTY_CONFIG[settings.difficulty];
                const elapsed = (Date.now() - gameStartTime) / 1000;
                gameState.timeLeft = Math.max(0, diffConfig.duration - elapsed);
                
                if (gameState.slowMotion && Date.now() > gameState.slowMotionEnd) gameState.slowMotion = false;
                if (gameState.combo > 0 && Date.now() - gameState.lastComboTime > 2000) { gameState.combo = 0; updateHUD(); }
                
                spawnTimer += dt;
                const spawnInterval = Math.max(0.3, diffConfig.spawnInterval - gameState.level * 0.08);
                if (spawnTimer >= spawnInterval) { spawnBubble(); spawnTimer = 0; }
                
                updateBubbles(dt);
                updateParticles(dt);
                updateFloatingTexts(dt);
                
                const timePercent = (gameState.timeLeft / diffConfig.duration) * 100;
                document.getElementById('time-bar').style.width = timePercent + '%';
                document.getElementById('time-text').innerText = Math.ceil(gameState.timeLeft);
                
                if (gameState.timeLeft <= 0) endGame();
            }

            requestAnimationFrame(gameLoop);
        }

        // ============ 遊戲流程 ============
        async function startGame() {
            document.getElementById('start-screen').classList.remove('show');
            
            const diffConfig = DIFFICULTY_CONFIG[settings.difficulty];
            document.getElementById('difficulty-indicator').innerText = diffConfig.name;
            
            try {
                await Tone.start();
                audioReady = true;
            } catch(e) { console.warn('Audio init failed:', e); }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: settings.camera, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                videoElement.srcObject = stream;
                await videoElement.play();
                
                async function processFrame() {
                    if (videoElement.readyState >= 2) await hands.send({image: videoElement});
                    requestAnimationFrame(processFrame);
                }
                processFrame();
                
                gameState = {
                    score: 0, combo: 0, maxCombo: 0, level: 1,
                    popped: 0, timeLeft: diffConfig.duration,
                    slowMotion: false, slowMotionEnd: 0,
                    running: true, lastComboTime: Date.now()
                };
                bubbles.length = 0;
                particles.length = 0;
                floatingTexts.length = 0;
                gameStartTime = Date.now();
                updateHUD();
                
                requestAnimationFrame(gameLoop);
                
            } catch (err) {
                console.error('啟動失敗:', err);
                alert('無法啟動攝影機，請檢查權限設定！');
                showSettings();
            }
        }

        function endGame() {
            gameState.running = false;
            playGameOverSound();
            
            document.getElementById('final-score').innerText = gameState.score;
            document.getElementById('final-popped').innerText = gameState.popped;
            document.getElementById('final-combo').innerText = gameState.maxCombo;
            document.getElementById('final-level').innerText = 'Lv.' + gameState.level;
            
            const badges = [];
            if (gameState.popped >= 30) badges.push('🎯 泡泡殺手');
            if (gameState.maxCombo >= 10) badges.push('🔥 連擊大師');
            if (gameState.score >= 1000) badges.push('👑 泡泡之王');
            if (gameState.level >= 5) badges.push('⭐ 傳奇玩家');
            if (gameState.popped >= 50) badges.push('💪 不屈不撓');
            if (settings.difficulty === 'hard' && gameState.score >= 500) badges.push('🏆 困難征服者');
            
            const badgesEl = document.getElementById('badges');
            badgesEl.innerHTML = '';
            if (badges.length === 0) badgesEl.innerHTML = '<div class="badge">再接再厲！</div>';
            else badges.forEach(b => {
                const div = document.createElement('div');
                div.className = 'badge';
                div.innerText = b;
                badgesEl.appendChild(div);
            });
            
            document.getElementById('game-over').classList.add('show');
        }

        function restartGame() {
            document.getElementById('game-over').classList.remove('show');
            const diffConfig = DIFFICULTY_CONFIG[settings.difficulty];
            gameState = {
                score: 0, combo: 0, maxCombo: 0, level: 1,
                popped: 0, timeLeft: diffConfig.duration,
                slowMotion: false, slowMotionEnd: 0,
                running: true, lastComboTime: Date.now()
            };
            bubbles.length = 0;
            particles.length = 0;
            floatingTexts.length = 0;
            gameStartTime = Date.now();
            updateHUD();
        }

        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-restart').addEventListener('click', restartGame);
    </script>
</body>
</html>
