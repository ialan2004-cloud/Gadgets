<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人生屋企 · 深度 AI 版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: #0f0f1e; color: #eee; user-select: none;
  }
  #app {
    width: 100vw; height: 100vh;
    display: grid;
    grid-template-rows: 38px 1fr 78px;
    grid-template-columns: 210px 1fr 320px;
    grid-template-areas:
      "top top top"
      "left center right"
      "bottom bottom bottom";
    gap: 4px; padding: 4px;
  }
  .panel {
    background: rgba(20, 20, 40, 0.88);
    border: 1px solid #3a3a5e;
    border-radius: 6px;
    padding: 6px;
    overflow: hidden;
    backdrop-filter: blur(6px);
  }
  #top {
    grid-area: top;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; font-size: 12px;
  }
  #top .left, #top .right { display: flex; gap: 8px; align-items: center; }
  #top .title { font-weight: 700; color: #ffd369; letter-spacing: 1px; font-size: 13px; }
  .speed-btn, .mode-btn {
    background: #2a2a4a; border: 1px solid #4a4a6a; color: #eee;
    padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;
  }
  .speed-btn.active, .mode-btn.active { background: #ffd369; color: #1a1a2e; font-weight: 700; }
  /* 左側 */
  #left { grid-area: left; font-size: 11px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .char-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid #3a3a5e;
    border-radius: 6px;
    padding: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .char-card.selected { border-color: #ffd369; background: rgba(255,211,105,0.08); }
  .char-card .header { display: flex; align-items: center; gap: 6px; }
  .char-card .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .char-card .info { flex: 1; min-width: 0; }
  .char-card .name { font-weight: 700; font-size: 11px; color: #ffd369; }
  .char-card .sub { font-size: 9px; color: #aaa; }
  .char-card .state-line { font-size: 9px; color: #c084fc; margin-top: 2px; font-style: italic; }
  .section-title {
    font-size: 9px; color: #888; text-transform: uppercase;
    letter-spacing: 1px; margin: 4px 0 2px;
    border-bottom: 1px solid #3a3a5e; padding-bottom: 2px;
  }
  .detail-panel {
    background: rgba(0,0,0,0.3);
    border-radius: 6px;
    padding: 6px;
    font-size: 9.5px;
  }
  .detail-panel .row { display: flex; justify-content: space-between; margin: 2px 0; }
  .detail-panel .row b { color: #ffd369; }
  .value-bar {
    display: flex; align-items: center; gap: 4px; margin: 2px 0;
    font-size: 9px;
  }
  .value-bar .lbl { width: 52px; color: #aaa; }
  .value-bar .bar {
    flex: 1; height: 4px; background: #2a2a4a; border-radius: 2px; overflow: hidden;
  }
  .value-bar .bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
  .value-bar .val { width: 22px; text-align: right; color: #ffd369; font-size: 8px; }
  /* 中央屋家 */
  #center {
    grid-area: center;
    position: relative;
    background: linear-gradient(to bottom, #87ceeb 0%, #87ceeb 55%, #8b7355 55%, #6b5345 100%);
    overflow: hidden;
  }
  #sky { position: absolute; top: 0; left: 0; right: 0; height: 55%; transition: background 3s; }
  #sun {
    position: absolute; width: 24px; height: 24px; border-radius: 50%;
    background: radial-gradient(circle, #fff6a0, #ffd369);
    box-shadow: 0 0 15px #ffd369; transition: all 3s;
  }
  #house {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 92%; height: 75%;
  }
  #roof {
    position: absolute; top: 0; left: 0; right: 0; height: 18%;
    background: linear-gradient(to bottom, #8b4513, #654321);
    clip-path: polygon(0 100%, 50% 0, 100% 100%);
  }
  #rooms {
    position: absolute; top: 16%; left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: 1fr 1fr 1.5fr 1.2fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px; background: #3a2a1a; padding: 2px;
  }
  .room {
    position: relative;
    background: linear-gradient(to bottom, #f5e6c8, #e8d4a8);
    border: 1px solid #8b7355; overflow: hidden;
  }
  .room-label {
    position: absolute; top: 2px; left: 4px;
    font-size: 9px; color: #654321; font-weight: 700; z-index: 2;
  }
  .char-sprite {
    position: absolute; width: 22px; height: 32px;
    transition: left 1.5s ease-in-out, bottom 1.5s ease-in-out;
    z-index: 10; pointer-events: none;
  }
  .char-sprite .body {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 16px; height: 20px; border-radius: 4px 4px 2px 2px;
  }
  .char-sprite .head {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 12px; background: #f5d4a8; border-radius: 50%;
  }
  .char-sprite .action {
    position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
    font-size: 13px; animation: float 1.5s ease-in-out infinite;
    white-space: nowrap;
  }
  .char-sprite .name-tag {
    position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    font-size: 8px; color: #fff;
    background: rgba(0,0,0,0.6); padding: 1px 4px; border-radius: 3px;
    white-space: nowrap;
  }
  @keyframes float {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -3px); }
  }
  /* 右側思考日誌 */
  #right {
    grid-area: right; font-size: 11px;
    display: flex; flex-direction: column;
  }
  #right h3 {
    font-size: 11px; color: #ffd369; margin-bottom: 4px;
    border-bottom: 1px solid #3a3a5e; padding-bottom: 3px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #thought-log {
    flex: 1; overflow-y: auto;
    font-family: "Menlo", "Consolas", monospace;
    font-size: 10px; line-height: 1.4;
  }
  .thought {
    margin-bottom: 5px; padding: 4px 6px;
    background: rgba(255, 255, 255, 0.03);
    border-left: 2px solid #4a6fa5;
    border-radius: 2px;
    animation: slideIn 0.4s ease-out;
  }
  .thought.decision { border-left-color: #ffd369; }
  .thought.event { border-left-color: #ff6b6b; background: rgba(255, 107, 107, 0.08); }
  .thought.love { border-left-color: #ff69b4; background: rgba(255, 105, 180, 0.08); }
  .thought.family { border-left-color: #6bcf7f; background: rgba(107, 207, 127, 0.08); }
  .thought.council {
    border-left-color: #c084fc; background: rgba(192, 132, 252, 0.08);
    padding-left: 8px;
  }
  .thought.bias { border-left-color: #fbbf24; background: rgba(251, 191, 36, 0.06); font-size: 9px; }
  .thought.reflection { border-left-color: #60a5fa; background: rgba(96, 165, 250, 0.06); font-style: italic; }
  .thought .time { color: #888; font-size: 8px; }
  .thought .tag {
    display: inline-block; padding: 0 3px;
    background: #2a2a4a; border-radius: 3px;
    font-size: 8px; margin-right: 2px; color: #aaa;
  }
  .thought .voice {
    display: inline-block; padding: 0 4px;
    border-radius: 3px; font-size: 8px;
    margin-right: 3px; font-weight: 700;
  }
  .voice.instinct { background: #7f1d1d; color: #fca5a5; }
  .voice.emotion { background: #831843; color: #f9a8d4; }
  .voice.reason { background: #1e3a8a; color: #93c5fd; }
  .voice.moral { background: #14532d; color: #86efac; }
  .voice.social { background: #78350f; color: #fcd34d; }
  .thought .quote {
    margin-top: 3px; padding: 3px 5px;
    background: rgba(255, 211, 105, 0.1);
    border-radius: 3px; color: #ffd369;
    font-style: italic; font-size: 10px;
  }
  .thought .bias-tag {
    display: inline-block; padding: 1px 5px;
    background: rgba(251, 191, 36, 0.2); color: #fbbf24;
    border-radius: 3px; font-size: 8px; margin-right: 3px;
    border: 1px solid rgba(251, 191, 36, 0.4);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  /* 底部 */
  #bottom {
    grid-area: bottom;
    display: flex; gap: 5px; align-items: center;
    font-size: 10px;
  }
  .stat-box {
    flex: 1;
    background: rgba(255, 255, 255, 0.04);
    padding: 4px 6px; border-radius: 5px;
    border: 1px solid #3a3a5e;
  }
  .stat-box .label { font-size: 8px; color: #888; text-transform: uppercase; }
  .stat-box .value { font-size: 12px; color: #ffd369; font-weight: 700; margin-top: 1px; }
  .stat-box .sub { font-size: 9px; color: #aaa; }
  /* 事件彈窗 */
  #event-modal {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(6px);
  }
  #event-modal.show { display: flex; }
  .event-card {
    background: linear-gradient(135deg, #2a2a4a, #1a1a2e);
    border: 2px solid #ffd369;
    border-radius: 12px;
    padding: 16px;
    width: 94%; max-width: 600px;
    max-height: 88vh; overflow-y: auto;
    box-shadow: 0 10px 40px rgba(255, 211, 105, 0.3);
    animation: popIn 0.4s ease-out;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
  .event-card h2 {
    color: #ffd369; font-size: 15px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .event-card .context {
    font-size: 11px; color: #ccc; margin-bottom: 8px;
    padding: 6px; background: rgba(0, 0, 0, 0.3); border-radius: 5px;
  }
  .council-display {
    background: rgba(192, 132, 252, 0.08);
    border-left: 3px solid #c084fc;
    padding: 8px; margin-bottom: 10px; border-radius: 0 5px 5px 0;
    font-size: 10.5px;
  }
  .council-display .voice-line {
    margin: 3px 0; display: flex; gap: 6px; align-items: flex-start;
  }
  .council-display .voice-line .voice-tag {
    flex-shrink: 0; padding: 1px 5px; border-radius: 3px;
    font-size: 9px; font-weight: 700;
  }
  .bias-display {
    background: rgba(251, 191, 36, 0.06);
    border-left: 3px solid #fbbf24;
    padding: 6px; margin-bottom: 10px; border-radius: 0 5px 5px 0;
    font-size: 10px; color: #fbbf24;
  }
  .event-card .choices {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  }
  .choice-btn {
    background: #2a2a4a; border: 1px solid #4a4a6a;
    color: #eee; padding: 8px; border-radius: 5px;
    cursor: pointer; font-size: 11px; text-align: left;
    transition: all 0.2s;
  }
  .choice-btn:hover { background: #3a3a5a; border-color: #ffd369; }
  .choice-btn .icon { font-size: 15px; display: block; margin-bottom: 3px; }
  .choice-btn .desc { font-size: 9px; color: #aaa; margin-top: 2px; }
  .choice-btn .ai-score {
    font-size: 9px; color: #c084fc; margin-top: 3px;
    font-family: monospace;
  }
  .event-card .warning {
    font-size: 9px; color: #ff6b6b; margin-top: 8px;
    text-align: center;
  }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #4a4a6a; border-radius: 2px; }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate-hint {
      display: flex !important;
      position: fixed; inset: 0;
      background: #1a1a2e; z-index: 1000;
      align-items: center; justify-content: center;
      flex-direction: column; color: #ffd369;
      font-size: 14px; text-align: center; padding: 20px;
    }
    #rotate-hint .icon { font-size: 50px; margin-bottom: 15px; animation: rotate 2s infinite; }
    @keyframes rotate {
      0%, 100% { transform: rotate(0); }
      50% { transform: rotate(90deg); }
    }
  }
  #rotate-hint { display: none; }
</style>
</head>
<body>
<div id="rotate-hint">
  <div class="icon">📱</div>
  <div>請將手機橫向<br>Please rotate your device</div>
</div>

<div id="app">
  <div id="top" class="panel">
    <div class="left">
      <span class="title">🧠 人生屋企 · Deep AI</span>
      <span id="date-display">2026/10/07</span>
      <span id="time-display" style="color:#ffd369">08:00</span>
    </div>
    <div class="right">
      <button class="speed-btn" data-speed="0">⏸</button>
      <button class="speed-btn active" data-speed="1">▶</button>
      <button class="speed-btn" data-speed="3">▶▶</button>
      <button class="speed-btn" data-speed="10">▶▶▶</button>
      <button class="speed-btn" data-speed="30">⏩</button>
      <button class="mode-btn" id="detail-btn" title="思考細節">🔬</button>
    </div>
  </div>

  <div id="left" class="panel">
    <div class="section-title">👥 家庭成員</div>
    <div id="char-list"></div>
    <div id="detail-area"></div>
  </div>

  <div id="center">
    <div id="sky"></div>
    <div id="sun"></div>
    <div id="house">
      <div id="roof"></div>
      <div id="rooms">
        <div class="room" data-room="bathroom"><div class="room-label">🚿 浴室</div></div>
        <div class="room" data-room="kitchen"><div class="room-label">🍳 廚房</div></div>
        <div class="room" data-room="living"><div class="room-label">🛋 客廳</div></div>
        <div class="room" data-room="bedroom"><div class="room-label">🛏 睡房</div></div>
        <div class="room" data-room="work"><div class="room-label">💼 工作</div></div>
        <div class="room" data-room="outside"><div class="room-label">🌳 外出</div></div>
      </div>
    </div>
  </div>

  <div id="right" class="panel">
    <h3>
      <span>💭 <span id="log-title">內在思考流</span></span>
      <span id="log-char-name" style="font-size:10px;color:#aaa"></span>
    </h3>
    <div id="thought-log"></div>
  </div>

  <div id="bottom" class="panel">
    <div class="stat-box">
      <div class="label">當前目標</div>
      <div class="value" id="current-goal" style="font-size:10px">—</div>
    </div>
    <div class="stat-box">
      <div class="label">認知負荷</div>
      <div class="value" id="cognitive-load">低</div>
    </div>
    <div class="stat-box">
      <div class="label">人生進度</div>
      <div class="value" id="life-progress">20 / 40 歲</div>
      <div class="sub" id="life-stage">青年期</div>
    </div>
    <div class="stat-box">
      <div class="label">💰 財務</div>
      <div class="value" id="money">$15,000</div>
    </div>
    <div class="stat-box">
      <div class="label">決策</div>
      <div class="value" id="decisions-count">0</div>
      <div class="sub">接納 <span id="accepted-count">0</span></div>
    </div>
  </div>
</div>

<div id="event-modal">
  <div class="event-card">
    <h2><span id="event-icon">⚡</span> <span id="event-title">人生抉擇</span></h2>
    <div class="context" id="event-context"></div>
    <div class="council-display" id="council-display"></div>
    <div class="bias-display" id="bias-display"></div>
    <div class="choices" id="event-choices"></div>
    <div class="warning">⚠️ 角色會根據內在議會辯論結果＋認知偏差決定是否聽從你</div>
  </div>
</div>

<script>
// ============================================================
// 《人生屋企》深度 AI 引擎
// 多層次心理模擬：內在議會 × 認知偏差 × 價值觀 × 目標層次 × 依附風格
// ============================================================

const Game = {
  day: 0, hour: 8, minute: 0,
  speed: 1, paused: false,
  decisionsCount: 0, acceptedCount: 0,
  selectedCharId: 'protagonist',
  characters: {},
  relationships: {},
  detailMode: true, // 顯示詳細思考過程
};

// ============================================================
// 1. 人格子維度系統 (NEO-PI-R 簡化版)
// 每項大人格有 3 個子維度，更細緻
// ============================================================
const PERSONALITY_FACETS = {
  openness: ['fantasy', 'aesthetics', 'ideas'],         // 幻想/美學/思想
  conscientiousness: ['order', 'discipline', 'duty'],   // 秩序/自律/責任
  extraversion: ['warmth', 'gregariousness', 'assertiveness'], // 熱情/社交/自信
  agreeableness: ['trust', 'altruism', 'compliance'],   // 信任/利他/順從
  neuroticism: ['anxiety', 'anger', 'vulnerability'],   // 焦慮/憤怒/脆弱
};

// ============================================================
// 2. 依附風格 (Attachment Styles)
// 影響親密關係行為
// ============================================================
const ATTACHMENT_STYLES = {
  secure:    { name: '安全型', trust: 1.2, clinginess: 0.3, avoidance: 0.2 },
  anxious:   { name: '焦慮型', trust: 0.7, clinginess: 1.5, avoidance: 0.4 },
  avoidant:  { name: '逃避型', trust: 0.6, clinginess: 0.2, avoidance: 1.5 },
  disorganized: { name: '混亂型', trust: 0.4, clinginess: 1.2, avoidance: 1.2 },
};

// ============================================================
// 3. 價值觀羅盤 (Schwartz 價值觀簡化)
// ============================================================
const VALUES_DEF = [
  { key: 'achievement', name: '成就', icon: '🏆' },
  { key: 'security', name: '安全', icon: '🛡' },
  { key: 'hedonism', name: '享樂', icon: '🎉' },
  { key: 'benevolence', name: '仁慈', icon: '🤝' },
  { key: 'universalism', name: '博愛', icon: '🌍' },
  { key: 'selfDirection', name: '自主', icon: '🧭' },
  { key: 'stimulation', name: '刺激', icon: '⚡' },
  { key: 'tradition', name: '傳統', icon: '🏛' },
  { key: 'family', name: '家庭', icon: '👨‍👩‍👧' },
  { key: 'wealth', name: '財富', icon: '💰' },
];

// ============================================================
// 4. 內在議會 (5 個內在聲音)
// ============================================================
const INNER_VOICES = {
  instinct: { name: '本能', color: '#fca5a5', class: 'instinct',
    focus: ['hunger', 'sleep', 'safety', 'sex'],
    tone: ['想要...', '好想要...', '身體話我知...', '本能叫我...'] },
  emotion: { name: '情感', color: '#f9a8d4', class: 'emotion',
    focus: ['love', 'social', 'fun'],
    tone: ['我覺得...', '我心入面...', '情緒上...', '我好...'] },
  reason: { name: '理智', color: '#93c5fd', class: 'reason',
    focus: ['safety', 'achievement', 'wealth'],
    tone: ['理性嚟講...', '從長遠睇...', '邏輯上...', '數據顯示...'] },
  moral: { name: '道德', color: '#86efac', class: 'moral',
    focus: ['benevolence', 'universalism', 'family'],
    tone: ['應該...', '正確嘅做法係...', '對得住良心...', '道德上...'] },
  social: { name: '社會', color: '#fcd34d', class: 'social',
    focus: ['achievement', 'tradition', 'security'],
    tone: ['人哋會點睇...', '社會期望...', '別人會...', '面子問題...'] },
};

// ============================================================
// 5. 認知偏差引擎
// ============================================================
const COGNITIVE_BIASES = [
  { id: 'loss_aversion', name: '損失厭惡',
    trigger: (c, ctx) => ctx.hasLoss,
    effect: '傾向避免損失多於獲得同等收益',
    modifier: (scores) => {
      // 風險選項評分降低
      scores.forEach(s => { if (s.risk > 0.5) s.score -= 15; });
    }},
  { id: 'status_quo', name: '現狀偏差',
    trigger: (c, ctx) => c.personality.conscientiousness < 5 || c.personality.neuroticism > 6,
    effect: '傾向維持現狀，抗拒改變',
    modifier: (scores) => {
      scores.forEach(s => { if (s.changeLevel > 0.5) s.score -= 10; });
    }},
  { id: 'confirmation', name: '確認偏差',
    trigger: (c, ctx) => c.emotionalState.intensity > 50,
    effect: '傾向尋找支持自己現有信念嘅資訊',
    modifier: (scores, c, ctx) => {
      // 符合當前情緒嘅選項加分
      scores.forEach(s => {
        if (s.emotionalAlignment > 0.5) s.score += 8;
      });
    }},
  { id: 'anchoring', name: '錨定效應',
    trigger: (c, ctx) => ctx.hasReferenceValue,

// 7. 角色工廠（深度心理屬性）
// ============================================================
function createCharacter(cfg) {
  const p = {
    openness: cfg.openness ?? 5,
    conscientiousness: cfg.conscientiousness ?? 5,
    extraversion: cfg.extraversion ?? 5,
    agreeableness: cfg.agreeableness ?? 5,
    neuroticism: cfg.neuroticism ?? 5,
  };
  // 生成子維度（基於大人格 ± 隨機）
  const facets = {};
  for (const [trait, sub] of Object.entries(PERSONALITY_FACETS)) {
    facets[trait] = {};
    sub.forEach(s => {
      facets[trait][s] = Math.max(1, Math.min(10, p[trait] + (Math.random() * 4 - 2)));
    });
  }
  // 依附風格（基於性格）
  let attachStyle = 'secure';
  if (p.neuroticism > 6 && p.agreeableness > 5) attachStyle = 'anxious';
  else if (p.openness < 4 && p.neuroticism > 5) attachStyle = 'avoidant';
  else if (p.neuroticism > 7) attachStyle = Math.random() < 0.5 ? 'anxious' : 'disorganized';

  // 價值觀（隨機生成，受性格影響）
  const values = {};
  VALUES_DEF.forEach(v => {
    let base = 3 + Math.random() * 5;
    if (v.key === 'achievement') base += p.conscientiousness * 0.4;
    if (v.key === 'hedonism') base += p.extraversion * 0.3 + p.openness * 0.2;
    if (v.key === 'benevolence') base += p.agreeableness * 0.5;
    if (v.key === 'selfDirection') base += p.openness * 0.4;
    if (v.key === 'tradition') base += (10 - p.openness) * 0.3;
    if (v.key === 'family') base += p.agreeableness * 0.3;
    values[v.key] = Math.max(1, Math.min(10, base));
  });

  // 內在聲音權重（受性格影響）
  const voiceWeights = {
    instinct: 3 + p.neuroticism * 0.3 + (10 - p.conscientiousness) * 0.3,
    emotion: 3 + p.neuroticism * 0.5 + p.openness * 0.2,
    reason: 3 + p.conscientiousness * 0.5 + p.openness * 0.3,
    moral: 3 + p.agreeableness * 0.5,
    social: 3 + p.extraversion * 0.4 + (10 - p.openness) * 0.2,
  };

  return {
    id: cfg.id,
    name: cfg.name,
    avatar: cfg.avatar,
    color: cfg.color || '#4a6fa5',
    age: cfg.age,
    gender: cfg.gender || 'M',
    isProtagonist: cfg.isProtagonist || false,
    // 深度心理
    personality: p,
    facets,
    attachmentStyle: attachStyle,
    values,
    voiceWeights,
    // 自我概念
    selfConcept: {
      selfEsteem: 50 + (p.conscientiousness - 5) * 5 + (Math.random() * 20 - 10),
      selfEfficacy: 50, // 對自己能力的信心
      identity: cfg.isProtagonist ? '尋找自我' : '穩定',
    },
    // 目標層次
    goals: {
      ultimate: cfg.isProtagonist ? '尋找人生意義' : '穩定生活',
      life: [],
      yearly: [],
      current: null,
    },
    // 認知狀態
    cognitiveLoad: 0, // 0-100
    emotionalState: { intensity: 0, valence: 0 },
    moodHistory: [],
    // 習慣系統
    habits: {}, // action_key -> strength (0-100)
    // 基礎屬性
    needs: {
      hunger: cfg.hunger ?? 60, sleep: cfg.sleep ?? 70, hygiene: cfg.hygiene ?? 75,
      social: cfg.social ?? 40, fun: cfg.fun ?? 50, safety: cfg.safety ?? 55, love: cfg.love ?? 30,
    },
    mood: { happy: 0, calm: 20, confident: 10, fulfilled: 0 },
    money: cfg.money ?? 15000, debt: cfg.debt ?? 0,
    job: cfg.job || null, jobSatisfaction: cfg.jobSatisfaction ?? 50,
    home: cfg.home ?? '劏房（租）', homeLevel: cfg.homeLevel ?? 0,
    relationship: cfg.relationship ?? '單身',
    health: { physical: cfg.physical ?? 90, mental: cfg.mental ?? 85, disease: null, diseaseDuration: 0 },
    memories: [],
    skills: { cooking: cfg.cooking ?? 2, fitness: cfg.fitness ?? 3, social: cfg.social ?? 4, career: cfg.career ?? 2 },
    currentAction: null, currentRoom: cfg.currentRoom ?? 'bedroom', actionTimer: 0,
    spriteEl: null,
    children: [], parentId: cfg.parentId || null,

    birthDay: cfg.birthDay ?? 0,
    // 決策歷史（用於學習）
    decisionHistory: [],
  };
}

// ============================================================
// 8. 內在議會決策引擎
// ============================================================
function innerCouncil(c, actionKey, act, context) {
  const voices = {};
  const stage = getLifeStage(c.age);

  for (const [vKey, vDef] of Object.entries(INNER_VOICES)) {
    let score = 0;
    let statement = '';

    // 1. 需求匹配
    const needMatch = (act.needFocus || []).reduce((sum, n) => {
      const needVal = c.needs[n];
      return sum + (needVal < 40 ? (40 - needVal) * 0.5 : 0);
    }, 0);
    score += needMatch;

    // 2. 價值觀對齊
    const valueAlign = (act.valueAlignment || []).reduce((sum, v) => {
      return sum + (c.values[v] || 0) * 0.5;
    }, 0);
    score += valueAlign;

    // 3. 生命階段對齊
    const stageAlign = (stage.focus || []).reduce((sum, v) => {
      if ((act.valueAlignment || []).includes(v)) return sum + 5;
      return sum;
    }, 0);
    score += stageAlign;

    // 4. 性格權重
    score *= (c.voiceWeights[vKey] / 5);

    // 5. 情緒狀態影響
    if (vKey === 'emotion') score *= (1 + c.emotionalState.intensity / 100);
    if (vKey === 'reason') score *= (1 - c.cognitiveLoad / 200);
    if (vKey === 'instinct' && c.health.physical < 50) score *= 1.3;

    // 6. 習慣加成
    const habitStrength = c.habits[actionKey] || 0;
    if (vKey === 'instinct') score += habitStrength * 0.3;

    // 生成語句
    const tone = vDef.tone[Math.floor(Math.random() * vDef.tone.length)];
    if (score > 30) {
      if (vKey === 'instinct') statement = `${tone} ${act.name}可以滿足基本需要`;
      else if (vKey === 'emotion') statement = `${tone} 想做${act.name}，會開心啲`;
      else if (vKey === 'reason') statement = `${tone}，${act.name}係合理選擇`;
      else if (vKey === 'moral') statement = `${tone}，${act.name}係正確嘅`;
      else if (vKey === 'social') statement = `${tone}，${act.name}比較得體`;
    } else if (score < 10) {
      statement = `${tone} 唔太想${act.name}`;
    } else {
      statement = `${tone} ${act.name}有少少吸引力`;
    }

    voices[vKey] = { score: Math.max(0, Math.round(score)), statement };
  }

  return voices;
}

// ============================================================
// 9. 認知偏差應用
// ============================================================
function applyCognitiveBiases(c, scores, context) {
  const activeBiases = [];
  COGNITIVE_BIASES.forEach(bias => {
    if (bias.trigger(c, context)) {
      bias.modifier(scores, c, context);
      activeBiases.push(bias);
    }
  });
  return activeBiases;
}

// ============================================================
// 10. 雙系統思考 (System 1 vs System 2)
// ============================================================
function dualProcessDecision(c, candidates, context) {
  // System 1: 快速直覺（基於習慣＋情緒＋本能）
  const system1Scores = candidates.map(cand => {
    let s = 0;
    s += (c.habits[cand.key] || 0) * 0.5; // 習慣強度
    s += c.emotionalState.intensity > 50 ? (Math.random() * 30) : 0; // 情緒驅動
    s += c.cognitiveLoad > 60 ? (Math.random() * 20) : 0; // 認知負荷高時傾向簡單選擇
    return { ...cand, s1Score: s };
  });

  // System 2: 慢速理性（基於價值觀＋目標＋反思）
  const system2Scores = candidates.map(cand => {
    let s = cand.score; // 基礎效用分
    // 目標對齊
    if (c.goals.current && cand.act.valueAlignment) {
      // 簡化：價值觀對齊即目標對齊
      s += cand.act.valueAlignment.length * 3;
    }
    // 自我反思加成（高開放性）
    if (c.personality.openness > 6) s += 5;
    return { ...cand, s2Score: s };
  });

  // 決定使用哪個系統
  const useSystem1 = c.cognitiveLoad > 60 || c.emotionalState.intensity > 70 || Math.random() < 0.4;

  return { system1Scores, system2Scores, useSystem1 };
}

// ============================================================
// 11. 完整 AI 思考循環
// ============================================================
function aiThink(c) {
  const needs = c.needs;
  const lowestNeed = NEEDS_DEF.reduce((a, b) => needs[a.key] < needs[b.key] ? a : b);

  // 更新情緒狀態
  const avgNeed = Object.values(needs).reduce((a,b)=>a+b,0) / Object.keys(needs).length;
  c.emotionalState.intensity = Math.abs(avgNeed - 50) * 2;
  c.emotionalState.valence = avgNeed - 50;

  // 更新認知負荷（基於多重壓力）
  let load = 0;
  if (c.health.disease) load += 20;
  if (c.needs.sleep < 30) load += 15;
  if (c.needs.hunger < 30) load += 10;
  if (c.money < 5000) load += 15;
  if (c.loveStage === 'cold_war') load += 20;
  if (c.job && c.jobSatisfaction < 40) load += 10;
  c.cognitiveLoad = Math.max(0, Math.min(100, load));

  if (c.id === Game.selectedCharId || c.isProtagonist) {
    addThought(c.id, '感知', `最迫切：${lowestNeed.icon}${lowestNeed.name}(${Math.round(needs[lowestNeed.key])}) · 認知負荷 ${Math.round(c.cognitiveLoad)}`);
  }

  // 評估可行行動
  const candidates = [];
  for (const [key, act] of Object.entries(ACTIONS)) {
    if (!act.condition(c)) continue;
    let score = 50;
    for (const [nk, nv] of Object.entries(act.effects)) {
      if (nv > 0 && needs[nk] < 50) score += (50 - needs[nk]) * 0.5;
      if (nv < 0 && needs[nk] < 30) score -= 30;
    }
    if (act.cost && c.money < act.cost * 3) score -= 20;
    score += (Math.random() - 0.5) * 15;
    candidates.push({
      key, act, score,
      risk: act.cost ? Math.min(1, act.cost / c.money) : 0,
      changeLevel: ['work', 'eat_out', 'socialize', 'date'].includes(key) ? 0.7 : 0.3,
      upside: ['work', 'exercise', 'read'].includes(key) ? 0.7 : 0.4,
      emotionalAlignment: act.voice === 'emotion' ? 0.8 : 0.3,
      continuesExisting: ['work', 'chat_partner'].includes(key),
      frame: act.cost ? 'loss' : 'gain',
    });
  }

  if (candidates.length === 0) {
    c.currentAction = ACTIONS.chill;
    c.actionTimer = 0.5;
    return;
  }

  // 應用認知偏差
  const context = {
    hasLoss: c.money < 10000 || c.health.disease,
    hasInvestment: c.job || c.loveStage,
    hasReferenceValue: false,
  };
  const activeBiases = applyCognitiveBiases(c, candidates, context);

  // 雙系統決策
  const { useSystem1 } = dualProcessDecision(c, candidates, context);

  candidates.sort((a, b) => b.score - a.score);
  const chosen = candidates[0];

  // 內在議會（只為最終選擇）
  const council = innerCouncil(c, chosen.key, chosen.act, context);

  if (c.id === Game.selectedCharId || c.isProtagonist) {
    // 顯示內在議會
    if (Game.detailMode) {
      const councilText = Object.entries(council)
        .filter(([k, v]) => v.statement)
        .map(([k, v]) => {
          const vDef = INNER_VOICES[k];
          return `<span class="voice ${vDef.class}">${vDef.name}</span> ${v.statement} <span style="color:#888;font-size:8px">(${v.score})</span>`;
        }).join('<br>');
      addThought(c.id, '🏛 內在議會', councilText, false, false, 'council');

      // 顯示認知偏差
      if (activeBiases.length > 0) {
        const biasText = activeBiases.map(b => `<span class="bias-tag">${b.name}</span> ${b.effect}`).join(' · ');
        addThought(c.id, '⚠️ 認知偏差', biasText, false, false, 'bias');
      }

      // 顯示使用哪個系統
      const sysText = useSystem1 ? '⚡ System 1（直覺）主導' : '🧠 System 2（理性）主導';
      addThought(c.id, '🔀 決策模式', sysText, false, false, 'reflection');
    }

    addThought(c.id, '決定', `${chosen.act.icon}${chosen.act.name}(分${Math.round(chosen.score)})`, true);
    addQuote(c.id, chosen.act.thought);

    // 自我反思（高開放性角色偶爾反思）
    if (chosen.act.triggersReflection || (c.personality.openness > 7 && Math.random() < 0.1)) {
      const reflections = [
        `我最近係咪太${lowestNeed.name}？要調整下...`,
        `人生係咪應該有更大嘅目標？`,
        `我嘅選擇係咪真係符合自己價值觀？`,
        `時間過得好快...我要珍惜當下`,
      ];
      addThought(c.id, '🪞 自我反思', reflections[Math.floor(Math.random() * reflections.length)], false, false, 'reflection');
    }
  }

  c.currentAction = chosen.act;
  c.actionTimer = chosen.act.duration;

  // 更新習慣
  c.habits[chosen.key] = Math.min(100, (c.habits[chosen.key] || 0) + 5);
  // 其他習慣衰減
  for (const k in c.habits) {
    if (k !== chosen.key) c.habits[k] = Math.max(0, c.habits[k] - 1);
  }

  // 記錄決策
  c.decisionHistory.push({
    day: Game.day, action: chosen.key, score: chosen.score,
    system: useSystem1 ? 'S1' : 'S2',
    biases: activeBiases.map(b => b.id),
  });
}

  else if (h < 17) { skyColor = 'linear-gradient(to bottom, #87ceeb, #b0e0e6)'; sunOpacity = 1; }

function executeAction(c, deltaHours) {
  const act = c.currentAction;
  if (!act) return;
  const ratio = deltaHours / Math.max(act.duration, 0.1);
  for (const [k, v] of Object.entries(act.effects)) {
    if (c.needs[k] !== undefined) c.needs[k] = Math.max(0, Math.min(100, c.needs[k] + v * ratio));
  }
  if (act.cost) c.money -= act.cost * ratio;
  if (act.income) c.money += act.income * ratio;
  if (act.healthBonus) {
    for (const [k, v] of Object.entries(act.healthBonus)) c.health[k] = Math.min(100, c.health[k] + v * ratio);
  }
  if (act.cureDisease && c.health.disease && Math.random() < 0.3 * ratio) {
    c.health.disease = null;
    if (c.id === Game.selectedCharId || c.isProtagonist) addThought(c.id, '💊', '病好返啦！', false, true);
  }
  if (act.affectionGain && c.loveTargetId) {
    const rel = getRelation(c.id, c.loveTargetId);
    rel.affection = Math.min(100, rel.affection + act.affectionGain * ratio);
  }
  c.actionTimer -= deltaHours;
  if (c.actionTimer <= 0) {
    if (c.id === Game.selectedCharId || c.isProtagonist) {
      document.getElementById('today-action').textContent = act.icon + ' ' + act.name;
    }
    c.currentAction = null;
  }
}

function tick() {
  if (Game.paused || Game.speed === 0) return;
  const baseDelta = 0.04 * Game.speed;
  Game.hour += baseDelta;
  Game.minute = Math.floor((Game.hour % 1) * 60);
  if (Game.hour >= 24) {
    Game.hour -= 24;
    Game.day++;
    Object.values(Game.characters).forEach(c => {
      c.age = Math.floor((Game.day - c.birthDay) / 365);
    });
    dailySettlement();
  }
  Object.values(Game.characters).forEach(c => {
    if (c.currentAction) executeAction(c, baseDelta);
    else aiThink(c);
    NEEDS_DEF.forEach(n => {
      c.needs[n.key] = Math.max(0, c.needs[n.key] - n.decay * baseDelta / 24);
    });
    updateHealth(c, baseDelta);
    const avgNeed = Object.values(c.needs).reduce((a,b)=>a+b,0) / Object.keys(c.needs).length;
    c.mood.happy += (avgNeed - 50) * 0.01 * baseDelta;
    c.mood.calm += (c.needs.sleep/100 - 0.5) * 0.01 * baseDelta;
    for (const k in c.mood) c.mood[k] = Math.max(-100, Math.min(100, c.mood[k]));
    // 記錄情緒歷史
    c.moodHistory = c.moodHistory || [];
    c.moodHistory.push(c.mood.happy);
    if (c.moodHistory.length > 20) c.moodHistory.shift();
    // 自尊變化
    if (avgNeed > 70) c.selfConcept.selfEsteem = Math.min(100, c.selfConcept.selfEsteem + 0.05 * baseDelta);
    if (avgNeed < 30) c.selfConcept.selfEsteem = Math.max(0, c.selfConcept.selfEsteem - 0.1 * baseDelta);
  });
  checkLoveEvents();
  checkMajorEvents();
  renderCharList();
  renderSprites();
  renderSky();
  renderStatus();
  renderDateTime();
}

function updateHealth(c, delta) {
  const h = c.health;
  if (c.needs.sleep < 30) h.physical -= 0.5 * delta / 24;
  if (c.needs.hunger < 30) h.physical -= 0.3 * delta / 24;
  if (c.needs.sleep > 70 && c.needs.hunger > 60) h.physical = Math.min(100, h.physical + 0.1 * delta / 24);
  if (c.needs.social < 30) h.mental -= 0.3 * delta / 24;
  if (c.needs.fun > 60) h.mental = Math.min(100, h.mental + 0.1 * delta / 24);
  if (h.disease) {
    h.diseaseDuration += delta / 24;
    h.physical -= 0.5 * delta / 24;
    if (h.disease === 'depression') h.mental -= 0.8 * delta / 24;
  }
  if (!h.disease && Math.random() < 0.001 * delta) {
    const diseases = ['cold', 'flu'];
    if (h.mental < 40) diseases.push('depression');
    if (c.age > 35) diseases.push('chronic');
    h.disease = diseases[Math.floor(Math.random() * diseases.length)];
    h.diseaseDuration = 0;
    if (c.id === Game.selectedCharId || c.isProtagonist) addThought(c.id, '🤒', `病咗：${h.disease}`, false, true);
  }
  h.physical = Math.max(0, Math.min(100, h.physical));
  h.mental = Math.max(0, Math.min(100, h.mental));
}

function dailySettlement() {
  Object.values(Game.characters).forEach(c => {
    let dailyCost = 80;
    if (c.debt > 0) dailyCost += c.debt * 0.0001;
    c.money -= dailyCost;
    if (c.job && Game.day % 30 === 0) c.money += c.job.salary;
  });
  if (Game.characters.protagonist.age >= 40) endGame();
}

function getRelationKey(id1, id2) { return [id1, id2].sort().join(':'); }
function getRelation(id1, id2) {
  const key = getRelationKey(id1, id2);
  if (!Game.relationships[key]) Game.relationships[key] = { affection: 30, stage: 'stranger' };
  return Game.relationships[key];
}

function triggerEvent(evt) {
  if (!evt || document.getElementById('event-modal').classList.contains('show')) return;
  Game.paused = true;
  Game.decisionsCount++;
  const p = Game.characters.protagonist;
  document.getElementById('event-icon').textContent = evt.icon;
  document.getElementById('event-title').textContent = evt.title;
  document.getElementById('event-context').textContent = evt.context;

  // 內在議會辯論（顯示所有選項的內在聲音）
  const councilEl = document.getElementById('council-display');
  let councilHTML = '<div style="font-size:9px;color:#c084fc;margin-bottom:4px">🏛 內在議會辯論：</div>';
  evt.choices.slice(0, 2).forEach((ch, idx) => {
    councilHTML += `<div style="margin:4px 0;padding:4px;background:rgba(0,0,0,0.2);border-radius:3px">`;
    councilHTML += `<div style="color:#ffd369;font-size:10px;margin-bottom:2px">選項 ${idx+1}：${ch.text}</div>`;
    // 簡化：顯示 3 個主要聲音
    const voices = ['instinct', 'reason', 'emotion'];
    voices.forEach(vKey => {
      const vDef = INNER_VOICES[vKey];
      let score = 30 + Math.random() * 40;
      score *= (p.voiceWeights[vKey] / 5);
      if (ch.risk > 0.7 && vKey === 'reason') score *= 0.8;
      if (ch.upside > 0.7 && vKey === 'emotion') score *= 1.2;
      let statement = '';
      if (score > 40) statement = `支持 · ${Math.round(score)}分`;
      else if (score > 20) statement = `中立 · ${Math.round(score)}分`;
      else statement = `反對 · ${Math.round(score)}分`;
      councilHTML += `<div class="voice-line"><span class="voice-tag" style="background:${vDef.color};color:#000">${vDef.name}</span><span>${statement}</span></div>`;
    });
    councilHTML += `</div>`;
  });
  councilEl.innerHTML = councilHTML;

  // 認知偏差
  const context = { hasLoss: p.money < 10000, hasInvestment: !!p.job };
  const activeBiases = COGNITIVE_BIASES.filter(b => b.trigger(p, context));
  const biasEl = document.getElementById('bias-display');
  if (activeBiases.length > 0) {
    biasEl.innerHTML = '⚠️ 活躍認知偏差：' + activeBiases.slice(0,3).map(b => `<b>${b.name}</b>`).join(' · ');
    biasEl.style.display = 'block';
  } else {
    biasEl.style.display = 'none';
  }

  // 選項（顯示 AI 評分）
  const choicesEl = document.getElementById('event-choices');
  choicesEl.innerHTML = '';
  evt.choices.forEach((ch, i) => {
    // 計算 AI 評分
    let aiScore = 50;
    aiScore += (ch.upside - 0.5) * 30;
    aiScore -= (ch.risk - 0.5) * p.facets.neuroticism.anxiety * 2;
    aiScore += (p.values.achievement / 10) * (ch.upside * 10);
    aiScore += (p.values.security / 10) * ((1-ch.risk) * 10);
    aiScore += (p.values.selfDirection / 10) * (ch.changeLevel * 10);
    aiScore += (Math.random() - 0.5) * 20;
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `
      <span class="icon">${ch.icon}</span><b>${ch.text}</b>
      <div class="desc">${ch.desc}</div>
      <div class="ai-score">AI 傾向度：${Math.round(aiScore)}/100</div>
    `;
    btn.onclick = () => handleChoice(evt, ch, i, aiScore);
    choicesEl.appendChild(btn);
  });
  document.getElementById('event-modal').classList.add('show');
  addThought(p.id, '⚡ 事件', `${evt.icon} ${evt.title}`, false, true);
}

function checkMajorEvents() {
  if (document.getElementById('event-modal').classList.contains('show')) return;
  const p = Game.characters.protagonist;
  for (const evt of MAJOR_EVENTS) {
    if (evt.trigger(p)) { triggerEvent(evt); return; }
  }
}

function handleChoice(evt, choice, idx, aiScore) {
  const p = Game.characters.protagonist;
  // 採納機率基於 AI 評分 + 性格
  let acceptProb = aiScore / 100;
  acceptProb += (p.personality.agreeableness - 5) * 0.04;
  acceptProb -= (p.personality.neuroticism - 5) * 0.03;
  const isAIPreference = idx === 0;
  if (isAIPreference) acceptProb += 0.2;
  else acceptProb -= 0.15;
  acceptProb += (Math.random() - 0.5) * 0.2;
  acceptProb = Math.max(0.05, Math.min(0.95, acceptProb));
  const accepted = Math.random() < acceptProb;
  const finalChoice = accepted ? choice : evt.choices[0];
  finalChoice.action(p);

  const resultDiv = document.createElement('div');
  resultDiv.style.cssText = 'margin-top:10px;padding:8px;background:rgba(255,211,105,0.1);border-radius:5px;font-size:11px;';
  if (accepted) {
    Game.acceptedCount++;
    resultDiv.innerHTML = `✅ <b>志明聽從咗你</b>：「${choice.text}」<br><span style="color:#aaa;font-size:10px">內在議會達成共識</span>`;
  } else {
    resultDiv.innerHTML = `❌ <b>志明冇聽你</b>，佢揀咗：「${evt.choices[0].text}」<br><i style="color:#c084fc;font-size:10px">「內在議會辯論後，理智/情感佔上風...」</i>`;
  }
  document.getElementById('event-modal').querySelector('.event-card').appendChild(resultDiv);
  addThought(p.id, '決定', `${accepted?'✅':'❌'} ${finalChoice.text}`, true, true);

  setTimeout(() => {
    document.getElementById('event-modal').classList.remove('show');
    resultDiv.remove();
    Game.paused = false;
    renderStatus();
  }, 2500);
}

// 戀愛事件（簡化）
function checkLoveEvents() {
  const p = Game.characters.protagonist;
  if (!p.loveStage && p.age >= 23 && p.age < 40 && Math.random() < 0.0003 * Game.speed) {
    const id = 'lover_' + Date.now();
    const names = ['阿May', '阿詩', '阿琪', '阿玲'];
    const name = names[Math.floor(Math.random() * names.length)];
    const lover = createCharacter({
      id, name, avatar: '👩', color: '#ff69b4',
      age: p.age + Math.floor(Math.random() * 4 - 2), gender: 'F',
      openness: 4 + Math.floor(Math.random() * 5),
      conscientiousness: 4 + Math.floor(Math.random() * 5),
      extraversion: 4 + Math.floor(Math.random() * 5),
      agreeableness: 4 + Math.floor(Math.random() * 5),
      neuroticism: 4 + Math.floor(Math.random() * 5),
      money: 20000, job: { title: '文職', salary: 18000 },
      home: '自己單位', currentRoom: 'outside',
    });
    lover.birthDay = Game.day - (lover.age * 365);
    Game.characters[id] = lover;
    p.loveStage = 'crush';
    p.loveTargetId = id;
    const rel = getRelation(p.id, id);
    rel.affection = 50;
    addThought(p.id, '💘', `認識咗${name}！`, false, true, 'love');
  }
  if (p.loveStage && p.loveTargetId) {
    const rel = getRelation(p.id, p.loveTargetId);
    rel.affection = Math.max(0, rel.affection - 0.05);
    if (p.loveStage === 'crush' && rel.affection > 65 && Math.random() < 0.005) {
      p.loveStage = 'dating'; p.relationship = '拍拖中';
      addThought(p.id, '💕', '正式拍拖！', false, true, 'love');
    }
  }
}

function renderStatus() {
  const p = Game.characters.protagonist;
  const stage = getLifeStage(p.age);
  document.getElementById('money').textContent = '$' + Math.round(p.money).toLocaleString();
  document.getElementById('life-progress').textContent = `${p.age} / 40 歲`;
  document.getElementById('life-stage').textContent = stage.name;
  document.getElementById('decisions-count').textContent = Game.decisionsCount;
  document.getElementById('accepted-count').textContent = Game.acceptedCount;
  document.getElementById('cognitive-load').textContent =
    p.cognitiveLoad < 30 ? '低' : p.cognitiveLoad < 60 ? '中' : '高';
  document.getElementById('current-goal').textContent = stage.task;
}

function renderDateTime() {
  const year = 2026 + Math.floor(Game.day / 365);
  const dayOfYear = Game.day % 365;
  const month = Math.floor(dayOfYear / 30) + 1;
  const day = (dayOfYear % 30) + 1;
  document.getElementById('date-display').textContent = `${year}/${String(month).padStart(2,'0')}/${String(day).padStart(2,'0')}`;
  document.getElementById('time-display').textContent = `${String(Game.hour).padStart(2,'0')}:${String(Game.minute).padStart(2,'0')}`;
}

function endGame() {
  Game.paused = true;
  const p = Game.characters.protagonist;
  alert(`🎬 40 歲人生總結\n\n職業：${p.job ? p.job.title : '無業'}\n財務：$${Math.round(p.money).toLocaleString()}\n關係：${p.relationship}\n決策：${Game.decisionsCount} 次（接納 ${Game.acceptedCount}）\n依附風格：${ATTACHMENT_STYLES[p.attachmentStyle].name}`);
}

document.querySelectorAll('.speed-btn[data-speed]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.speed-btn[data-speed]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    Game.speed = parseInt(btn.dataset.speed);
    Game.paused = Game.speed === 0;
  };
});

document.getElementById('detail-btn').onclick = () => {
  Game.detailMode = !Game.detailMode;
  document.getElementById('detail-btn').classList.toggle('active', Game.detailMode);
};

function init() {
  Game.characters.protagonist.birthDay = 0;
  renderCharList();
  renderSprites();
  renderSky();
  renderStatus();
  renderDateTime();
  document.getElementById('detail-btn').classList.add('active');
  setInterval(tick, 100);
  addThought('protagonist', '🌟', '陳志明，20 歲，深度 AI 引擎啟動', false, true);
  addThought('protagonist', '🧠', '內在議會 × 認知偏差 × 價值觀 × 目標層次 就緒', false, false, 'reflection');
}

init();
</script>
