<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>少年人生 · 修復版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif; background:#0f0f1e; color:#eee; user-select:none; }
  #app {
    width:100vw; height:100vh;
    display:grid;
    grid-template-rows:36px 1fr 72px;
    /* ✅ 修復：中間縮小，左右加寬 */
    grid-template-columns:240px 140px 1fr;
    grid-template-areas:"top top top" "left center right" "bottom bottom bottom";
    gap:4px; padding:4px;
  }
  .panel { background:rgba(20,20,40,.88); border:1px solid #3a3a5e; border-radius:6px; padding:6px; overflow:hidden; backdrop-filter:blur(6px); }
  #top { grid-area:top; display:flex; align-items:center; justify-content:space-between; padding:0 8px; font-size:11px; }
  #top .left,#top .right { display:flex; gap:5px; align-items:center; }
  #top .title { font-weight:700; color:#ffd369; font-size:12px; }
  .btn { background:#2a2a4a; border:1px solid #4a4a6a; color:#eee; padding:2px 6px; border-radius:4px; cursor:pointer; font-size:10px; }
  .btn.active { background:#ffd369; color:#1a1a2e; font-weight:700; }
  .btn:hover { background:#3a3a5a; }
  .btn.save { background:#10b981; border-color:#10b981; color:#fff; }
  .btn.load { background:#3b82f6; border-color:#3b82f6; color:#fff; }
  #save-status { font-size:9px; color:#10b981; }
  #left { grid-area:left; font-size:10px; overflow-y:auto; display:flex; flex-direction:column; gap:3px; }
  .section-title { font-size:9px; color:#888; text-transform:uppercase; letter-spacing:1px; margin:3px 0 2px; border-bottom:1px solid #3a3a5e; padding-bottom:2px; }
  .char-card { background:rgba(255,255,255,.04); border:1px solid #3a3a5e; border-radius:5px; padding:4px; cursor:pointer; }
  .char-card.selected { border-color:#ffd369; background:rgba(255,211,105,.08); }
  .char-card .header { display:flex; align-items:center; gap:4px; }
  .char-card .avatar { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .char-card .info { flex:1; min-width:0; }
  .char-card .name { font-weight:700; font-size:10px; color:#ffd369; }
  .char-card .sub { font-size:8px; color:#aaa; }
  .char-card .state-line { font-size:8px; color:#c084fc; margin-top:1px; font-style:italic; }
  .trait-row { display:flex; gap:3px; flex-wrap:wrap; margin:2px 0; }
  .trait-tag { padding:1px 4px; border-radius:3px; font-size:8px; }
  .trait-good { background:rgba(107,207,127,.2); color:#6bcf7f; border:1px solid rgba(107,207,127,.4); }
  .trait-bad { background:rgba(255,107,107,.2); color:#ff6b6b; border:1px solid rgba(255,107,107,.4); }
  /* ✅ 修復：中間區域簡化 */
  #center {
    grid-area:center;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:background 2s;
  }
  #scene-bg { position:absolute; inset:0; transition:all 2s; }
  #scene-icon {
    position:relative; z-index:2;
    font-size:40px; margin-bottom:8px;
  }
  #scene-name {
    position:relative; z-index:2;
    font-size:11px; color:#ffd369; font-weight:700;
    text-shadow:0 1px 3px rgba(0,0,0,.5);
  }
  #scene-mood {
    position:relative; z-index:2;
    font-size:10px; color:#ff69b4; margin-top:4px;
  }
  .char-sprite { position:relative; z-index:3; width:28px; height:40px; margin-top:10px; }
  .char-sprite .body { position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:18px; height:22px; border-radius:4px 4px 2px 2px; }
  .char-sprite .head { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); width:13px; height:13px; background:#f5d4a8; border-radius:50%; }
  .char-sprite .action { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); font-size:14px; animation:float 1.5s infinite; white-space:nowrap; }
  @keyframes float { 0%,100%{transform:translate(-50%,0)} 50%{transform:translate(-50%,-3px)} }
  #right { grid-area:right; font-size:11px; display:flex; flex-direction:column; }
  .tab-bar { display:flex; gap:4px; margin-bottom:4px; }
  .tab-btn {
    flex:1; padding:4px 6px; border-radius:4px;
    background:rgba(255,255,255,.04); border:1px solid #3a3a5e;
    color:#aaa; font-size:10px; cursor:pointer; text-align:center;
  }
  .tab-btn.active { background:rgba(255,211,105,.1); border-color:#ffd369; color:#ffd369; font-weight:700; }
  .tab-content { flex:1; overflow-y:auto; display:none; }
  .tab-content.active { display:block; }
  #thought-log { font-family:"Menlo","Consolas",monospace; font-size:10px; line-height:1.35; }
  .thought { margin-bottom:4px; padding:3px 5px; background:rgba(255,255,255,.03); border-left:2px solid #4a6fa5; border-radius:2px; animation:slideIn .3s; }
  .thought.decision { border-left-color:#ffd369; }
  .thought.event { border-left-color:#ff6b6b; background:rgba(255,107,107,.08); }
  .thought.love { border-left-color:#ff69b4; background:rgba(255,105,180,.08); }
  .thought.social { border-left-color:#fbbf24; background:rgba(251,191,36,.06); }
  .thought.mutter { border-left-color:#c084fc; background:rgba(192,132,252,.06); }
  .thought.crush { border-left-color:#f472b6; background:rgba(244,114,182,.08); }
  .thought .time { color:#888; font-size:8px; }
  .thought .tag { display:inline-block; padding:0 3px; background:#2a2a4a; border-radius:3px; font-size:8px; margin-right:2px; color:#aaa; }
  .thought .quote { margin-top:2px; padding:2px 4px; background:rgba(255,211,105,.1); border-radius:3px; color:#ffd369; font-style:italic; font-size:10px; }
  @keyframes slideIn { from{opacity:0;transform:translateX(10px)} to{opacity:1;transform:translateX(0)} }
  /* 事件記錄 */
  .pending-card {
    background:rgba(255,211,105,.08);
    border:1px solid #ffd369;
    border-radius:6px;
    padding:8px;
    margin-bottom:6px;
  }
  .pending-card .title { color:#ffd369; font-weight:700; font-size:11px; margin-bottom:4px; }
  .pending-card .desc { font-size:10px; color:#ccc; margin-bottom:6px; line-height:1.4; }
  .pending-card .choices { display:flex; flex-direction:column; gap:4px; }
  .pending-choice-btn {
    background:#2a2a4a; border:1px solid #4a4a6a;
    color:#eee; padding:6px 8px; border-radius:4px;
    cursor:pointer; font-size:10px; text-align:left;
    transition:all .2s;
  }
  .pending-choice-btn:hover { background:#3a3a5a; border-color:#ffd369; }
  .event-log-item {
    background:rgba(255,255,255,.03);
    border-left:2px solid #4a6fa5;
    border-radius:3px;
    margin-bottom:4px;
    padding:4px 6px;
    cursor:pointer;
    transition:all .2s;
  }
  .event-log-item:hover { background:rgba(255,255,255,.06); }
  .event-log-item.expanded { border-left-color:#ffd369; background:rgba(255,211,105,.05); }
  .event-log-item .header { display:flex; align-items:center; gap:4px; font-size:10px; }
  .event-log-item .header .icon { font-size:12px; }
  .event-log-item .header .title { flex:1; font-weight:600; color:#eee; }
  .event-log-item .header .date { font-size:8px; color:#888; }
  .event-log-item .header .impact { font-size:8px; }
  .event-log-item .impact.positive { color:#10b981; }
  .event-log-item .impact.negative { color:#ff6b6b; }
  /* ✅ 修復：詳情區域正確顯示多行文本 */
  .event-log-item .detail {
    display:none;
    margin-top:6px;
    font-size:10px;
    color:#ccc;
    padding:8px;
    background:rgba(0,0,0,.3);
    border-radius:4px;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .event-log-item.expanded .detail { display:block; }
  .event-log-item.type-love { border-left-color:#ff69b4; }
  .event-log-item.type-social { border-left-color:#fbbf24; }
  .event-log-item.type-career { border-left-color:#3b82f6; }
  .event-log-item.type-life { border-left-color:#10b981; }
  .event-log-item.type-low { border-left-color:#8b5cf6; }
  .event-log-item.type-report { border-left-color:#ffd369; }
  .event-log-empty { text-align:center; color:#666; font-size:10px; padding:20px 0; }
  .event-filter { display:flex; gap:3px; margin-bottom:4px; flex-wrap:wrap; }
  .filter-btn {
    padding:2px 6px; border-radius:3px; font-size:9px;
    background:rgba(255,255,255,.04); border:1px solid #3a3a5e;
    color:#aaa; cursor:pointer;
  }
  .filter-btn.active { background:rgba(255,211,105,.1); border-color:#ffd369; color:#ffd369; }
  #bottom { grid-area:bottom; display:flex; gap:4px; align-items:center; font-size:10px; }
  .stat-box { flex:1; background:rgba(255,255,255,.04); padding:3px 5px; border-radius:5px; border:1px solid #3a3a5e; min-width:0; }
  .stat-box .label { font-size:8px; color:#888; text-transform:uppercase; }
  .stat-box .value { font-size:11px; color:#ffd369; font-weight:700; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stat-box .sub { font-size:9px; color:#aaa; }
  .life-meter { height:3px; background:#2a2a4a; border-radius:2px; overflow:hidden; margin-top:2px; }
  .life-meter .fill { height:100%; border-radius:2px; transition:width .5s; }
  #toast {
    position:fixed; top:50px; left:50%; transform:translateX(-50%);
    background:rgba(16,185,129,.9); color:#fff;
    padding:8px 16px; border-radius:6px;
    font-size:11px; z-index:200;
    opacity:0; transition:opacity .3s;
    pointer-events:none;
  }
  #toast.show { opacity:1; }
  #toast.error { background:rgba(255,107,107,.9); }
  ::-webkit-scrollbar { width:3px; }
  ::-webkit-scrollbar-thumb { background:#4a4a6a; border-radius:2px; }
  @media (orientation:portrait) and (max-width:900px) {
    #rotate-hint { display:flex!important; position:fixed; inset:0; background:#1a1a2e; z-index:1000; align-items:center; justify-content:center; flex-direction:column; color:#ffd369; }
    #rotate-hint .icon { font-size:50px; margin-bottom:15px; animation:rotate 2s infinite; }
    @keyframes rotate { 50%{transform:rotate(90deg)} }
  }
  #rotate-hint { display:none; }
</style>
</head>
<body>
<div id="rotate-hint"><div class="icon">📱</div><div>請將手機橫向</div></div>
<div id="toast"></div>

<div id="app">
  <div id="top" class="panel">
    <div class="left">
      <span class="title">🌊 少年人生</span>
      <span id="date-display">2026/10/07</span>
      <span id="time-display" style="color:#ffd369">08:00</span>
      <span id="stage-tag" style="color:#c084fc">🎓 大學期</span>
    </div>
    <div class="right">
      <button class="btn" data-speed="0">⏸</button>
      <button class="btn active" data-speed="1">▶</button>
      <button class="btn" data-speed="3">▶▶</button>
      <button class="btn" data-speed="10">▶▶▶</button>
      <span style="color:#555">|</span>
      <button class="btn save" id="save-btn">💾</button>
      <button class="btn load" id="load-btn">📂</button>
      <span id="save-status"></span>
    </div>
  </div>

  <div id="left" class="panel">
    <div class="section-title">👤 人物</div>
    <div id="char-list"></div>
    <div class="section-title">🎭 人格</div>
    <div id="personality-display"></div>
    <div class="section-title">💕 感情</div>
    <div id="love-display" style="font-size:9px;padding:2px;"></div>
    <div class="section-title">👥 社交</div>
    <div id="social-display" style="font-size:9px;padding:2px;"></div>
  </div>

  <!-- ✅ 修復：簡化的中間區域 -->
  <div id="center">
    <div id="scene-bg"></div>
    <div id="scene-icon">🛏</div>
    <div id="scene-name">睡房</div>
    <div id="scene-mood">😐 平靜</div>
    <div class="char-sprite" id="main-sprite">
      <div class="action"></div>
      <div class="head"></div>
      <div class="body" style="background:#4a6fa5"></div>
    </div>
  </div>

  <div id="right" class="panel">
    <div class="tab-bar">
      <div class="tab-btn active" data-tab="thoughts">💭 思考流</div>
      <div class="tab-btn" data-tab="events">📜 事件記錄</div>
    </div>
    <div id="tab-thoughts" class="tab-content active">
      <div id="thought-log"></div>
    </div>
    <div id="tab-events" class="tab-content">
      <div class="event-filter" id="event-filter"></div>
      <div id="pending-area"></div>
      <div id="event-log"></div>
    </div>
  </div>

  <div id="bottom" class="panel">
    <div class="stat-box"><div class="label">當前行動</div><div class="value" id="today-action">—</div></div>
    <div class="stat-box"><div class="label">年齡</div><div class="value" id="age-display">20 歲</div><div class="sub" id="life-days">第 0 日</div></div>
    <div class="stat-box"><div class="label">人生曲線</div><div class="life-meter"><div class="fill" id="life-curve" style="width:50%;background:#ffd369"></div></div><div class="sub" id="life-trend">平穩</div></div>
    <div class="stat-box"><div class="label">💰 財務</div><div class="value" id="money">$15,000</div></div>
    <div class="stat-box"><div class="label">👥 朋友</div><div class="value" id="social-count">2</div></div>
    <div class="stat-box"><div class="label">📜 事件</div><div class="value" id="event-count">0</div></div>
  </div>
</div>

<script>
'use strict';

// ============================================================
// 《少年人生》修復版
// 修復：半年報告文字 + 中間縮小 + 存檔系統
// ============================================================

function $(id){ return document.getElementById(id); }
function safeSetText(id,t){ const e=$(id); if(e) e.textContent=t; }
function safeSetHTML(id,h){ const e=$(id); if(e) e.innerHTML=h; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function formatMoney(n){ return '$' + Math.round(n).toLocaleString(); }

const SAVE_KEY = 'lifeGame_fix_v1';

const Game = {
  day: 0, hour: 7, minute: 0,
  speed: 1, paused: false,
  selectedCharId: 'protagonist',
  characters: {},
  tickCount: 0,
  lifeCurve: [],
  lastReportDay: -1,
  crushActive: false,
  crushMet: false,
  eventLog: [],
  pendingEvents: [],
  currentTab: 'thoughts',
  eventFilter: 'all',
};

// ============================================================
// 🎭 敘事生成引擎（修復變量定義）
// ============================================================
const NarrativeEngine = {
  finance(c){
    const m = c.money;
    const name = c.name;
    if(m > 500000) return pick([
      `經濟上，${name}算是過得不錯。手頭有${formatMoney(m)}，不用為錢發愁。`,
      `${formatMoney(m)}的積蓄讓${name}有了底氣。雖然不是大富大貴，但至少不用看價格牌吃飯。`,
    ]);
    if(m > 100000) return pick([
      `財務狀況穩定，${name}有${formatMoney(m)}。不算富裕，但生活過得去。`,
      `${formatMoney(m)}的存款，讓${name}不至於太焦慮。但每次看到心儀的東西，還是要算一算。`,
    ]);
    if(m > 30000) return pick([
      `錢，是個要精打細算的東西。${name}剩下${formatMoney(m)}，每次消費都要想一想。`,
      `${formatMoney(m)}，不多不少。${name}學會了什麼是「性價比」。`,
    ]);
    if(m > 10000) return pick([
      `經濟壓力不小。${formatMoney(m)}的餘額，讓${name}有時連飯都要算著吃。`,
      `${formatMoney(m)}，說多不說少。但對${name}來說，每一筆支出都要三思。`,
    ]);
    return pick([
      `經濟上真的很難。${formatMoney(m)}，有時候連下一餐在哪裡都不知道。`,
      `${formatMoney(m)}。這數字讓${name}夜不能寐。但生活還要繼續。`,
    ]);
  },

  love(c){
    const name = c.name;
    const l = c.love;
    switch(l.status){
      case 'single':
        return pick([
          `感情方面，${name}還是單身。不是不想，只是緣分這種東西，急不來。`,
          `愛情對${name}來說，還是個遙遠的詞。偶爾看到情侶，心裡也會有一絲羨慕。`,
        ]);
      case 'crush':
        return pick([
          `${name}心裡住著一個人——${l.partnerName}。每次見到對方，心跳都會漏一拍。`,
          `暗戀的滋味，${name}算是體會到了。${l.partnerName}的每一個笑容，都能在心裡回放一整天。`,
        ]);
      case 'dating':
        return pick([
          `${name}和${l.partnerName}正在約會階段。那種曖昧的甜蜜，讓每天都多了點期待。`,
          `和${l.partnerName}的關係在升溫。${name}開始習慣手機裡多一個人的消息提示。`,
        ]);
      case 'in_relationship':
        return pick([
          `${name}和${l.partnerName}正式在一起了。從「我」變成「我們」，是種奇妙的感覺。`,
          `戀愛中的${name}，學會了分享和妥協。${l.partnerName}既是戀人，也是最好的朋友。`,
        ]);
      case 'heartbroken':
        return pick([
          `失戀的痛，${name}正在慢慢消化。${l.partnerName}的離開，留下了一道還沒癒合的傷口。`,
          `${name}還在療傷。有些夜晚，還是會忍不住想起${l.partnerName}。`,
        ]);
      default:
        return '';
    }
  },

  social(c){
    const name = c.name;
    const friends = c.social.friends;
    const pop = c.social.popularity;
    let text = '';

    if(friends.length >= 6){
      text += pick([
        `社交方面，${name}算是個受歡迎的人。身邊有${friends.length}個朋友，週末總有人約。`,
        `${name}的社交圈不小，${friends.length}個朋友輪流約。`,
      ]);
    } else if(friends.length >= 3){
      text += pick([
        `${name}有${friends.length}個談得來的朋友。不多，但每個都是真心的。`,
        `社交圈不大，${friends.length}個朋友，但${name}覺得夠了。質量比數量重要。`,
      ]);
    } else if(friends.length >= 1){
      text += pick([
        `${name}的朋友不多，只有${friends.length}個。但有一個懂你的人，就夠了。`,
        `社交上比較內向，${name}只有${friends.length}個朋友。`,
      ]);
    } else {
      text += pick([
        `${name}目前沒有什麼朋友。有時候一個人吃飯，會覺得有點孤獨。`,
        `社交圈幾乎為零。${name}不是不想交朋友，只是不知道從哪裡開始。`,
      ]);
    }

    if(pop > 70){
      text += `在群體中，${name}算是受歡迎的那個，說話有人聽，聚會有人約。`;
    } else if(pop < 30){
      text += `但在群體中，${name}常常是安靜的那個。不是不想說話，只是不知道怎麼開口。`;
    }
    return text;
  },

  career(c){
    const name = c.name;
    if(!c.job){
      if(c.age < 23){
        return pick([
          `學業上，${name}還是個大學生。每天的日常就是上堂、溫書、偶爾翹課去cafe。`,
          `${name}正在讀大學。未來的路還很模糊，但年輕就是資本。`,
        ]);
      }
      return pick([
        `目前${name}處於待業狀態。找工的路不好走，投出的簡歷石沉大海是常事。`,
        `沒有工作的日子，${name}有些焦慮。每天醒來，都會想：今天要做點什麼？`,
      ]);
    }
    const jobTitle = c.job.title;
    if(c.job.type === 'office'){
      return pick([
        `作為${jobTitle}，${name}的生活規律而穩定。朝九晚六，偶爾OT，週末是自己的。`,
        `${jobTitle}的工作，${name}做得中規中矩。穩定是好事，但偶爾也會想：就這樣了嗎？`,
      ]);
    }
    if(c.job.type === 'startup'){
      return pick([
        `在Startup做${jobTitle}，${name}的生活充滿變數。今天可能意氣風發，明天可能焦頭爛額。`,

// 事件記錄系統
// ============================================================
function logEvent(type, icon, title, desc, impact = 0, choices = null){
  const evt = {
    id: Date.now() + Math.random(),
    day: Game.day,
    age: Game.characters.protagonist?.age ?? 20,
    type, icon, title, desc, impact,
    choices, resolved: !choices, resolvedChoice: null,
    timestamp: Date.now(),
  };
  Game.eventLog.unshift(evt);
  if(choices) Game.pendingEvents.push(evt.id);
  renderEventLog();
  updateEventCount();
  return evt.id;
}

function resolveEvent(eventId, choiceText){
  const evt = Game.eventLog.find(e => e.id === eventId);
  if(!evt) return;
  evt.resolved = true;
  evt.resolvedChoice = choiceText;
  Game.pendingEvents = Game.pendingEvents.filter(id => id !== eventId);
  renderEventLog();
  return evt;
}

function updateEventCount(){
  safeSetText('event-count', Game.eventLog.length);
}

function renderEventLog(){
  try {
    // 過濾器
    const filterEl = $('event-filter');
    if(filterEl){
      const filters = [
        {id:'all', name:'全部'}, {id:'love', name:'💕感情'}, {id:'social', name:'👥社交'},
        {id:'career', name:'💼事業'}, {id:'life', name:'🌟人生'}, {id:'low', name:'📉低谷'},
        {id:'report', name:'📊報告'},
      ];
      filterEl.innerHTML = filters.map(f =>
        `<div class="filter-btn ${Game.eventFilter === f.id ? 'active' : ''}" data-filter="${f.id}">${f.name}</div>`
      ).join('');
      filterEl.querySelectorAll('.filter-btn').forEach(btn => {
        btn.onclick = () => {
          Game.eventFilter = btn.dataset.filter;
          renderEventLog();
        };
      });
    }

    // 待決定區域
    const pendingEl = $('pending-area');
    if(pendingEl){
      const pending = Game.eventLog.filter(e => Game.pendingEvents.includes(e.id));
      if(pending.length > 0){
        pendingEl.innerHTML = pending.map(evt => `
          <div class="pending-card">
            <div class="title">${evt.icon} ${evt.title}</div>
            <div class="desc">${evt.desc}</div>
            <div class="choices">
              ${(evt.choices || []).map(c => `
                <button class="pending-choice-btn" data-event-id="${evt.id}" data-choice="${c.text}">
                  ${c.icon} <b>${c.text}</b><br>
                  <span style="font-size:8px;color:#aaa">${c.desc}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `).join('');
        pendingEl.querySelectorAll('.pending-choice-btn').forEach(btn => {
          btn.onclick = () => handleEventChoice(parseFloat(btn.dataset.eventId), btn.dataset.choice);
        });
      } else {
        pendingEl.innerHTML = '';
      }
    }

    // 事件列表
    const logEl = $('event-log');
    if(!logEl) return;

    let events = Game.eventLog.filter(e => e.resolved);
    if(Game.eventFilter !== 'all'){
      events = events.filter(e => e.type === Game.eventFilter);
    }

    if(events.length === 0){
      logEl.innerHTML = '<div class="event-log-empty">暫無事件記錄</div>';
      return;
    }

    logEl.innerHTML = events.slice(0, 50).map(evt => {
      const impactClass = evt.impact > 0 ? 'positive' : evt.impact < 0 ? 'negative' : '';
      const impactText = evt.impact > 0 ? `+${evt.impact}` : evt.impact < 0 ? `${evt.impact}` : '';
      const dateStr = `第${evt.day}日 · ${evt.age}歲`;
      return `
        <div class="event-log-item type-${evt.type}" data-event-id="${evt.id}">
          <div class="header">
            <span class="icon">${evt.icon}</span>
            <span class="title">${evt.title}</span>
            ${evt.resolvedChoice ? `<span style="font-size:8px;color:#aaa">→ ${evt.resolvedChoice}</span>` : ''}
            <span class="impact ${impactClass}">${impactText}</span>
            <span class="date">${dateStr}</span>
          </div>
          <div class="detail">${evt.desc}</div>
        </div>
      `;
    }).join('');

    // ✅ 修復：直接綁定點擊事件
    logEl.querySelectorAll('.event-log-item').forEach(item => {
      item.onclick = () => {
        item.classList.toggle('expanded');
      };
    });
  } catch(e){ console.error('renderEventLog error:', e); }
}

function handleEventChoice(eventId, choiceText){
  const evt = Game.eventLog.find(e => e.id === eventId);
  if(!evt) return;
  const p = Game.characters.protagonist;
  const choice = (evt.choices || []).find(c => c.text === choiceText);
  if(choice && choice.action) choice.action(p);
  resolveEvent(evt.id, choiceText);
  showToast(`✓ 已選擇：${choiceText}`);
  addThought('protagonist', '✅', `決定：${evt.title} → ${choiceText}`, true);
}

function saveGame(){
  try {
    // 準備存檔數據（排除不可序列化的屬性）
    const charactersData = {};
    for(const [id, c] of Object.entries(Game.characters)){
      charactersData[id] = {
        id: c.id, name: c.name, avatar: c.avatar, color: c.color,
        age: c.age, startAge: c.startAge, gender: c.gender,
        isProtagonist: c.isProtagonist,
        personality: c.personality,
        needs: { ...c.needs },
        mood: { ...c.mood },
        money: c.money, job: c.job, home: c.home,
        love: { ...c.love },
        social: { friends: [...c.social.friends], popularity: c.social.popularity },
        health: { ...c.health },
        currentLocation: c.currentLocation,
        actionTimer: 0,
        lifeEvents: c.lifeEvents || [],
        recentActions: c.recentActions || [],
        isCrush: c.isCrush,
        affectionToMe: c.affectionToMe,
      };
    }

    const saveData = {
      version: 1,
      savedAt: new Date().toISOString(),
      game: {
        day: Game.day, hour: Game.hour, minute: Game.minute, speed: Game.speed,
        lifeCurve: [...Game.lifeCurve],
        lastReportDay: Game.lastReportDay,
        crushActive: Game.crushActive, crushMet: Game.crushMet,
        eventFilter: Game.eventFilter,
      },
      characters: charactersData,
      eventLog: Game.eventLog,
      pendingEvents: Game.pendingEvents,
    };

    // 序列化
    const json = JSON.stringify(saveData);

    // 測試存儲
    localStorage.setItem(SAVE_KEY, json);

    // 驗證
    const test = localStorage.getItem(SAVE_KEY);
    if(!test) throw new Error('存檔驗證失敗');

    // 解析測試
    JSON.parse(test);

    updateSaveStatus();
    showToast('💾 已儲存');
    console.log('Save successful:', json.length, 'bytes');
    return true;
  } catch(e){
    console.error('Save error:', e);
    showToast('❌ 儲存失敗: ' + e.message, true);
    return false;
  }
}

function loadGame(){
  try {
    const data = localStorage.getItem(SAVE_KEY);
    if(!data){
      showToast('沒有找到存檔', true);
      return false;
    }

    const save = JSON.parse(data);

    // 恢復 Game 狀態
    Game.day = save.game.day || 0;
    Game.hour = save.game.hour || 7;
    Game.minute = save.game.minute || 0;
    Game.speed = save.game.speed || 1;
    Game.lifeCurve = save.game.lifeCurve || [];
    Game.lastReportDay = save.game.lastReportDay ?? -1;
    Game.crushActive = save.game.crushActive || false;
    Game.crushMet = save.game.crushMet || false;
    Game.eventFilter = save.game.eventFilter || 'all';

    // 恢復角色
    Game.characters = {};
    for(const [id, c] of Object.entries(save.characters)){
      Game.characters[id] = {
        ...c,
        currentAction: null,
        spriteEl: null,
        actionTimer: 0,
      };
    }

    // 恢復事件
    Game.eventLog = save.eventLog || [];
    Game.pendingEvents = save.pendingEvents || [];

    // 找到暗戀對象
    crushCharacter = Object.values(Game.characters).find(c => c.isCrush) || null;

    // 更新速度按鈕
    document.querySelectorAll('.btn[data-speed]').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.speed) === Game.speed);
    });

    // 重新渲染
    renderAll();
    updateSaveStatus();
    showToast('📂 已載入存檔');
    console.log('Load successful');
    return true;
  } catch(e){
    console.error('Load error:', e);
    showToast('❌ 載入失敗: ' + e.message, true);
    return false;
  }
}

function updateSaveStatus(){
  const el = $('save-status');
  if(!el) return;
  try {
    const data = localStorage.getItem(SAVE_KEY);
    if(data){
      const save = JSON.parse(data);
      const time = new Date(save.savedAt);
      el.textContent = `已存 ${time.getHours()}:${String(time.getMinutes()).padStart(2,'0')}`;
    } else {
      el.textContent = '未存檔';
    }
  } catch(e){
    el.textContent = '存檔損壞';
  }
}

$('save-btn').onclick = () => saveGame();
$('load-btn').onclick = () => {
  if(confirm('確定要載入存檔？當前進度會丟失。')){

  }
};

function crushAI(crush, deltaHours){
  try {
    if(!crush || !Game.crushActive) return;
    const h = Game.hour;
    let targetLoc = crush.currentLocation;
    if(h >= 8 && h < 12) targetLoc = 'university';
    else if(h >= 12 && h < 14) targetLoc = 'canteen';
    else if(h >= 14 && h < 17) targetLoc = 'library';
    else if(h >= 17 && h < 19) targetLoc = 'cafe';
    else if(h >= 19 && h < 22) targetLoc = 'park';
    else targetLoc = 'home_bedroom';
    if(targetLoc !== crush.currentLocation) crush.currentLocation = targetLoc;
    if(Game.tickCount % 50 === 0){
      const p = Game.characters.protagonist;
      if(p.currentLocation === crush.currentLocation){
        crush.affectionToMe = Math.min(100, crush.affectionToMe + 2);
        if(Math.random() < 0.3){
          const dialogues = [
            `${crushCharacter.name} 望咗你一眼，微笑`,
            `${crushCharacter.name} 同朋友傾偈，笑得好開心`,
          ];
          addThought('protagonist','💭', pick(dialogues), false, 'crush');
        }
      } else {
        crush.affectionToMe = Math.max(0, crush.affectionToMe - 0.5);
      }
    }
  } catch(e){ console.error(e); }
}

// AI 思考
// ============================================================
function aiThink(c){
  try {
    const candidates = [];
    for(const [key, act] of Object.entries(ACTIONS)){
      if(!act.condition(c)) continue;
      let score = 50;
      for(const [nk, nv] of Object.entries(act.effects)){
        if(nv > 0 && c.needs[nk] < 50) score += (50 - c.needs[nk]) * 0.8;
        if(nv < 0 && c.needs[nk] < 30) score -= 40;
      }
      const h = Game.hour;
      if(key.includes('breakfast') && h >= 7 && h < 9.5) score += 25;
      if(key.includes('lunch') && h >= 12 && h < 14) score += 25;
      if(key === 'eat_meal' && h >= 18 && h < 21) score += 20;
      if(key === 'sleep' && h >= 22) score += 30;
      if(act.socialGain && c.social.friends.length > 0) score += act.socialGain * 2;
      if(act.loveGain && c.love.status !== 'single') score += act.loveGain * 2;
      if(act.cost && c.money < act.cost * 2) score -= 30;
      score += (Math.random() - 0.5) * 10;
      candidates.push({key, act, score});
    }
    if(candidates.length === 0){
      c.currentAction = ACTIONS.idle; c.actionTimer = 0.3; return;
    }
    candidates.sort((a,b) => b.score - a.score);
    const chosen = candidates[0];
    if(chosen.act.location && chosen.act.location !== c.currentLocation){
      if(c.id === Game.selectedCharId || c.isProtagonist){
        addThought(c.id, '🚶', `由 ${LOCATIONS[c.currentLocation]?.name} 去 ${LOCATIONS[chosen.act.location]?.name}`, false);
      }
      c.currentLocation = chosen.act.location;
    }
    if(c.id === Game.selectedCharId || c.isProtagonist){
      addThought(c.id, '決定', `${chosen.act.icon} ${chosen.act.name} (${Math.round(chosen.score)})`, true);
      if(chosen.act.mutter && Math.random() < 0.4){
        addMutter(c.id, chosen.act.mutter);
      }
    }
    c.currentAction = chosen.act;
    c.actionTimer = chosen.act.duration;
    if(!c.recentActions) c.recentActions = [];
    c.recentActions.push(chosen.key);
    if(c.recentActions.length > 5) c.recentActions.shift();
    if(chosen.act.socialGain && Math.random() < 0.3){
      c.social.popularity = Math.min(100, c.social.popularity + chosen.act.socialGain);
      if(c.social.friends.length < 10 && Math.random() < 0.2){
        const names = ['阿俊','阿Fin','阿傑','阿Kelvin'];
        const newName = pick(names);
        if(!c.social.friends.includes(newName)){
          c.social.friends.push(newName);
          if(c.id === Game.selectedCharId || c.isProtagonist){
            addThought(c.id, '👥', `認識咗新朋友 ${newName}！`, false, 'social');
            logEvent('social', '👥', `認識新朋友 ${newName}`, `在社交場合認識了新朋友 ${newName}`, 5);
          }
        }
      }
    }
    if(chosen.act.loveGain){
      if(c.love.status === 'crush' && crushCharacter){
        c.love.affection = Math.min(100, c.love.affection + chosen.act.loveGain);
        if(c.love.affection > 70){
          c.love.status = 'dating'; c.mood.happy += 25;
          addThought(c.id, '💕', `同 ${c.love.partnerName} 正式約會！`, false, 'love');
          logEvent('love', '💕', `同 ${c.love.partnerName} 開始約會`, `感情升溫，正式開始約會`, 15);
        }
      } else if(c.love.status === 'dating'){
        c.love.affection = Math.min(100, c.love.affection + chosen.act.loveGain);
        if(c.love.affection > 80){
          c.love.status = 'in_relationship'; c.love.daysTogether = 1; c.mood.happy += 20;
          addThought(c.id, '❤️', `同 ${c.love.partnerName} 正式一起！`, false, 'love');
          logEvent('love', '❤️', `同 ${c.love.partnerName} 正式一起`, `感情穩定，正式成為情侶`, 20);
        }
      }
    }
  } catch(e){ console.error(e); c.currentAction = ACTIONS.idle; c.actionTimer = 0.3; }
}

function executeAction(c, deltaHours){
  try {
    const act = c.currentAction;
    if(!act) return;
    const ratio = deltaHours / Math.max(act.duration, 0.1);
    for(const [k, v] of Object.entries(act.effects)){
      if(c.needs[k] !== undefined) c.needs[k] = Math.max(0, Math.min(100, c.needs[k] + v * ratio));
    }
    if(act.cost) c.money -= act.cost * ratio;
    if(act.income) c.money += act.income * ratio;
    c.actionTimer -= deltaHours;
    if(c.actionTimer <= 0){
      if(c.id === Game.selectedCharId || c.isProtagonist){
        safeSetText('today-action', act.icon + ' ' + act.name);
      }
      c.currentAction = null;
    }
  } catch(e){ console.error(e); c.currentAction = null; }
}

// ============================================================
// 主 tick
// ============================================================
function tick(){
  try {
    if(Game.paused || Game.speed === 0) return;
    const baseDelta = 0.15 * Game.speed;
    Game.hour += baseDelta;
    Game.minute = Math.floor((Game.hour % 1) * 60);

    if(Game.hour >= 24){
      Game.hour -= 24;
      Game.day++;
      Object.values(Game.characters).forEach(c => {
        c.age = c.startAge + Math.floor(Game.day / 365);
        if(c.love.status === 'in_relationship'){
          c.love.daysTogether++;
          c.love.affection = Math.max(0, c.love.affection - 0.3);
        }
      });
      dailySettlement();
      if(Game.day % 7 === 0) saveGame();
    }

    Object.values(Game.characters).forEach(c => {
      try {
        if(c.currentAction) executeAction(c, baseDelta);
        else aiThink(c);
        NEEDS_DEF.forEach(n => {
          c.needs[n.key] = Math.max(0, c.needs[n.key] - n.decay * baseDelta / 24);
        });
        const avgNeed = Object.values(c.needs).reduce((a,b)=>a+b,0) / Object.keys(c.needs).length;
        c.mood.happy += (avgNeed - 50) * 0.02 * baseDelta;
        c.mood.happy = Math.max(-100, Math.min(100, c.mood.happy));
      } catch(e){ console.error(e); }
    });

    activateCrushSystem();
    if(crushCharacter) crushAI(crushCharacter, baseDelta);

    const p = Game.characters.protagonist;
    checkMajorLifeEvents(p);
    generateHalfYearReport(p);

    Game.tickCount++;
    if(Game.tickCount % 2 === 0) renderAll();
  } catch(e){ console.error('TICK ERROR:', e); }
}

function dailySettlement(){
  try {
    Object.values(Game.characters).forEach(c => {
      c.money -= 100;
      if(c.job && Game.day % 30 === 0) c.money += c.job.salary;
      if(c.health.disease){
        c.health.physical = Math.max(0, c.health.physical - 1);
        if(Math.random() < 0.2) c.health.disease = null;
      }
      if(c.personality.bad.includes('overspender') && Math.random() < 0.1) c.money -= 200;
    });
    if(Game.characters.protagonist.age >= 40){
      Game.paused = true;
      const p = Game.characters.protagonist;
      logEvent('life', '🎬', '40 歲人生總結',
        NarrativeEngine.generateHalfYearReport(p, 'final'), 0);
      showToast('🎬 40 歲，人生告一段落');
    }
  } catch(e){ console.error(e); }
}

function renderStatus(){
  try {
    const p = Game.characters.protagonist;
    safeSetText('money', formatMoney(p.money));
    safeSetText('age-display', `${p.age} 歲`);
    safeSetText('life-days', `第 ${Game.day} 日`);
    safeSetText('social-count', p.social.friends.length);
    const curveEl = $('life-curve');
    const trendEl = $('life-trend');
    if(curveEl && trendEl){
      const recent = Game.lifeCurve.slice(-10);
      const avg = recent.length > 0 ? recent.reduce((a,b)=>a+b,0) / recent.length : 0;
      const pct = Math.max(0, Math.min(100, 50 + avg));
      curveEl.style.width = pct + '%';
      curveEl.style.background = avg > 5 ? '#10b981' : avg < -5 ? '#ff6b6b' : '#ffd369';
      trendEl.textContent = avg > 5 ? '📈 上升' : avg < -5 ? '📉 下降' : '→ 平穩';
    }
    const stageEl = $('stage-tag');
    if(stageEl){
      if(p.age < 23) stageEl.textContent = '🎓 大學期';
      else if(p.age < 26) stageEl.textContent = '🌿 初入社會';
      else if(p.age < 30) stageEl.textContent = '🌳 事業建立';
      else if(p.age < 35) stageEl.textContent = '🏠 成家立業';
      else stageEl.textContent = '🌲 成熟期';
    }
  } catch(e){ console.error(e); }
}

function renderDateTime(){
  try {
    const year = 2026 + Math.floor(Game.day / 365);
    const dayOfYear = Game.day % 365;
    const month = Math.floor(dayOfYear / 30) + 1;
    const day = (dayOfYear % 30) + 1;
    safeSetText('date-display', `${year}/${String(month).padStart(2,'0')}/${String(day).padStart(2,'0')}`);
    safeSetText('time-display', `${String(Game.hour).padStart(2,'0')}:${String(Game.minute).padStart(2,'0')}`);
  } catch(e){ console.error(e); }
}

// ============================================================
// 初始化
// ============================================================
function init(){
  try {
    document.querySelectorAll('.btn[data-speed]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.btn[data-speed]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        Game.speed = parseInt(btn.dataset.speed);
        Game.paused = Game.speed === 0;
      };
    });

    const hasSave = localStorage.getItem(SAVE_KEY);
    updateSaveStatus();
    if(hasSave) showToast('發現存檔，可點擊 📂 載入');

    renderAll();
    setInterval(tick, 100);

    const c = Game.characters.protagonist;
    addThought('protagonist', '🌟', `${c.name}，${c.age} 歲，人生開始`, true);
    const goodNames = c.personality.good.map(id => GOOD_TRAITS.find(g=>g.id===id)?.name).filter(Boolean).join('、');
    const badNames = c.personality.bad.map(id => BAD_TRAITS.find(b=>b.id===id)?.name).filter(Boolean).join('、');
    addThought('protagonist', '🎭', `優點：${goodNames} · 缺點：${badNames}`, false);
    addMutter('protagonist', '20歲，大學生活開始！');

    logEvent('life', '🌟', '人生開始', `${c.name}，${c.age} 歲，開始新的人生旅程。`, 0);

    console.log('Game initialized successfully');
  } catch(e){
    console.error('Init error:', e);
    alert('初始化錯誤：' + e.message);
  }
}

init();
</script>
