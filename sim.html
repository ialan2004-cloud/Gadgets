<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人生屋企 · 活躍 AI 版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: #0f0f1e; color: #eee; user-select: none;
  }
  #app {
    width: 100vw; height: 100vh;
    display: grid;
    grid-template-rows: 38px 1fr 78px;
    grid-template-columns: 210px 1fr 320px;
    grid-template-areas: "top top top" "left center right" "bottom bottom bottom";
    gap: 4px; padding: 4px;
  }
  .panel {
    background: rgba(20, 20, 40, 0.88);
    border: 1px solid #3a3a5e;
    border-radius: 6px;
    padding: 6px;
    overflow: hidden;
    backdrop-filter: blur(6px);
  }
  #top {
    grid-area: top;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; font-size: 12px;
  }
  #top .left, #top .right { display: flex; gap: 8px; align-items: center; }
  #top .title { font-weight: 700; color: #ffd369; letter-spacing: 1px; font-size: 13px; }
  .speed-btn, .mode-btn {
    background: #2a2a4a; border: 1px solid #4a4a6a; color: #eee;
    padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;
  }
  .speed-btn.active, .mode-btn.active { background: #ffd369; color: #1a1a2e; font-weight: 700; }
  #left { grid-area: left; font-size: 11px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .char-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid #3a3a5e;
    border-radius: 6px;
    padding: 6px;
    cursor: pointer;
  }
  .char-card.selected { border-color: #ffd369; background: rgba(255,211,105,0.08); }
  .char-card .header { display: flex; align-items: center; gap: 6px; }
  .char-card .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .char-card .info { flex: 1; min-width: 0; }
  .char-card .name { font-weight: 700; font-size: 11px; color: #ffd369; }
  .char-card .sub { font-size: 9px; color: #aaa; }
  .char-card .state-line { font-size: 9px; color: #c084fc; margin-top: 2px; font-style: italic; }
  .section-title {
    font-size: 9px; color: #888; text-transform: uppercase;
    letter-spacing: 1px; margin: 4px 0 2px;
    border-bottom: 1px solid #3a3a5e; padding-bottom: 2px;
  }
  #center {
    grid-area: center;
    position: relative;
    background: linear-gradient(to bottom, #87ceeb 0%, #87ceeb 55%, #8b7355 55%, #6b5345 100%);
    overflow: hidden;
  }
  #sky { position: absolute; top: 0; left: 0; right: 0; height: 55%; transition: background 3s; }
  #sun {
    position: absolute; width: 24px; height: 24px; border-radius: 50%;
    background: radial-gradient(circle, #fff6a0, #ffd369);
    box-shadow: 0 0 15px #ffd369; transition: all 3s;
  }
  #house {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 92%; height: 75%;
  }
  #roof {
    position: absolute; top: 0; left: 0; right: 0; height: 18%;
    background: linear-gradient(to bottom, #8b4513, #654321);
    clip-path: polygon(0 100%, 50% 0, 100% 100%);
  }
  #rooms {
    position: absolute; top: 16%; left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: 1fr 1fr 1.5fr 1.2fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px; background: #3a2a1a; padding: 2px;
  }
  .room {
    position: relative;
    background: linear-gradient(to bottom, #f5e6c8, #e8d4a8);
    border: 1px solid #8b7355; overflow: hidden;
  }
  .room-label {
    position: absolute; top: 2px; left: 4px;
    font-size: 9px; color: #654321; font-weight: 700; z-index: 2;
  }
  .char-sprite {
    position: absolute; width: 22px; height: 32px;
    transition: left 1.2s ease-in-out, bottom 1.2s ease-in-out;
    z-index: 10; pointer-events: none;
  }
  .char-sprite .body {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 16px; height: 20px; border-radius: 4px 4px 2px 2px;
  }
  .char-sprite .head {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 12px; background: #f5d4a8; border-radius: 50%;
  }
  .char-sprite .action {
    position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
    font-size: 13px; animation: float 1.5s ease-in-out infinite;
    white-space: nowrap;
  }
  .char-sprite .name-tag {
    position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    font-size: 8px; color: #fff;
    background: rgba(0,0,0,0.6); padding: 1px 4px; border-radius: 3px;
    white-space: nowrap;
  }
  @keyframes float {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -3px); }
  }
  #right {
    grid-area: right; font-size: 11px;
    display: flex; flex-direction: column;
  }
  #right h3 {
    font-size: 11px; color: #ffd369; margin-bottom: 4px;
    border-bottom: 1px solid #3a3a5e; padding-bottom: 3px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #thought-log {
    flex: 1; overflow-y: auto;
    font-family: "Menlo", "Consolas", monospace;
    font-size: 10px; line-height: 1.4;
  }
  .thought {
    margin-bottom: 5px; padding: 4px 6px;
    background: rgba(255, 255, 255, 0.03);
    border-left: 2px solid #4a6fa5;
    border-radius: 2px;
    animation: slideIn 0.3s ease-out;
  }
  .thought.decision { border-left-color: #ffd369; }
  .thought.event { border-left-color: #ff6b6b; background: rgba(255, 107, 107, 0.08); }
  .thought.love { border-left-color: #ff69b4; background: rgba(255, 105, 180, 0.08); }
  .thought.council { border-left-color: #c084fc; background: rgba(192, 132, 252, 0.08); }
  .thought.mutter { border-left-color: #60a5fa; background: rgba(96, 165, 250, 0.06); font-style: italic; }
  .thought .time { color: #888; font-size: 8px; }
  .thought .tag {
    display: inline-block; padding: 0 3px;
    background: #2a2a4a; border-radius: 3px;
    font-size: 8px; margin-right: 2px; color: #aaa;
  }
  .thought .quote {
    margin-top: 3px; padding: 3px 5px;
    background: rgba(255, 211, 105, 0.1);
    border-radius: 3px; color: #ffd369;
    font-style: italic; font-size: 10px;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  #bottom {
    grid-area: bottom;
    display: flex; gap: 5px; align-items: center;
    font-size: 10px;
  }
  .stat-box {
    flex: 1;
    background: rgba(255, 255, 255, 0.04);
    padding: 4px 6px; border-radius: 5px;
    border: 1px solid #3a3a5e;
    min-width: 0;
  }
  .stat-box .label { font-size: 8px; color: #888; text-transform: uppercase; }
  .stat-box .value { font-size: 12px; color: #ffd369; font-weight: 700; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-box .sub { font-size: 9px; color: #aaa; }
  #event-modal {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(6px);
  }
  #event-modal.show { display: flex; }
  .event-card {
    background: linear-gradient(135deg, #2a2a4a, #1a1a2e);
    border: 2px solid #ffd369;
    border-radius: 12px;
    padding: 16px;
    width: 94%; max-width: 600px;
    max-height: 88vh; overflow-y: auto;
    box-shadow: 0 10px 40px rgba(255, 211, 105, 0.3);
  }
  .event-card h2 { color: #ffd369; font-size: 15px; margin-bottom: 6px; }
  .event-card .context {
    font-size: 11px; color: #ccc; margin-bottom: 8px;
    padding: 6px; background: rgba(0, 0, 0, 0.3); border-radius: 5px;
  }
  .event-card .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .choice-btn {
    background: #2a2a4a; border: 1px solid #4a4a6a;
    color: #eee; padding: 8px; border-radius: 5px;
    cursor: pointer; font-size: 11px; text-align: left;
  }
  .choice-btn:hover { background: #3a3a5a; border-color: #ffd369; }
  .choice-btn .icon { font-size: 15px; display: block; margin-bottom: 3px; }
  .choice-btn .desc { font-size: 9px; color: #aaa; margin-top: 2px; }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: #4a4a6a; border-radius: 2px; }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate-hint {
      display: flex !important;
      position: fixed; inset: 0;
      background: #1a1a2e; z-index: 1000;
      align-items: center; justify-content: center;
      flex-direction: column; color: #ffd369;
    }
    #rotate-hint .icon { font-size: 50px; margin-bottom: 15px; animation: rotate 2s infinite; }
    @keyframes rotate { 50% { transform: rotate(90deg); } }
  }
  #rotate-hint { display: none; }
</style>
</head>
<body>
<div id="rotate-hint">
  <div class="icon">📱</div>
  <div>請將手機橫向</div>
</div>

<div id="app">
  <div id="top" class="panel">
    <div class="left">
      <span class="title">🧠 人生屋企 · 活躍 AI</span>
      <span id="date-display">2026/10/07</span>
      <span id="time-display" style="color:#ffd369">08:00</span>
    </div>
    <div class="right">
      <button class="speed-btn" data-speed="0">⏸</button>
      <button class="speed-btn active" data-speed="1">▶</button>
      <button class="speed-btn" data-speed="3">▶▶</button>
      <button class="speed-btn" data-speed="10">▶▶▶</button>
      <button class="speed-btn" data-speed="30">⏩</button>
    </div>
  </div>

  <div id="left" class="panel">
    <div class="section-title">👥 家庭成員</div>
    <div id="char-list"></div>
  </div>

  <div id="center">
    <div id="sky"></div>
    <div id="sun"></div>
    <div id="house">
      <div id="roof"></div>
      <div id="rooms">
        <div class="room" data-room="bathroom"><div class="room-label">🚿 浴室</div></div>
        <div class="room" data-room="kitchen"><div class="room-label">🍳 廚房</div></div>
        <div class="room" data-room="living"><div class="room-label">🛋 客廳</div></div>
        <div class="room" data-room="bedroom"><div class="room-label">🛏 睡房</div></div>
        <div class="room" data-room="work"><div class="room-label">💼 工作</div></div>
        <div class="room" data-room="outside"><div class="room-label">🌳 外出</div></div>
      </div>
    </div>
  </div>

  <div id="right" class="panel">
    <h3>
      <span>💭 思考流</span>
      <span id="log-char-name" style="font-size:10px;color:#aaa"></span>
    </h3>
    <div id="thought-log"></div>
  </div>

  <div id="bottom" class="panel">
    <div class="stat-box">
      <div class="label">當前行動</div>
      <div class="value" id="today-action">—</div>
    </div>
    <div class="stat-box">
      <div class="label">人生進度</div>
      <div class="value" id="life-progress">20 / 40 歲</div>
    </div>
    <div class="stat-box">
      <div class="label">💰 財務</div>
      <div class="value" id="money">$15,000</div>
    </div>
    <div class="stat-box">
      <div class="label">行動次數</div>
      <div class="value" id="action-count">0</div>
      <div class="sub">今日</div>
    </div>
    <div class="stat-box">
      <div class="label">決策</div>
      <div class="value" id="decisions-count">0</div>
    </div>
  </div>
</div>

<div id="event-modal">
  <div class="event-card">
    <h2><span id="event-icon">⚡</span> <span id="event-title">人生抉擇</span></h2>
    <div class="context" id="event-context"></div>
    <div class="choices" id="event-choices"></div>
  </div>
</div>

<script>
'use strict';

// ============================================================
// 活躍 AI 引擎 — 50+ 行動 × 自言自語 × 行動鏈 × 時間段
// ============================================================

const Game = {
  day: 0, hour: 8, minute: 0,
  speed: 1, paused: false,
  decisionsCount: 0, acceptedCount: 0,
  selectedCharId: 'protagonist',
  characters: {},
  relationships: {},
  tickCount: 0,
  actionCountToday: 0,
};

// ============================================================
// 角色工廠
// ============================================================
function createCharacter(cfg) {
  return {
    id: cfg.id,
    name: cfg.name,
    avatar: cfg.avatar,
    color: cfg.color || '#4a6fa5',
    age: cfg.age,
    gender: cfg.gender || 'M',
    isProtagonist: cfg.isProtagonist || false,
    personality: {
      openness: cfg.openness ?? 5,
      conscientiousness: cfg.conscientiousness ?? 5,
      extraversion: cfg.extraversion ?? 5,
      agreeableness: cfg.agreeableness ?? 5,
      neuroticism: cfg.neuroticism ?? 5,
    },
    needs: {
      hunger: cfg.hunger ?? 60, sleep: cfg.sleep ?? 70, hygiene: cfg.hygiene ?? 75,
      social: cfg.social ?? 40, fun: cfg.fun ?? 50, safety: cfg.safety ?? 55, love: cfg.love ?? 30,
      energy: cfg.energy ?? 80, bladder: cfg.bladder ?? 80,
    },
    mood: { happy: 0, calm: 20, confident: 10, fulfilled: 0 },
    money: cfg.money ?? 15000, debt: cfg.debt ?? 0,
    job: cfg.job || null,
    home: cfg.home ?? '劏房（租）',
    relationship: cfg.relationship ?? '單身',
    health: { physical: 90, mental: 85, disease: null },
    memories: [],
    currentAction: null,
    currentRoom: cfg.currentRoom ?? 'bedroom',
    actionTimer: 0,
    spriteEl: null,
    children: [],
    loveStage: null, loveTargetId: null,
    birthDay: cfg.birthDay ?? 0,
    // 自言自語冷卻
    mutterCooldown: 0,
    // 行動鏈
    actionChain: [],
    // 今日行動記錄
    todayActions: [],
  };
}

Game.characters.protagonist = createCharacter({
  id: 'protagonist', name: '陳志明', avatar: '👨', color: '#4a6fa5',
  age: 20, gender: 'M', isProtagonist: true,
  openness: 6, conscientiousness: 5, extraversion: 4, agreeableness: 6, neuroticism: 5,
  money: 15000,
});

// ============================================================
// 需求定義（加入能量、膀胱）
// ============================================================
const NEEDS_DEF = [
  { key: 'hunger', icon: '🍽', decay: 4.0, color: '#ff6b6b' },
  { key: 'sleep', icon: '😴', decay: 3.0, color: '#6bcf7f' },
  { key: 'hygiene', icon: '🚿', decay: 2.0, color: '#60a5fa' },
  { key: 'social', icon: '💬', decay: 2.0, color: '#fbbf24' },
  { key: 'fun', icon: '🎮', decay: 2.5, color: '#c084fc' },
  { key: 'safety', icon: '🛡', decay: 0.5, color: '#f472b6' },
  { key: 'love', icon: '💕', decay: 1.5, color: '#ff69b4' },
  { key: 'energy', icon: '⚡', decay: 2.5, color: '#fde047' },
  { key: 'bladder', icon: '🚽', decay: 3.5, color: '#a78bfa' },
];

// ============================================================
// 50+ 行動庫（按時間段分類）
// ============================================================
const ACTIONS = {
  // === 早晨 routine (6:00-9:00) ===
  wake_up: {
    name: '起身', icon: '⏰', room: 'bedroom', duration: 0.2,
    effects: { sleep: -10, energy: 5 },
    condition: (c) => c.needs.sleep > 60 && Game.hour >= 6 && Game.hour < 10,
    thought: '新嘅一日...',
    mutter: ['今日要努力！', '又係新嘅一日...', '唔想起身...']
  },
  stretch: {
    name: '伸懶腰', icon: '🙆', room: 'bedroom', duration: 0.1,
    effects: { energy: 5, fun: 2 },
    condition: (c) => Game.hour >= 6 && Game.hour < 10 && c.needs.energy < 70,
    thought: '伸個懶腰先',
    mutter: ['啊...好舒服', '身體好僵']
  },
  brush_teeth: {
    name: '刷牙', icon: '🪥', room: 'bathroom', duration: 0.15,
    effects: { hygiene: 15 },
    condition: (c) => (Game.hour >= 6 && Game.hour < 9) || (Game.hour >= 21 && Game.hour < 24),
    thought: '刷牙清新啲',
    mutter: ['左邊...右邊...上面...下面']
  },
  wash_face: {
    name: '洗面', icon: '💦', room: 'bathroom', duration: 0.1,
    effects: { hygiene: 10, energy: 5 },
    condition: (c) => Game.hour >= 6 && Game.hour < 10,
    thought: '洗個面醒下神',
    mutter: ['凍冰冰...好醒神']
  },
  eat_breakfast: {
    name: '食早餐', icon: '🥐', room: 'kitchen', duration: 0.4,
    effects: { hunger: 25, energy: 10 },
    cost: 20,
    condition: (c) => Game.hour >= 7 && Game.hour < 10 && c.needs.hunger < 60,
    thought: '食個早餐先',
    mutter: ['早餐係最重要嘅一餐', '今日食咩好呢']
  },
  make_coffee: {
    name: '沖咖啡', icon: '☕', room: 'kitchen', duration: 0.2,
    effects: { energy: 15, fun: 5 },
    cost: 15,
    condition: (c) => Game.hour >= 7 && Game.hour < 11 && c.needs.energy < 60,
    thought: '沖杯咖啡醒下神',
    mutter: ['咖啡香...好聞', '今日要靠佢撐住']
  },
  check_phone_morning: {
    name: '睇手機（朝早）', icon: '📱', room: 'bedroom', duration: 0.2,
    effects: { social: 8, fun: 5 },
    condition: (c) => Game.hour >= 6 && Game.hour < 9,
    thought: '睇下今朝早有咩新聞',
    mutter: ['又有新 message', '天氣今日幾度？']
  },

  // === 通勤 (8:00-9:30) ===
  commute_to_work: {
    name: '搭車返工', icon: '🚇', room: 'outside', duration: 0.8,
    effects: { fun: -5, energy: -5, social: 3 },
    condition: (c) => c.job && Game.hour >= 8 && Game.hour < 9.5 && c.currentRoom !== 'work',
    thought: '搭車返工',
    mutter: ['好多人...', '今日地鐵好迫', '聽下 podcast']
  },

  // === 工作時間 (9:00-18:00) ===
  work: {
    name: '返工', icon: '💼', room: 'work', duration: 2,
    effects: { fun: -8, energy: -10, social: 5 },
    income: 150,
    condition: (c) => c.job && Game.hour >= 9 && Game.hour < 18 && c.needs.energy > 20 && !c.health.disease,
    thought: '返工啦',
    mutter: ['又要開會...', '呢個 project 幾時先做完', '老細又嚟']
  },
  work_lunch: {
    name: '食午餐', icon: '🍱', room: 'outside', duration: 0.8,
    effects: { hunger: 35, energy: 8, social: 8 },
    cost: 50,
    condition: (c) => c.job && Game.hour >= 12 && Game.hour < 14 && c.needs.hunger < 50,
    thought: '食午餐',
    mutter: ['同同事去邊度食？', '今日食咩好', '好餓...']
  },
  work_break: {
    name: '小休', icon: '☕', room: 'work', duration: 0.3,
    effects: { energy: 8, fun: 5 },
    condition: (c) => c.job && Game.hour >= 10 && Game.hour < 17 && c.needs.energy < 50,
    thought: '休息下先',
    mutter: ['去茶水間沖杯嘢', '行下伸展下']
  },
  work_chat: {
    name: '同同事傾偈', icon: '🗣', room: 'work', duration: 0.3,
    effects: { social: 15, fun: 8 },
    condition: (c) => c.job && Game.hour >= 10 && Game.hour < 17 && c.needs.social < 50,
    thought: '同同事吹下水',
    mutter: ['你聽講未...', '週末有咩計劃？']
  },

  // === 黃昏 (17:30-19:30) ===
  commute_home: {
    name: '搭車返屋企', icon: '🚇', room: 'outside', duration: 0.8,
    effects: { fun: -3, energy: -5 },
    condition: (c) => c.job && Game.hour >= 17.5 && Game.hour < 19.5 && c.currentRoom === 'work',
    thought: '返屋企',
    mutter: ['終於放工', '好攰...', '今晚食咩好']
  },
  grocery_shopping: {
    name: '買餸', icon: '🛒', room: 'outside', duration: 0.8,
    effects: { fun: 5, energy: -5 },
    cost: 100,
    condition: (c) => Game.hour >= 17 && Game.hour < 20 && c.needs.hunger < 50 && c.money > 150,
    thought: '買啲嘢返屋企煮',
    mutter: ['今晚煮咩好呢', '呢個平啲...']
  },

  // === 晚上 (19:00-23:00) ===
  cook_dinner: {
    name: '煮晚餐', icon: '🍳', room: 'kitchen', duration: 0.8,
    effects: { hunger: 40, fun: 10, energy: -5 },
    condition: (c) => Game.hour >= 18 && Game.hour < 21 && c.needs.hunger < 50,
    thought: '自己煮飯',
    mutter: ['煮咩好呢...', '雪櫃得咩材料？']

// 自言自語庫（按情境分類）
// ============================================================
const MUTTER_CONTEXTS = {
  hungry: ['好餓...', '肚咕咕叫', '想食嘢', '有咩食好？'],
  tired: ['好攰...', '眼瞓...', '想瞓覺', '撐唔住'],
  bored: ['好悶...', '做咩好呢', '無聊', '想搵嘢做'],
  lonely: ['好耐冇同人傾偈', '想搵人傾下', '有啲孤單'],
  happy: ['今日幾好', '心情唔錯', '開心'],
  stressed: ['好大壓力', '點算好...', '唔知點做'],
  morning: ['新嘅一日', '早晨', '今日要努力'],
  night: ['今日好充實', '準備瞓覺', '好夜了'],
};

function getRandomMutter(c) {
  let context = 'idle';
  if (c.needs.hunger < 35) context = 'hungry';
  else if (c.needs.sleep < 35 || c.needs.energy < 35) context = 'tired';
  else if (c.needs.fun < 35) context = 'bored';
  else if (c.needs.social < 30) context = 'lonely';
  else if (c.mood.happy > 30) context = 'happy';
  else if (c.mood.happy < -20) context = 'stressed';
  else if (Game.hour < 10) context = 'morning';
  else if (Game.hour > 21) context = 'night';

  const pool = MUTTER_CONTEXTS[context] || MUTTER_CONTEXTS.idle;
  return pool[Math.floor(Math.random() * pool.length)];
}

// ============================================================
// AI 思考循環（活躍版）
// ============================================================
function aiThink(c) {
  try {
    const needs = c.needs;
    const candidates = [];

    // 評估所有行動
    for (const [key, act] of Object.entries(ACTIONS)) {
      if (!act.condition(c)) continue;
      let score = 50;

      // 需求匹配（權重更高）
      for (const [nk, nv] of Object.entries(act.effects)) {
        if (nv > 0 && needs[nk] < 50) score += (50 - needs[nk]) * 0.8;
        if (nv < 0 && needs[nk] < 30) score -= 40;
      }

      // 時間合適度
      const hour = Game.hour;
      if (key.includes('breakfast') && hour >= 7 && hour < 10) score += 20;
      if (key.includes('lunch') && hour >= 12 && hour < 14) score += 20;
      if (key.includes('dinner') && hour >= 18 && hour < 21) score += 20;
      if (key.includes('sleep') && hour >= 22) score += 15;

      // 性格影響
      if (key.includes('social') || key === 'meet_friends') score += c.personality.extraversion * 2;
      if (key === 'read_book' || key === 'study') score += c.personality.openness * 2;
      if (key === 'play_game') score += (10 - c.personality.conscientiousness);

      // 金錢限制
      if (act.cost && c.money < act.cost * 2) score -= 25;

      // 隨機擾動（保持多樣性）
      score += (Math.random() - 0.5) * 25;

      candidates.push({ key, act, score });
    }

    // 如果無行動，用 idle
    if (candidates.length === 0) {
      c.currentAction = ACTIONS.idle;
      c.actionTimer = 0.2;
      return;
    }

    // 排序選最佳
    candidates.sort((a, b) => b.score - a.score);
    const chosen = candidates[0];

    // 顯示思考（只限選中角色）
    if (c.id === Game.selectedCharId || c.isProtagonist) {
      addThought(c.id, '決定', `${chosen.act.icon} ${chosen.act.name} (分${Math.round(chosen.score)})`, true);

      // 自言自語（30% 機率）
      if (Math.random() < 0.3) {
        const mutter = chosen.act.mutter
          ? chosen.act.mutter[Math.floor(Math.random() * chosen.act.mutter.length)]
          : getRandomMutter(c);
        addMutter(c.id, mutter);
      }
    }

    c.currentAction = chosen.act;
    c.actionTimer = chosen.act.duration;

    // 記錄行動
    c.todayActions.push(chosen.key);
    Game.actionCountToday++;
  } catch (e) {
    console.error('aiThink error:', e);
    c.currentAction = ACTIONS.idle;
    c.actionTimer = 0.2;
  }
}

function addThought(charId, tag, text, isDecision = false) {
  try {
    if (charId !== Game.selectedCharId && charId !== 'protagonist') return;
    const c = Game.characters[charId];
    if (!c) return;
    const log = document.getElementById('thought-log');
    if (!log) return;
    const div = document.createElement('div');
    div.className = 'thought' + (isDecision ? ' decision' : '');
    div.innerHTML = `<div class="time">🕐 ${String(Game.hour).padStart(2,'0')}:${String(Game.minute).padStart(2,'0')}</div><span class="tag">${tag}</span> ${text}`;
    log.insertBefore(div, log.firstChild);
    while (log.children.length > 60) log.removeChild(log.lastChild);
  } catch (e) { console.error(e); }
}

function addMutter(charId, text) {
  try {
    if (charId !== Game.selectedCharId && charId !== 'protagonist') return;
    const c = Game.characters[charId];
    if (!c) return;
    const log = document.getElementById('thought-log');

function renderCharList() {

function renderSprites() {
  try {
    Object.values(Game.characters).forEach(c => {
      if (!c.spriteEl) {
        const el = document.createElement('div');
        el.className = 'char-sprite';
        el.innerHTML = `
          <div class="name-tag">${c.name}</div>
          <div class="action"></div>
          <div class="head"></div>
          <div class="body" style="background:${c.color}"></div>
        `;
        document.getElementById('center').appendChild(el);
        c.spriteEl = el;
      }
      const roomEl = document.querySelector(`[data-room="${c.currentRoom}"]`);
      if (roomEl && c.spriteEl) {
        const centerRect = document.getElementById('center').getBoundingClientRect();
        const roomRect = roomEl.getBoundingClientRect();
        const x = roomRect.left - centerRect.left + roomRect.width/2 - 11;
        const y = roomRect.top - centerRect.top + roomRect.height/2 - 16;
        c.spriteEl.style.left = x + 'px';
        c.spriteEl.style.bottom = (centerRect.height - y - 32) + 'px';
        const actionEl = c.spriteEl.querySelector('.action');
        if (actionEl) actionEl.textContent = c.currentAction ? c.currentAction.icon : '';
      }
    });
  } catch (e) { console.error(e); }
}

function renderSky() {
  try {
    const sky = document.getElementById('sky');
    const sun = document.getElementById('sun');
    if (!sky || !sun) return;
    const h = Game.hour + Game.minute / 60;
    let skyColor, sunOpacity;
    if (h < 6) { skyColor = '#0a0a2e'; sunOpacity = 0; }
    else if (h < 8) { skyColor = 'linear-gradient(to bottom, #ff9a8b, #ffc3a0)'; sunOpacity = (h-6)/2; }
    else if (h < 17) { skyColor = 'linear-gradient(to bottom, #87ceeb, #b0e0e6)'; sunOpacity = 1; }
    else if (h < 19) { skyColor = 'linear-gradient(to bottom, #ff6b6b, #ffa500)'; sunOpacity = 1-(h-17)/2; }
    else { skyColor = '#0a0a2e'; sunOpacity = 0; }
    sky.style.background = skyColor;
    const progress = (h - 6) / 12;
    sun.style.left = (10 + progress * 80) + '%';
    sun.style.top = (40 - Math.sin(progress * Math.PI) * 35) + '%';
    sun.style.opacity = sunOpacity;
  } catch (e) { console.error(e); }
}

function executeAction(c, deltaHours) {
  try {
    const act = c.currentAction;
    if (!act) return;
    const ratio = deltaHours / Math.max(act.duration, 0.1);
    for (const [k, v] of Object.entries(act.effects)) {
      if (c.needs[k] !== undefined) c.needs[k] = Math.max(0, Math.min(100, c.needs[k] + v * ratio));
    }
    if (act.cost) c.money -= act.cost * ratio;
    if (act.income) c.money += act.income * ratio;
    if (act.healthBonus) {
      for (const [k, v] of Object.entries(act.healthBonus)) c.health[k] = Math.min(100, c.health[k] + v * ratio);
    }
    c.actionTimer -= deltaHours;
    if (c.actionTimer <= 0) {
      if (c.id === Game.selectedCharId || c.isProtagonist) {
        const el = document.getElementById('today-action');
        if (el) el.textContent = act.icon + ' ' + act.name;
      }
      c.currentAction = null;
    }
  } catch (e) {
    console.error(e);
    c.currentAction = null;
  }
}

// ============================================================
// 主 tick
// ============================================================
function tick() {
  try {
    if (Game.paused || Game.speed === 0) return;
    const baseDelta = 0.05 * Game.speed; // 加快時間
    Game.hour += baseDelta;
    Game.minute = Math.floor((Game.hour % 1) * 60);

    if (Game.hour >= 24) {
      Game.hour -= 24;
      Game.day++;
      Game.actionCountToday = 0;
      Object.values(Game.characters).forEach(c => {
        c.age = Math.floor((Game.day - c.birthDay) / 365);
        c.todayActions = [];
      });
      dailySettlement();
    }

    Object.values(Game.characters).forEach(c => {
      try {
        if (c.currentAction) {
          executeAction(c, baseDelta);
        } else {
          aiThink(c);
        }
        // 需求衰減（加快）
        NEEDS_DEF.forEach(n => {
          c.needs[n.key] = Math.max(0, c.needs[n.key] - n.decay * baseDelta / 24);
        });
        // 情緒
        const avgNeed = Object.values(c.needs).reduce((a,b)=>a+b,0) / Object.keys(c.needs).length;
        c.mood.happy += (avgNeed - 50) * 0.02 * baseDelta;
        c.mood.happy = Math.max(-100, Math.min(100, c.mood.happy));
      } catch (e) { console.error(e); }
    });

    // 渲染降幀
    Game.tickCount++;
    if (Game.tickCount % 2 === 0) {
      renderCharList();
      renderSprites();
      renderSky();
      renderStatus();
      renderDateTime();
    }
  } catch (e) {
    console.error('TICK ERROR:', e);
  }
}

function dailySettlement() {
  try {
    Object.values(Game.characters).forEach(c => {
      let dailyCost = 100;
      c.money -= dailyCost;
      if (c.job && Game.day % 30 === 0) c.money += 18000;
    });
    if (Game.characters.protagonist.age >= 40) {
      Game.paused = true;
      alert(`🎬 40 歲人生總結\n\n職業：${Game.characters.protagonist.job ? Game.characters.protagonist.job.title : '無業'}\n財務：$${Math.round(Game.characters.protagonist.money).toLocaleString()}\n關係：${Game.characters.protagonist.relationship}`);
    }
  } catch (e) { console.error(e); }
}

function renderStatus() {
  try {
    const p = Game.characters.protagonist;
    const el1 = document.getElementById('money');
    if (el1) el1.textContent = '$' + Math.round(p.money).toLocaleString();
    const el2 = document.getElementById('life-progress');
    if (el2) el2.textContent = `${p.age} / 40 歲`;
    const el3 = document.getElementById('decisions-count');
    if (el3) el3.textContent = Game.decisionsCount;
    const el4 = document.getElementById('action-count');
    if (el4) el4.textContent = Game.actionCountToday;
  } catch (e) { console.error(e); }
}

function renderDateTime() {
  try {
    const year = 2026 + Math.floor(Game.day / 365);
    const dayOfYear = Game.day % 365;
    const month = Math.floor(dayOfYear / 30) + 1;
    const day = (dayOfYear % 30) + 1;
    const el1 = document.getElementById('date-display');
    if (el1) el1.textContent = `${year}/${String(month).padStart(2,'0')}/${String(day).padStart(2,'0')}`;
    const el2 = document.getElementById('time-display');
    if (el2) el2.textContent = `${String(Game.hour).padStart(2,'0')}:${String(Game.minute).padStart(2,'0')}`;
  } catch (e) { console.error(e); }
}

// ============================================================
// 初始化
// ============================================================
function init() {
  try {
    Game.characters.protagonist.birthDay = 0;
    document.querySelectorAll('.speed-btn[data-speed]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.speed-btn[data-speed]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        Game.speed = parseInt(btn.dataset.speed);
        Game.paused = Game.speed === 0;
      };
    });
    renderCharList();
    renderSprites();
    renderSky();
    renderStatus();
    renderDateTime();
    setInterval(tick, 100);
    addThought('protagonist', '🌟', '活躍 AI 引擎啟動 · 50+ 行動 · 自言自語系統', true);
    addMutter('protagonist', '今日會發生咩事呢？');
  } catch (e) {
    console.error('Init error:', e);
    alert('初始化錯誤：' + e.message);
  }
}

init();
</script>
</body>
</html>
