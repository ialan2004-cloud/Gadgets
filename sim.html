<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>少年人生 · 真實青春版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: #0f0f1e; color: #eee; user-select: none;
  }
  #app {
    width: 100vw; height: 100vh;
    display: grid;
    grid-template-rows: 38px 1fr 78px;
    grid-template-columns: 230px 1fr 340px;
    grid-template-areas: "top top top" "left center right" "bottom bottom bottom";
    gap: 4px; padding: 4px;
  }
  .panel {
    background: rgba(20, 20, 40, 0.88);
    border: 1px solid #3a3a5e;
    border-radius: 6px;
    padding: 6px;
    overflow: hidden;
    backdrop-filter: blur(6px);
  }
  #top {
    grid-area: top;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; font-size: 12px;
  }
  #top .left, #top .right { display: flex; gap: 6px; align-items: center; }
  #top .title { font-weight: 700; color: #ffd369; letter-spacing: 1px; font-size: 13px; }
  .btn {
    background: #2a2a4a; border: 1px solid #4a4a6a; color: #eee;
    padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;
  }
  .btn.active { background: #ffd369; color: #1a1a2e; font-weight: 700; }
  .btn:hover { background: #3a3a5a; }
  #left { grid-area: left; font-size: 11px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .char-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid #3a3a5e;
    border-radius: 6px;
    padding: 6px;
    cursor: pointer;
  }
  .char-card.selected { border-color: #ffd369; background: rgba(255,211,105,0.08); }
  .char-card .header { display: flex; align-items: center; gap: 6px; }
  .char-card .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .char-card .info { flex: 1; min-width: 0; }
  .char-card .name { font-weight: 700; font-size: 11px; color: #ffd369; }
  .char-card .sub { font-size: 9px; color: #aaa; }
  .char-card .state-line { font-size: 9px; color: #c084fc; margin-top: 2px; font-style: italic; }
  .section-title {
    font-size: 9px; color: #888; text-transform: uppercase;
    letter-spacing: 1px; margin: 4px 0 2px;
    border-bottom: 1px solid #3a3a5e; padding-bottom: 2px;
  }
  /* 人格優缺點 */
  .trait-row { display: flex; gap: 4px; flex-wrap: wrap; margin: 3px 0; }
  .trait-tag {
    padding: 2px 5px; border-radius: 3px; font-size: 8.5px;
  }
  .trait-good { background: rgba(107, 207, 127, 0.2); color: #6bcf7f; border: 1px solid rgba(107, 207, 127, 0.4); }
  .trait-bad { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; border: 1px solid rgba(255, 107, 107, 0.4); }
  /* 中央場景 */
  #center {
    grid-area: center;
    position: relative;
    overflow: hidden;
    transition: background 2s;
  }
  #scene-bg { position: absolute; inset: 0; transition: all 2s; }
  #scene-info {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(0,0,0,0.6);
    padding: 4px 8px; border-radius: 4px;
    font-size: 10px; z-index: 5;
  }
  #scene-info .loc { color: #ffd369; font-weight: 700; }
  #scene-info .mood-indicator { color: #ff69b4; font-size: 9px; }
  #scene-visual {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 90px; opacity: 0.25; pointer-events: none;
  }
  #location-map {
    position: absolute;
    bottom: 8px; left: 8px; right: 8px;
    display: flex; gap: 4px; flex-wrap: wrap; z-index: 5;
  }
  .loc-btn {
    background: rgba(0,0,0,0.5);
    border: 1px solid #4a4a6a;
    color: #eee;
    padding: 3px 6px; border-radius: 4px;
    font-size: 9px; cursor: pointer;
  }
  .loc-btn:hover { background: rgba(255,211,105,0.2); border-color: #ffd369; }
  .loc-btn.current { background: #ffd369; color: #1a1a2e; font-weight: 700; }
  .char-sprite {
    position: absolute; width: 28px; height: 40px;
    transition: left 1.2s, bottom 1.2s;
    z-index: 10; pointer-events: none;
  }
  .char-sprite .body {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 20px; height: 24px; border-radius: 4px 4px 2px 2px;
  }
  .char-sprite .head {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    width: 14px; height: 14px; background: #f5d4a8; border-radius: 50%;
  }
  .char-sprite .action {
    position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%);
    font-size: 16px; animation: float 1.5s infinite;
  }
  .char-sprite .name-tag {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    font-size: 9px; color: #fff;
    background: rgba(0,0,0,0.7); padding: 1px 5px; border-radius: 3px;
    white-space: nowrap;
  }
  @keyframes float {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -4px); }
  }
  /* 右側思考日誌 */
  #right {
    grid-area: right; font-size: 11px;
    display: flex; flex-direction: column;
  }
  #right h3 {
    font-size: 11px; color: #ffd369; margin-bottom: 4px;
    border-bottom: 1px solid #3a3a5e; padding-bottom: 3px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #thought-log {
    flex: 1; overflow-y: auto;
    font-family: "Menlo", "Consolas", monospace;
    font-size: 10px; line-height: 1.4;
  }
  .thought {
    margin-bottom: 5px; padding: 4px 6px;
    background: rgba(255, 255, 255, 0.03);
    border-left: 2px solid #4a6fa5;
    border-radius: 2px;
    animation: slideIn 0.3s ease-out;
  }
  .thought.decision { border-left-color: #ffd369; }
  .thought.event { border-left-color: #ff6b6b; background: rgba(255, 107, 107, 0.08); }
  .thought.love { border-left-color: #ff69b4; background: rgba(255, 105, 180, 0.08); }
  .thought.social { border-left-color: #fbbf24; background: rgba(251, 191, 36, 0.06); }
  .thought.low { border-left-color: #8b5cf6; background: rgba(139, 92, 246, 0.08); }
  .thought.high { border-left-color: #10b981; background: rgba(16, 185, 129, 0.08); }
  .thought.mutter { border-left-color: #c084fc; background: rgba(192, 132, 252, 0.06); }
  .thought .time { color: #888; font-size: 8px; }
  .thought .tag {
    display: inline-block; padding: 0 3px;
    background: #2a2a4a; border-radius: 3px;
    font-size: 8px; margin-right: 2px; color: #aaa;
  }
  .thought .quote {
    margin-top: 3px; padding: 3px 5px;
    background: rgba(255, 211, 105, 0.1);
    border-radius: 3px; color: #ffd369;
    font-style: italic; font-size: 10px;
  }
  .thought .dialogue {
    margin-top: 3px; padding: 3px 5px;
    background: rgba(251, 191, 36, 0.1);
    border-radius: 3px; color: #fbbf24;
    font-size: 10px;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  /* 底部 */
  #bottom {
    grid-area: bottom;
    display: flex; gap: 5px; align-items: center;
    font-size: 10px;
  }
  .stat-box {
    flex: 1;
    background: rgba(255, 255, 255, 0.04);
    padding: 4px 6px; border-radius: 5px;
    border: 1px solid #3a3a5e;
    min-width: 0;
  }
  .stat-box .label { font-size: 8px; color: #888; text-transform: uppercase; }
  .stat-box .value { font-size: 12px; color: #ffd369; font-weight: 700; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-box .sub { font-size: 9px; color: #aaa; }
  .life-meter {
    height: 4px; background: #2a2a4a; border-radius: 2px; overflow: hidden; margin-top: 2px;
  }
  .life-meter .fill {
    height: 100%; border-radius: 2px; transition: width 0.5s;
  }
  /* 彈窗 */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(6px);
  }
  .modal.show { display: flex; }
  .modal-card {
    background: linear-gradient(135deg, #2a2a4a, #1a1a2e);
    border: 2px solid #ffd369;
    border-radius: 12px;
    padding: 16px;
    width: 94%; max-width: 600px;
    max-height: 88vh; overflow-y: auto;
  }
  .modal-card h2 { color: #ffd369; font-size: 16px; margin-bottom: 10px; }
  .modal-card h3 { color: #c084fc; font-size: 13px; margin: 8px 0 4px; }
  .modal-card .context {
    font-size: 11px; color: #ccc; margin-bottom: 10px;
    padding: 8px; background: rgba(0, 0, 0, 0.3); border-radius: 5px;
    line-height: 1.5;
  }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .choice-btn {
    background: #2a2a4a; border: 1px solid #4a4a6a;
    color: #eee; padding: 10px; border-radius: 5px;
    cursor: pointer; font-size: 11px; text-align: left;
  }
  .choice-btn:hover { background: #3a3a5a; border-color: #ffd369; }
  .choice-btn .icon { font-size: 16px; display: block; margin-bottom: 3px; }
  .choice-btn .desc { font-size: 9px; color: #aaa; margin-top: 2px; }
  /* 半年報告 */
  .report-section {
    background: rgba(0,0,0,0.25);
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 8px;
  }
  .report-section .title { font-size: 11px; color: #ffd369; font-weight: 700; margin-bottom: 4px; }
  .report-row { display: flex; justify-content: space-between; font-size: 10px; padding: 2px 0; }
  .report-row .up { color: #10b981; }
  .report-row .down { color: #ff6b6b; }
  .life-graph {
    display: flex; gap: 1px; height: 30px; align-items: flex-end;
    background: rgba(0,0,0,0.3); padding: 2px; border-radius: 3px;
  }
  .life-graph .bar {
    flex: 1; background: linear-gradient(to top, #c084fc, #ffd369);
    border-radius: 1px 1px 0 0;
    min-width: 2px;
  }
  .life-graph .bar.low { background: linear-gradient(to top, #8b5cf6, #c084fc); }
  .life-graph .bar.high { background: linear-gradient(to top, #10b981, #34d399); }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: #4a4a6a; border-radius: 2px; }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate-hint {
      display: flex !important;
      position: fixed; inset: 0;
      background: #1a1a2e; z-index: 1000;
      align-items: center; justify-content: center;
      flex-direction: column; color: #ffd369;
    }
    #rotate-hint .icon { font-size: 50px; margin-bottom: 15px; animation: rotate 2s infinite; }
    @keyframes rotate { 50% { transform: rotate(90deg); } }
  }
  #rotate-hint { display: none; }
</style>
</head>
<body>
<div id="rotate-hint">
  <div class="icon">📱</div>
  <div>請將手機橫向</div>
</div>

<div id="app">
  <div id="top" class="panel">
    <div class="left">
      <span class="title">🌊 少年人生</span>
      <span id="date-display">2026/10/07</span>
      <span id="time-display" style="color:#ffd369">08:00</span>
      <span id="life-stage-tag" style="color:#c084fc">🌱 少年期</span>
    </div>
    <div class="right">
      <button class="btn" data-speed="0">⏸</button>
      <button class="btn active" data-speed="1">▶</button>
      <button class="btn" data-speed="3">▶▶</button>
      <button class="btn" data-speed="10">▶▶▶</button>
      <button class="btn" id="save-btn">💾</button>
    </div>
  </div>

  <div id="left" class="panel">
    <div class="section-title">👤 主角</div>
    <div id="char-list"></div>
    <div class="section-title">🎭 人格</div>
    <div id="personality-display"></div>
    <div class="section-title">💕 感情狀態</div>
    <div id="love-display" style="font-size:10px;padding:4px;"></div>
    <div class="section-title">👥 社交圈</div>
    <div id="social-display" style="font-size:10px;padding:4px;"></div>
  </div>

  <div id="center">
    <div id="scene-bg"></div>
    <div id="scene-info">
      <div class="loc" id="scene-loc">🏠 屋企</div>
      <div class="mood-indicator" id="mood-indicator">😐 平靜</div>
    </div>
    <div id="scene-visual">🏠</div>
    <div id="location-map"></div>
  </div>

  <div id="right" class="panel">
    <h3>
      <span>💭 生活流</span>
      <span id="log-char-name" style="font-size:10px;color:#aaa"></span>
    </h3>
    <div id="thought-log"></div>
  </div>

  <div id="bottom" class="panel">
    <div class="stat-box">
      <div class="label">當前行動</div>
      <div class="value" id="today-action">—</div>
    </div>
    <div class="stat-box">
      <div class="label">人生階段</div>
      <div class="value" id="life-progress">20 / 40 歲</div>
      <div class="sub" id="life-days">第 0 日</div>
    </div>
    <div class="stat-box">
      <div class="label">人生曲線</div>
      <div class="life-meter"><div class="fill" id="life-curve" style="width:50%;background:#ffd369"></div></div>
      <div class="sub" id="life-trend">平穩</div>
    </div>
    <div class="stat-box">
      <div class="label">💰 財務</div>
      <div class="value" id="money">$15,000</div>
    </div>
    <div class="stat-box">
      <div class="label">💕 社交</div>
      <div class="value" id="social-count">0</div>
      <div class="sub">朋友</div>
    </div>
  </div>
</div>

<!-- 事件彈窗 -->
<div id="event-modal" class="modal">
  <div class="modal-card">
    <h2><span id="event-icon">⚡</span> <span id="event-title">人生抉擇</span></h2>
    <div class="context" id="event-context"></div>
    <div class="choices" id="event-choices"></div>
  </div>
</div>

<!-- 半年報告彈窗 -->
<div id="report-modal" class="modal">
  <div class="modal-card">
    <h2>📊 <span id="report-title">人生階段報告</span></h2>
    <div id="report-content"></div>
    <div style="text-align:center;margin-top:10px;">
      <button class="btn" onclick="document.getElementById('report-modal').classList.remove('show')">繼續人生 →</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ============================================================
// 《少年人生》真實青春版
// 社交圈 × 兩性生活 × 人格優缺點 × 人生高低 × 半年報告
// ============================================================

const Game = {
  day: 0, hour: 8, minute: 0,
  speed: 1, paused: false,
  selectedCharId: 'protagonist',
  characters: {},
  tickCount: 0,
  // 人生曲線（記錄高低起跌）
  lifeCurve: [],
  // 報告追蹤
  lastReportDay: 0,
  halfYearReports: [],
  // 事件冷卻
  eventCooldown: 0,
};

// ============================================================
// 人格優缺點系統
// ============================================================
const GOOD_TRAITS = [
  { id: 'kind', name: '善良', desc: '容易交到朋友，人緣好', socialBonus: 10, loveBonus: 5 },
  { id: 'smart', name: '聰明', desc: '學業/工作表現好', careerBonus: 15 },
  { id: 'humorous', name: '幽默', desc: '社交場合受歡迎', socialBonus: 15, loveBonus: 8 },
  { id: 'diligent', name: '勤奮', desc: '努力不懈，容易成功', careerBonus: 10, moneyBonus: 10 },
  { id: 'caring', name: '體貼', desc: '伴侶/朋友覺得被重視', loveBonus: 12, socialBonus: 5 },
  { id: 'brave', name: '勇敢', desc: '敢於嘗試，敢表白', loveBonus: 10, careerBonus: 5 },
  { id: 'creative', name: '有創意', desc: '有獨特想法', funBonus: 10, careerBonus: 8 },
  { id: 'resilient', name: '堅韌', desc: '面對挫折容易恢復', mentalBonus: 15 },
];

const BAD_TRAITS = [
  { id: 'lazy', name: '懶惰', desc: '容易拖延，錯過機會', careerPenalty: 10, energyPenalty: 5 },
  { id: 'impulsive', name: '衝動', desc: '容易做出後悔的決定', decisionRisk: 15, lovePenalty: 8 },
  { id: 'insecure', name: '自卑', desc: '不敢表達自己，錯過機會', lovePenalty: 12, socialPenalty: 8 },
  { id: 'jealous', name: '嫉妒', desc: '見不得人好，影響關係', socialPenalty: 10, lovePenalty: 8 },
  { id: 'avoidant', name: '逃避', desc: '遇到問題傾向逃避', problemPenalty: 15, lovePenalty: 10 },
  { id: 'stubborn', name: '固執', desc: '聽不進人勸，容易吵架', socialPenalty: 8, lovePenalty: 10 },
  { id: 'selfish', name: '自私', desc: '只顧自己，朋友會離開', socialPenalty: 15, lovePenalty: 12 },
  { id: 'emotional', name: '情緒化', desc: '情緒波動大，影響判斷', mentalPenalty: 10, lovePenalty: 8 },
  { id: 'procrastinator', name: '拖延', desc: '總是要到最後才做', careerPenalty: 12 },
  { id: 'overspender', name: '揮霍', desc: '花錢大手大腳', moneyPenalty: 15 },
];

function generatePersonality() {
  // 隨機 2-3 個優點 + 2-3 個缺點
  const goods = [...GOOD_TRAITS].sort(() => Math.random() - 0.5).slice(0, 2 + Math.floor(Math.random() * 2));
  const bads = [...BAD_TRAITS].sort(() => Math.random() - 0.5).slice(0, 2 + Math.floor(Math.random() * 2));
  return { good: goods.map(g => g.id), bad: bads.map(b => b.id) };
}

function hasTrait(c, traitId) {
  return c.personality.good.includes(traitId) || c.personality.bad.includes(traitId);
}

function getTraitBonus(c, bonusKey) {
  let total = 0;
  for (const t of GOOD_TRAITS) {
    if (c.personality.good.includes(t.id) && t[bonusKey]) total += t[bonusKey];
  }
  return total;
}

function getTraitPenalty(c, penaltyKey) {
  let total = 0;
  for (const t of BAD_TRAITS) {
    if (c.personality.bad.includes(t.id) && t[penaltyKey]) total += t[penaltyKey];
  }
  return total;
}

// ============================================================
// 地點系統（社交導向）
// ============================================================
const LOCATIONS = {
  home_bedroom: { name: '睡房', icon: '🛏', type: 'home', visual: '🛏', bg: 'linear-gradient(to bottom, #4a3a5e, #3a2a4e)' },
  home_living: { name: '客廳', icon: '🛋', type: 'home', visual: '🛋', bg: 'linear-gradient(to bottom, #a89070, #887050)' },
  home_kitchen: { name: '廚房', icon: '🍳', type: 'home', visual: '🍳', bg: 'linear-gradient(to bottom, #d4a574, #b48554)' },
  university: { name: '大學', icon: '🎓', type: 'social', visual: '🎓', bg: 'linear-gradient(to bottom, #87ceeb, #6ba5d8)' },
  cafe: { name: 'Cafe', icon: '☕', type: 'social', visual: '☕', bg: 'linear-gradient(to bottom, #8b6f47, #6b4f27)' },
  mall: { name: '商場', icon: '🏬', type: 'social', visual: '🏬', bg: 'linear-gradient(to bottom, #e8e8e8, #c8c8c8)' },
  park: { name: '公園', icon: '🌳', type: 'social', visual: '🌳', bg: 'linear-gradient(to bottom, #87ceeb, #6bcf7f)' },
  bar: { name: 'Bar/Club', icon: '🍸', type: 'social', visual: '🍸', bg: 'linear-gradient(to bottom, #2a1a3e, #1a0a2e)' },
  restaurant: { name: '餐廳', icon: '🍽', type: 'social', visual: '🍽', bg: 'linear-gradient(to bottom, #d4a574, #b48554)' },
  cinema: { name: '戲院', icon: '🎬', type: 'social', visual: '🎬', bg: 'linear-gradient(to bottom, #1a1a2e, #0a0a1e)' },
  gym: { name: 'Gym', icon: '🏋️', type: 'social', visual: '🏋️', bg: 'linear-gradient(to bottom, #3a3a5e, #2a2a4e)' },
  karaoke: { name: 'K房', icon: '🎤', type: 'social', visual: '🎤', bg: 'linear-gradient(to bottom, #4a2a6e, #3a1a5e)' },

// ============================================================
// AI 思考循環
// ============================================================
function aiThink(c) {
  try {
    const candidates = [];
    for (const [key, act] of Object.entries(ACTIONS)) {
      if (!act.condition(c)) continue;
      let score = 50;
      // 需求匹配
      for (const [nk, nv] of Object.entries(act.effects)) {
        if (nv > 0 && c.needs[nk] < 50) score += (50 - c.needs[nk]) * 0.8;
        if (nv < 0 && c.needs[nk] < 30) score -= 40;
      }
      // 社交加成（如果有朋友）
      if (act.socialGain && c.social.friends.length > 0) score += act.socialGain * 2;
      // 愛情加成
      if (act.loveGain && c.love.status !== 'single') score += act.loveGain * 2;
      // 性格影響
      if (act.location === 'bar' || act.location === 'karaoke') score += c.personality.good.includes('humorous') ? 10 : 0;
      if (act.location === 'library') score += c.personality.good.includes('diligent') ? 10 : 0;
      if (act.name.includes('獨自')) score += c.personality.bad.includes('insecure') ? 8 : -5;
      // 金錢
      if (act.cost && c.money < act.cost * 2) score -= 30;
      // 隨機
      score += (Math.random() - 0.5) * 25;
      candidates.push({ key, act, score });
    }

    if (candidates.length === 0) {
      c.currentAction = ACTIONS.idle;
      c.actionTimer = 0.3;
      return;
    }

    candidates.sort((a, b) => b.score - a.score);
    const chosen = candidates[0];

    if (c.id === Game.selectedCharId || c.isProtagonist) {
      addThought(c.id, '決定', `${chosen.act.icon} ${chosen.act.name} (${Math.round(chosen.score)})`, true);
      if (chosen.act.mutter && Math.random() < 0.4) {
        const m = chosen.act.mutter[Math.floor(Math.random() * chosen.act.mutter.length)];
        addMutter(c.id, m);
      }
    }

    c.currentAction = chosen.act;
    c.actionTimer = chosen.act.duration;

    // 社交效果
    if (chosen.act.socialGain && Math.random() < 0.3) {
      c.social.popularity = Math.min(100, c.social.popularity + chosen.act.socialGain);
      if (c.social.friends.length < 10 && Math.random() < 0.2) {
        const newName = generateFriendName();
        c.social.friends.push(newName);
        if (c.id === Game.selectedCharId || c.isProtagonist) {
          addThought(c.id, '👥', `認識咗新朋友 ${newName}！`, false);
        }
      }
    }

    // 愛情效果
    if (chosen.act.loveGain && c.love.status === 'dating') {
      c.love.affection = Math.min(100, c.love.affection + chosen.act.loveGain);
      if (c.love.affection > 70 && c.love.status === 'dating') {
        c.love.status = 'in_relationship';
        c.love.daysTogether = 1;
        if (c.id === Game.selectedCharId || c.isProtagonist) {
          addThought(c.id, '💕', `同 ${c.love.partnerName} 正式一起！`, false, false);
        }
      }
    }
  } catch (e) {
    console.error('aiThink error:', e);
    c.currentAction = ACTIONS.idle;
    c.actionTimer = 0.3;
  }
}

function checkLifeEvents(c) {
  try {
    if (Game.eventCooldown > 0) return;
    const allEvents = [...LIFE_EVENTS.high, ...LIFE_EVENTS.low, ...LIFE_EVENTS.romantic];
    for (const evt of allEvents) {
      if (evt.trigger(c)) {
        Game.eventCooldown = 30; // 30 tick 冷卻
        triggerLifeEvent(evt, c);
        return;
      }
    }
  } catch (e) { console.error(e); }
}

function triggerLifeEvent(evt, c) {
  try {
    const isHigh = LIFE_EVENTS.high.includes(evt);
    const isLow = LIFE_EVENTS.low.includes(evt);
    const isRomantic = LIFE_EVENTS.romantic.includes(evt);

    evt.effect(c);
    c.lifeEvents.push({ day: Game.day, title: evt.title, icon: evt.icon, impact: evt.lifeImpact });
    Game.lifeCurve.push(evt.lifeImpact);

    if (c.id === Game.selectedCharId || c.isProtagonist) {
      const type = isHigh ? 'high' : isLow ? 'low' : 'love';
      addThought(c.id, `${evt.icon} ${evt.title}`, evt.context, false, false, type);
    }

    // 顯示彈窗（只有重大事件）
    if (Math.abs(evt.lifeImpact) >= 15) {
      showLifeEventModal(evt, c);
    }
  } catch (e) { console.error(e); }
}

function showLifeEventModal(evt, c) {
  try {
    const modal = document.getElementById('event-modal');
    if (!modal || modal.classList.contains('show')) return;
    Game.paused = true;
    document.getElementById('event-icon').textContent = evt.icon;
    document.getElementById('event-title').textContent = evt.title;
    document.getElementById('event-context').textContent = evt.context;
    const choicesEl = document.getElementById('event-choices');
    if (choicesEl) {
      choicesEl.innerHTML = `
        <button class="choice-btn" onclick="this.parentElement.innerHTML='<div style=&quot;text-align:center;padding:20px&quot;>✓ 經歷過咗，人生繼續...</div>';setTimeout(()=>document.getElementById('event-modal').classList.remove('show');Game.paused=false;,1500)">
          <span class="icon">✨</span><b>接受呢個經歷</b>
          <div class="desc">人生總有高低，繼續前行</div>
        </button>
      `;
    }
    modal.classList.add('show');
  } catch (e) {
    console.error(e);
    Game.paused = false;
  }
}

// ============================================================
// 半年報告系統
// ============================================================
function generateHalfYearReport(c) {
  try {
    const daysSinceReport = Game.day - Game.lastReportDay;
    if (daysSinceReport < 180) return; // 每 180 日一次
    Game.lastReportDay = Game.day;

    Game.paused = true;
    const modal = document.getElementById('report-modal');
    const titleEl = document.getElementById('report-title');
    const contentEl = document.getElementById('report-content');
    if (!modal || !titleEl || !contentEl) { Game.paused = false; return; }

    const halfYearNum = Math.floor(Game.day / 180) + 1;
    titleEl.textContent = `${c.age}歲 · 第 ${halfYearNum} 個半年報告`;

    // 計算數據
    const recentEvents = c.lifeEvents.filter(e => e.day >= Game.day - 180);
    const highCount = recentEvents.filter(e => e.impact > 0).length;
    const lowCount = recentEvents.filter(e => e.impact < 0).length;
    const avgImpact = recentEvents.length > 0 ? recentEvents.reduce((s, e) => s + e.impact, 0) / recentEvents.length : 0;

    // 人生曲線圖
    const curveData = Game.lifeCurve.slice(-20);
    const maxImpact = Math.max(...curveData.map(Math.abs), 1);

    let html = `
      <div class="report-section">
        <div class="title">📊 這半年的高低起跌</div>
        <div class="life-graph">
          ${curveData.map(v => {
            const h = Math.abs(v) / maxImpact * 100;
            const cls = v > 0 ? 'high' : v < 0 ? 'low' : '';
            return `<div class="bar ${cls}" style="height:${h}%"></div>`;
          }).join('')}
        </div>
        <div class="report-row"><span>高峰事件</span><span class="up">${highCount} 次</span></div>
        <div class="report-row"><span>低谷事件</span><span class="down">${lowCount} 次</span></div>
        <div class="report-row"><span>平均趨勢</span><span class="${avgImpact > 0 ? 'up' : 'down'}">${avgImpact > 0 ? '↑ 上升' : avgImpact < 0 ? '↓ 下降' : '→ 平穩'}</span></div>
      </div>
      <div class="report-section">
        <div class="title">💰 財務狀況</div>
        <div class="report-row"><span>現有資金</span><span>$${Math.round(c.money).toLocaleString()}</span></div>
        <div class="report-row"><span>職業</span><span>${c.job ? c.job.title : '待業/學生'}</span></div>
      </div>
      <div class="report-section">
        <div class="title">💕 感情生活</div>
        <div class="report-row"><span>狀態</span><span>${getLoveStatusText(c.love.status)}</span></div>
        ${c.love.partnerName ? `<div class="report-row"><span>對象</span><span>${c.love.partnerName}</span></div>` : ''}
        <div class="report-row"><span>暗戀次數</span><span>${c.love.crushCount}</span></div>
        <div class="report-row"><span>分手次數</span><span>${c.love.heartbreakCount}</span></div>
      </div>
      <div class="report-section">
        <div class="title">👥 社交圈</div>
        <div class="report-row"><span>朋友數量</span><span>${c.social.friends.length}</span></div>
        <div class="report-row"><span>受歡迎度</span><span>${c.social.popularity}/100</span></div>
      </div>
      <div class="report-section">
        <div class="title">🎭 人格特質</div>
        <div class="trait-row">
          ${c.personality.good.map(id => {
            const t = GOOD_TRAITS.find(g => g.id === id);
            return t ? `<span class="trait-tag trait-good">✓ ${t.name}</span>` : '';
          }).join('')}
          ${c.personality.bad.map(id => {
            const t = BAD_TRAITS.find(b => b.id === id);
            return t ? `<span class="trait-tag trait-bad">✗ ${t.name}</span>` : '';
          }).join('')}
        </div>
      </div>
      <div class="report-section">
        <div class="title">🌟 人生感悟</div>
        <div style="font-size:11px;color:#ccc;font-style:italic;line-height:1.5">
          ${getLifeWisdom(c, avgImpact)}
        </div>
      </div>
    `;
    contentEl.innerHTML = html;
    modal.classList.add('show');
  } catch (e) {
    console.error('Report error:', e);
    Game.paused = false;
  }
}

function getLoveStatusText(status) {
  const map = {
    single: '單身 🙁',
    crush: '暗戀中 💭',
    dating: '曖昧/約會 💕',
    in_relationship: '拍拖中 ❤️',
    heartbroken: '失戀 💔',
  };
  return map[status] || status;
}

function getLifeWisdom(c, avgImpact) {
  if (avgImpact > 10) return '這半年過得不錯，继续保持！人生總會有意想不到的驚喜，珍惜當下。';
  if (avgImpact > 0) return '雖然有起伏，但整體向好。你的優點在關鍵時刻幫了你，記得也留意自己的缺點。';
  if (avgImpact > -10) return '人生難免有高低，但你不放棄的精神值得欣賞。繼續努力，黎明前總是最黑暗。';
  return '這半年比較艱難，但每一個低谷都是成長的機會。你的韌性會幫你渡過難關，記住：沒有永遠的低潮。';
}

// ============================================================
// UI 渲染
// ============================================================
function addThought(charId, tag, text, isDecision = false, isEvent = false, type = '') {
  try {
    if (charId !== Game.selectedCharId && charId !== 'protagonist') return;
    const c = Game.characters[charId];
    if (!c) return;
    const log = document.getElementById('thought-log');
    if (!log) return;
    const div = document.createElement('div');
    div.className = 'thought' + (isDecision ? ' decision' : '') + (type ? ' ' + type : '');
    div.innerHTML = `<div class="time">🕐 ${String(Game.hour).padStart(2,'0')}:${String(Game.minute).padStart(2,'0')}</div><span class="tag">${tag}</span> ${text}`;
    log.insertBefore(div, log.firstChild);
    while (log.children.length > 60) log.removeChild(log.lastChild);
  } catch (e) { console.error(e); }
}

function addMutter(charId, text) {
  try {
    if (charId !== Game.selectedCharId && charId !== 'protagonist') return;
    const c = Game.characters[charId];
    if (!c) return;
    const log = document.getElementById('thought-log');
    if (!log) return;
    const div = document.createElement('div');
    div.className = 'thought mutter';
    div.innerHTML = `<div class="time">💬 ${c.name}</div><div class="quote">「${text}」</div>`;
    log.insertBefore(div, log.firstChild);
  } catch (e) { console.error(e); }
}

function renderPersonality() {
  try {
    const c = Game.characters.protagonist;
    const el = document.getElementById('personality-display');
    if (!el) return;
    el.innerHTML = `
      <div class="trait-row">
        ${c.personality.good.map(id => {
          const t = GOOD_TRAITS.find(g => g.id === id);
          return t ? `<span class="trait-tag trait-good" title="${t.desc}">✓ ${t.name}</span>` : '';
        }).join('')}
      </div>
      <div class="trait-row">
        ${c.personality.bad.map(id => {
          const t = BAD_TRAITS.find(b => b.id === id);
          return t ? `<span class="trait-tag trait-bad" title="${t.desc}">✗ ${t.name}</span>` : '';
        }).join('')}
      </div>
    `;
  } catch (e) { console.error(e); }
}

function renderLoveDisplay() {
  try {
    const c = Game.characters.protagonist;
    const el = document.getElementById('love-display');
    if (!el) return;
    let html = `<div>狀態：${getLoveStatusText(c.love.status)}</div>`;
    if (c.love.partnerName) {

    }
    html += `<div style="color:#888;font-size:9px">暗戀 ${c.love.crushCount} 次 · 分手 ${c.love.heartbreakCount} 次</div>`;
    el.innerHTML = html;
  } catch (e) { console.error(e); }
}

function renderSocialDisplay() {
  try {
    const c = Game.characters.protagonist;
    const el = document.getElementById('social-display');
    if (!el) return;
    let html = `<div>朋友：${c.social.friends.length} 人</div>`;
    html += `<div>受歡迎：${c.social.popularity}/100</div>`;
    if (c.social.friends.length > 0) {
      html += `<div style="color:#888;font-size:9px;margin-top:2px">${c.social.friends.slice(0, 5).join('、')}${c.social.friends.length > 5 ? '...' : ''}</div>`;
    }
    el.innerHTML = html;
  } catch (e) { console.error(e); }

function renderScene() {
  try {
    const c = Game.characters.protagonist;
    const loc = LOCATIONS[c.currentRoom] || LOCATIONS.home_living;
    const sceneBg = document.getElementById('scene-bg');
    const sceneVisual = document.getElementById('scene-visual');
    const sceneLoc = document.getElementById('scene-loc');
    const moodEl = document.getElementById('mood-indicator');
    if (sceneBg) sceneBg.style.background = loc.bg;
    if (sceneVisual) sceneVisual.textContent = loc.visual;
    if (sceneLoc) sceneLoc.textContent = `${loc.icon} ${loc.name}`;
    if (moodEl) {
      const h = c.mood.happy;
      if (h > 40) moodEl.textContent = '😄 開心';
      else if (h > 20) moodEl.textContent = '🙂 不錯';
      else if (h > -20) moodEl.textContent = '😐 平靜';
      else if (h > -40) moodEl.textContent = '😟 低落';
      else moodEl.textContent = '😢 難過';
    }
    // 地點按鈕
    const map = document.getElementById('location-map');
    if (map) {
      map.innerHTML = '';
      Object.entries(LOCATIONS).forEach(([key, loc]) => {
        if (loc.type === 'transit') return;
        const btn = document.createElement('div');
        btn.className = 'loc-btn' + (key === c.currentRoom ? ' current' : '');
        btn.textContent = `${loc.icon} ${loc.name}`;
        btn.onclick = () => { c.currentRoom = key; };
        map.appendChild(btn);
      });
    }
  } catch (e) { console.error(e); }
}

function renderCharList() {
  try {
    const list = document.getElementById('char-list');
    if (!list) return;
    list.innerHTML = '';
    Object.values(Game.characters).forEach(c => {
      const card = document.createElement('div');
      card.className = 'char-card' + (c.id === Game.selectedCharId ? ' selected' : '');
      card.onclick = () => {
        Game.selectedCharId = c.id;
        renderCharList();
        const log = document.getElementById('thought-log');
        if (log) log.innerHTML = '';
        const nameEl = document.getElementById('log-char-name');
        if (nameEl) nameEl.textContent = c.name;
      };
      const stateLine = c.currentAction ? `${c.currentAction.icon} ${c.currentAction.name}` : '思考中...';
      card.innerHTML = `
        <div class="header">
          <div class="avatar" style="background:${c.color}">${c.avatar}</div>
          <div class="info">
            <div class="name">${c.name}</div>
            <div class="sub">${c.age}歲 · ${c.love.status === 'single' ? '單身' : c.love.partnerName || ''}</div>
          </div>
        </div>
        <div class="state-line">${stateLine}</div>
      `;
      list.appendChild(card);
    });
  } catch (e) { console.error(e); }
}

function renderSprites() {
  try {
    const c = Game.characters.protagonist;
    if (!c.spriteEl) {
      const el = document.createElement('div');
      el.className = 'char-sprite';
      el.innerHTML = `
        <div class="name-tag">${c.name}</div>
        <div class="action"></div>
        <div class="head"></div>
        <div class="body" style="background:${c.color}"></div>
      `;
      document.getElementById('center').appendChild(el);
      c.spriteEl = el;
    }
    const centerRect = document.getElementById('center').getBoundingClientRect();
    const x = centerRect.width / 2 - 14;
    const y = centerRect.height / 2 - 20;
    c.spriteEl.style.left = x + 'px';
    c.spriteEl.style.bottom = (centerRect.height - y - 40) + 'px';
    const actionEl = c.spriteEl.querySelector('.action');
    if (actionEl) actionEl.textContent = c.currentAction ? c.currentAction.icon : '';
  } catch (e) { console.error(e); }
}

function executeAction(c, deltaHours) {
  try {
    const act = c.currentAction;
    if (!act) return;
    const ratio = deltaHours / Math.max(act.duration, 0.1);
    for (const [k, v] of Object.entries(act.effects)) {
      if (c.needs[k] !== undefined) c.needs[k] = Math.max(0, Math.min(100, c.needs[k] + v * ratio));
    }
    if (act.cost) c.money -= act.cost * ratio;
    if (act.income) c.money += act.income * ratio;
    if (act.healthBonus) {
      for (const [k, v] of Object.entries(act.healthBonus)) c.health[k] = Math.min(100, c.health[k] + v * ratio);
    }
    c.actionTimer -= deltaHours;
    if (c.actionTimer <= 0) {
      if (c.id === Game.selectedCharId || c.isProtagonist) {
        const el = document.getElementById('today-action');
        if (el) el.textContent = act.icon + ' ' + act.name;
      }
      c.currentAction = null;
    }
  } catch (e) {
    console.error(e);
    c.currentAction = null;
  }
}

// ============================================================
// 主 tick（加快進度）
// ============================================================
function tick() {
  try {
    if (Game.paused || Game.speed === 0) return;
    const baseDelta = 0.15 * Game.speed; // 加快 3 倍
    Game.hour += baseDelta;
    Game.minute = Math.floor((Game.hour % 1) * 60);
    if (Game.eventCooldown > 0) Game.eventCooldown--;

    if (Game.hour >= 24) {
      Game.hour -= 24;
      Game.day++;
      Object.values(Game.characters).forEach(c => {
        c.age = Math.floor((Game.day - c.birthDay) / 365);
        // 感情日數
        if (c.love.status === 'in_relationship') c.love.daysTogether++;
        // 感情自然衰減
        if (c.love.status === 'in_relationship') {
          c.love.affection = Math.max(0, c.love.affection - 0.5);
        }
      });
      dailySettlement();
    }

    Object.values(Game.characters).forEach(c => {
      try {
        if (c.currentAction) executeAction(c, baseDelta);
        else aiThink(c);
        NEEDS_DEF.forEach(n => {
          c.needs[n.key] = Math.max(0, c.needs[n.key] - n.decay * baseDelta / 24);
        });
        // 情緒
        const avgNeed = Object.values(c.needs).reduce((a,b)=>a+b,0) / Object.keys(c.needs).length;
        c.mood.happy += (avgNeed - 50) * 0.02 * baseDelta;
        c.mood.happy = Math.max(-100, Math.min(100, c.mood.happy));
      } catch (e) { console.error(e); }
    });

    // 檢查人生事件
    const p = Game.characters.protagonist;
    checkLifeEvents(p);
    // 半年報告
    generateHalfYearReport(p);

    Game.tickCount++;
    if (Game.tickCount % 2 === 0) {
      renderCharList();
      renderSprites();
      renderScene();
      renderPersonality();
      renderLoveDisplay();
      renderSocialDisplay();
      renderStatus();
      renderDateTime();
    }
  } catch (e) {
    console.error('TICK ERROR:', e);
  }
}

function dailySettlement() {
  try {
    Object.values(Game.characters).forEach(c => {
      c.money -= 100;
      if (c.job && Game.day % 30 === 0) c.money += 18000;
      // 健康
      if (c.health.disease) {
        c.health.physical = Math.max(0, c.health.physical - 1);
        if (Math.random() < 0.2) c.health.disease = null;
      }
      // 人格缺點觸發
      if (c.personality.bad.includes('overspender') && Math.random() < 0.1) {
        c.money -= 200;
      }
      if (c.personality.bad.includes('lazy') && Math.random() < 0.1) {
        c.needs.fun = Math.min(100, c.needs.fun + 10);
      }
    });
    if (Game.characters.protagonist.age >= 40) {
      Game.paused = true;
      const p = Game.characters.protagonist;
      alert(`🎬 40 歲人生總結\n\n${p.name} 的人生告一段落。\n\n💰 財務：$${Math.round(p.money).toLocaleString()}\n💕 感情：${getLoveStatusText(p.love.status)}\n👥 朋友：${p.social.friends.length}\n📊 人生事件：${p.lifeEvents.length} 次\n\n人生有高低，但你走過來了。`);
    }
  } catch (e) { console.error(e); }
}

function renderStatus() {
  try {
    const p = Game.characters.protagonist;
    const el1 = document.getElementById('money');
    if (el1) el1.textContent = '$' + Math.round(p.money).toLocaleString();
    const el2 = document.getElementById('life-progress');
    if (el2) el2.textContent = `${p.age} / 40 歲`;
    const el3 = document.getElementById('life-days');
    if (el3) el3.textContent = `第 ${Game.day} 日`;
    const el4 = document.getElementById('social-count');
    if (el4) el4.textContent = p.social.friends.length;
    // 人生曲線
    const curveEl = document.getElementById('life-curve');
    const trendEl = document.getElementById('life-trend');
    if (curveEl && trendEl) {
      const recent = Game.lifeCurve.slice(-10);
      const avg = recent.length > 0 ? recent.reduce((a,b)=>a+b,0) / recent.length : 0;
      const pct = Math.max(0, Math.min(100, 50 + avg));
      curveEl.style.width = pct + '%';
      curveEl.style.background = avg > 5 ? '#10b981' : avg < -5 ? '#ff6b6b' : '#ffd369';
      trendEl.textContent = avg > 5 ? '📈 上升' : avg < -5 ? '📉 下降' : '→ 平穩';
    }
    // 人生階段
    const stageEl = document.getElementById('life-stage-tag');
    if (stageEl) {
      if (p.age < 25) stageEl.textContent = '🌱 少年期';
      else if (p.age < 30) stageEl.textContent = '🌿 青年期';
      else if (p.age < 35) stageEl.textContent = '🌳 成年期';
      else stageEl.textContent = '🌲 成熟期';
    }
  } catch (e) { console.error(e); }
}

function renderDateTime() {
  try {
    const year = 2026 + Math.floor(Game.day / 365);
    const dayOfYear = Game.day % 365;
    const month = Math.floor(dayOfYear / 30) + 1;
    const day = (dayOfYear % 30) + 1;
    const el1 = document.getElementById('date-display');
    if (el1) el1.textContent = `${year}/${String(month).padStart(2,'0')}/${String(day).padStart(2,'0')}`;
    const el2 = document.getElementById('time-display');
    if (el2) el2.textContent = `${String(Game.hour).padStart(2,'0')}:${String(Game.minute).padStart(2,'0')}`;
  } catch (e) { console.error(e); }
}

// ============================================================
// 初始化
// ============================================================
function init() {
  try {
    Game.characters.protagonist.birthDay = 0;
    // 初始朋友
    Game.characters.protagonist.social.friends.push('阿強', '阿May');
    Game.characters.protagonist.social.popularity = 35;

    document.querySelectorAll('.btn[data-speed]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.btn[data-speed]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        Game.speed = parseInt(btn.dataset.speed);
        Game.paused = Game.speed === 0;
      };
    });

    renderCharList();
    renderSprites();
    renderScene();
    renderPersonality();
    renderLoveDisplay();
    renderSocialDisplay();
    renderStatus();
    renderDateTime();
    setInterval(tick, 100);

    const c = Game.characters.protagonist;
    addThought('protagonist', '🌟', `${c.name}，${c.age} 歲，少年人生開始`, true);
    addThought('protagonist', '🎭', `優點：${c.personality.good.map(id => GOOD_TRAITS.find(g=>g.id===id)?.name).filter(Boolean).join('、')} · 缺點：${c.personality.bad.map(id => BAD_TRAITS.find(b=>b.id===id)?.name).filter(Boolean).join('、')}`, false);
    addMutter('protagonist', '今日會發生咩事呢？期待！');
  } catch (e) {
    console.error('Init error:', e);
    alert('初始化錯誤：' + e.message);
  }
}

init();
