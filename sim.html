<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人生屋企 · 真實生活版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: #0f0f1e; color: #eee; user-select: none;
  }
  #app {
    width: 100vw; height: 100vh;
    display: grid;
    grid-template-rows: 38px 1fr 78px;
    grid-template-columns: 210px 1fr 320px;
    grid-template-areas: "top top top" "left center right" "bottom bottom bottom";
    gap: 4px; padding: 4px;
  }
  .panel {
    background: rgba(20, 20, 40, 0.88);
    border: 1px solid #3a3a5e;
    border-radius: 6px;
    padding: 6px;
    overflow: hidden;
    backdrop-filter: blur(6px);
  }
  #top {
    grid-area: top;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; font-size: 12px;
  }
  #top .left, #top .right { display: flex; gap: 6px; align-items: center; }
  #top .title { font-weight: 700; color: #ffd369; letter-spacing: 1px; font-size: 13px; }
  .btn {
    background: #2a2a4a; border: 1px solid #4a4a6a; color: #eee;
    padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;
  }
  .btn.active { background: #ffd369; color: #1a1a2e; font-weight: 700; }
  .btn:hover { background: #3a3a5a; }
  #left { grid-area: left; font-size: 11px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .char-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid #3a3a5e;
    border-radius: 6px;
    padding: 6px;
    cursor: pointer;
  }
  .char-card.selected { border-color: #ffd369; background: rgba(255,211,105,0.08); }
  .char-card .header { display: flex; align-items: center; gap: 6px; }
  .char-card .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .char-card .info { flex: 1; min-width: 0; }
  .char-card .name { font-weight: 700; font-size: 11px; color: #ffd369; }
  .char-card .sub { font-size: 9px; color: #aaa; }
  .char-card .state-line { font-size: 9px; color: #c084fc; margin-top: 2px; font-style: italic; }
  .section-title {
    font-size: 9px; color: #888; text-transform: uppercase;
    letter-spacing: 1px; margin: 4px 0 2px;
    border-bottom: 1px solid #3a3a5e; padding-bottom: 2px;
  }
  /* 中央場景 */
  #center {
    grid-area: center;
    position: relative;
    overflow: hidden;
    transition: background 2s;
  }
  #scene-bg {
    position: absolute; inset: 0;
    transition: all 2s;
  }
  #weather-overlay {
    position: absolute; inset: 0;
    pointer-events: none;
    transition: opacity 2s;
  }
  .rain-drop {
    position: absolute;
    width: 2px; height: 15px;
    background: linear-gradient(to bottom, transparent, rgba(150,200,255,0.6));
    animation: rain 0.8s linear infinite;
  }
  @keyframes rain {
    from { transform: translateY(-20px); }
    to { transform: translateY(100vh); }
  }
  #scene-info {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(0,0,0,0.6);
    padding: 4px 8px; border-radius: 4px;
    font-size: 10px; z-index: 5;
  }
  #scene-info .loc { color: #ffd369; font-weight: 700; }
  #scene-info .weather { color: #93c5fd; }
  #scene-info .sense { color: #fbbf24; font-style: italic; font-size: 9px; }
  #scene-visual {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    opacity: 0.3;
    pointer-events: none;
  }
  #location-map {
    position: absolute;
    bottom: 8px; left: 8px; right: 8px;
    display: flex; gap: 4px;
    flex-wrap: wrap;
    z-index: 5;
  }
  .loc-btn {
    background: rgba(0,0,0,0.5);
    border: 1px solid #4a4a6a;
    color: #eee;
    padding: 3px 6px;
    border-radius: 4px;
    font-size: 9px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .loc-btn:hover { background: rgba(255,211,105,0.2); border-color: #ffd369; }
  .loc-btn.current { background: #ffd369; color: #1a1a2e; font-weight: 700; }
  .loc-btn.unavailable { opacity: 0.3; cursor: not-allowed; }
  .char-sprite {
    position: absolute;
    width: 28px; height: 40px;
    transition: left 1.2s ease-in-out, bottom 1.2s ease-in-out;
    z-index: 10; pointer-events: none;
  }
  .char-sprite .body {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 20px; height: 24px; border-radius: 4px 4px 2px 2px;
  }
  .char-sprite .head {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    width: 14px; height: 14px; background: #f5d4a8; border-radius: 50%;
  }
  .char-sprite .action {
    position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%);
    font-size: 16px; animation: float 1.5s ease-in-out infinite;
    white-space: nowrap;
  }
  .char-sprite .name-tag {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    font-size: 9px; color: #fff;
    background: rgba(0,0,0,0.7); padding: 1px 5px; border-radius: 3px;
    white-space: nowrap;
  }
  @keyframes float {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -4px); }
  }
  /* NPC */
  .npc-sprite {
    position: absolute;
    width: 24px; height: 34px;
    z-index: 8; pointer-events: none;
    opacity: 0.85;
  }
  .npc-sprite .body {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 18px; height: 22px; border-radius: 4px;
  }
  .npc-sprite .head {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 12px; background: #f5d4a8; border-radius: 50%;
  }
  .npc-sprite .bubble {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.95); color: #333;
    padding: 3px 6px; border-radius: 8px;
    font-size: 9px; white-space: nowrap;
    animation: bubbleIn 0.3s ease-out;
  }
  @keyframes bubbleIn {
    from { opacity: 0; transform: translate(-50%, 5px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
  /* 右側思考日誌 */
  #right {
    grid-area: right; font-size: 11px;
    display: flex; flex-direction: column;
  }
  #right h3 {
    font-size: 11px; color: #ffd369; margin-bottom: 4px;
    border-bottom: 1px solid #3a3a5e; padding-bottom: 3px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #thought-log {
    flex: 1; overflow-y: auto;
    font-family: "Menlo", "Consolas", monospace;
    font-size: 10px; line-height: 1.4;
  }
  .thought {
    margin-bottom: 5px; padding: 4px 6px;
    background: rgba(255, 255, 255, 0.03);
    border-left: 2px solid #4a6fa5;
    border-radius: 2px;
    animation: slideIn 0.3s ease-out;
  }
  .thought.decision { border-left-color: #ffd369; }
  .thought.event { border-left-color: #ff6b6b; background: rgba(255, 107, 107, 0.08); }
  .thought.love { border-left-color: #ff69b4; background: rgba(255, 105, 180, 0.08); }
  .thought.sense { border-left-color: #60a5fa; background: rgba(96, 165, 250, 0.06); font-style: italic; }
  .thought.social { border-left-color: #fbbf24; background: rgba(251, 191, 36, 0.06); }
  .thought.mutter { border-left-color: #c084fc; background: rgba(192, 132, 252, 0.06); }
  .thought .time { color: #888; font-size: 8px; }
  .thought .tag {
    display: inline-block; padding: 0 3px;
    background: #2a2a4a; border-radius: 3px;
    font-size: 8px; margin-right: 2px; color: #aaa;
  }
  .thought .quote {
    margin-top: 3px; padding: 3px 5px;
    background: rgba(255, 211, 105, 0.1);
    border-radius: 3px; color: #ffd369;
    font-style: italic; font-size: 10px;
  }
  .thought .dialogue {
    margin-top: 3px; padding: 3px 5px;
    background: rgba(251, 191, 36, 0.1);
    border-radius: 3px; color: #fbbf24;
    font-size: 10px;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  /* 底部 */
  #bottom {
    grid-area: bottom;
    display: flex; gap: 5px; align-items: center;
    font-size: 10px;
  }
  .stat-box {
    flex: 1;
    background: rgba(255, 255, 255, 0.04);
    padding: 4px 6px; border-radius: 5px;
    border: 1px solid #3a3a5e;
    min-width: 0;
  }
  .stat-box .label { font-size: 8px; color: #888; text-transform: uppercase; }
  .stat-box .value { font-size: 12px; color: #ffd369; font-weight: 700; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-box .sub { font-size: 9px; color: #aaa; }
  /* 彈窗 */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(6px);
  }
  .modal.show { display: flex; }
  .modal-card {
    background: linear-gradient(135deg, #2a2a4a, #1a1a2e);
    border: 2px solid #ffd369;
    border-radius: 12px;
    padding: 16px;
    width: 94%; max-width: 560px;
    max-height: 88vh; overflow-y: auto;
  }
  .modal-card h2 { color: #ffd369; font-size: 15px; margin-bottom: 8px; }
  .modal-card .context {
    font-size: 11px; color: #ccc; margin-bottom: 10px;
    padding: 8px; background: rgba(0, 0, 0, 0.3); border-radius: 5px;
  }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .choice-btn {
    background: #2a2a4a; border: 1px solid #4a4a6a;
    color: #eee; padding: 8px; border-radius: 5px;
    cursor: pointer; font-size: 11px; text-align: left;
  }
  .choice-btn:hover { background: #3a3a5a; border-color: #ffd369; }
  .choice-btn .icon { font-size: 15px; display: block; margin-bottom: 3px; }
  .choice-btn .desc { font-size: 9px; color: #aaa; margin-top: 2px; }
  /* 儲存面板 */
  .save-slot {
    background: rgba(0,0,0,0.3);
    border: 1px solid #3a3a5e;
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .save-slot .info { flex: 1; font-size: 10px; }
  .save-slot .info b { color: #ffd369; }
  .save-slot .actions { display: flex; gap: 4px; }
  .save-slot .actions button {
    background: #2a2a4a; border: 1px solid #4a4a6a;
    color: #eee; padding: 4px 8px; border-radius: 4px;
    cursor: pointer; font-size: 10px;
  }
  .save-slot .actions button:hover { background: #ffd369; color: #1a1a2e; }
  .save-slot.empty { opacity: 0.5; }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: #4a4a6a; border-radius: 2px; }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate-hint {
      display: flex !important;
      position: fixed; inset: 0;
      background: #1a1a2e; z-index: 1000;
      align-items: center; justify-content: center;
      flex-direction: column; color: #ffd369;
    }
    #rotate-hint .icon { font-size: 50px; margin-bottom: 15px; animation: rotate 2s infinite; }
    @keyframes rotate { 50% { transform: rotate(90deg); } }
  }
  #rotate-hint { display: none; }
</style>
</head>
<body>
<div id="rotate-hint">
  <div class="icon">📱</div>
  <div>請將手機橫向</div>
</div>

<div id="app">
  <div id="top" class="panel">
    <div class="left">
      <span class="title">🌆 人生屋企 · 真實生活</span>
      <span id="date-display">2026/10/07</span>
      <span id="time-display" style="color:#ffd369">08:00</span>
      <span id="weather-display" style="color:#93c5fd">☀️</span>
    </div>
    <div class="right">
      <button class="btn" data-speed="0">⏸</button>
      <button class="btn active" data-speed="1">▶</button>
      <button class="btn" data-speed="3">▶▶</button>
      <button class="btn" data-speed="10">▶▶▶</button>
      <button class="btn" data-speed="30">⏩</button>
      <button class="btn" id="save-btn" title="儲存/載入">💾</button>
    </div>
  </div>

  <div id="left" class="panel">
    <div class="section-title">👥 人物</div>
    <div id="char-list"></div>
    <div class="section-title">📍 當前地點</div>
    <div id="location-info" style="font-size:10px;padding:4px;color:#ccc;"></div>
    <div class="section-title">👥 在場人物</div>
    <div id="nearby-npcs" style="font-size:10px;padding:4px;color:#ccc;"></div>
  </div>

  <div id="center">
    <div id="scene-bg"></div>
    <div id="weather-overlay"></div>
    <div id="scene-info">
      <div class="loc" id="scene-loc">🏠 屋企</div>
      <div class="weather" id="scene-weather">☀️ 晴天 · 26°C</div>
      <div class="sense" id="scene-sense">聞到咖啡香...</div>
    </div>
    <div id="scene-visual">🏠</div>
    <div id="location-map"></div>
  </div>

  <div id="right" class="panel">
    <h3>
      <span>💭 思考流</span>
      <span id="log-char-name" style="font-size:10px;color:#aaa"></span>
    </h3>
    <div id="thought-log"></div>
  </div>

  <div id="bottom" class="panel">
    <div class="stat-box">
      <div class="label">當前行動</div>
      <div class="value" id="today-action">—</div>
    </div>
    <div class="stat-box">
      <div class="label">人生進度</div>
      <div class="value" id="life-progress">20 / 40 歲</div>
    </div>
    <div class="stat-box">
      <div class="label">💰 財務</div>
      <div class="value" id="money">$15,000</div>
    </div>
    <div class="stat-box">
      <div class="label">📱 社交</div>
      <div class="value" id="social-count">0</div>
      <div class="sub">朋友</div>
    </div>
    <div class="stat-box">
      <div class="label">行動</div>
      <div class="value" id="action-count">0</div>
      <div class="sub">今日</div>
    </div>
  </div>
</div>

<!-- 事件彈窗 -->
<div id="event-modal" class="modal">
  <div class="modal-card">
    <h2><span id="event-icon">⚡</span> <span id="event-title">人生抉擇</span></h2>
    <div class="context" id="event-context"></div>
    <div class="choices" id="event-choices"></div>
  </div>
</div>

<!-- 儲存彈窗 -->
<div id="save-modal" class="modal">
  <div class="modal-card">
    <h2>💾 儲存 / 載入</h2>
    <div id="save-slots"></div>
    <div style="display:flex;gap:6px;margin-top:10px;">
      <button class="btn" id="export-btn">📤 匯出檔案</button>
      <button class="btn" id="import-btn">📥 匯入檔案</button>
      <input type="file" id="import-file" accept=".json" style="display:none">
      <button class="btn" onclick="document.getElementById('save-modal').classList.remove('show')">關閉</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ============================================================
// 《人生屋企》真實生活版
// 多地點 × NPC × 天氣感官 × 年輕人生活 × 儲存系統
// ============================================================

const Game = {
  day: 0, hour: 8, minute: 0,
  speed: 1, paused: false,
  decisionsCount: 0, acceptedCount: 0,
  selectedCharId: 'protagonist',
  characters: {},
  relationships: {},
  npcs: {}, // 場景中的 NPC
  tickCount: 0,
  actionCountToday: 0,
  // 天氣系統
  weather: { type: 'sunny', temp: 26, wind: 2 },
  // 地點系統
  currentLocation: 'home_bedroom',
  locationHistory: [],
};

// ============================================================
// 地點系統 — 15+ 真實地點
// ============================================================
const LOCATIONS = {
  // 屋企
  home_bedroom: {
    name: '睡房', icon: '🛏', type: 'home',
    visual: '🛏', bg: 'linear-gradient(to bottom, #4a3a5e 0%, #3a2a4e 100%)',
    sense: ['聞到枕頭嘅味道', '窗簾透出少少光', '整潔嘅房間'],
    available: () => true,
  },
  home_bathroom: {
    name: '浴室', icon: '🚿', type: 'home',
    visual: '🚿', bg: 'linear-gradient(to bottom, #6ba5d8 0%, #4a85b8 100%)',
    sense: ['水蒸氣', '洗頭水味', '鏡蒙咗'],
    available: () => true,
  },
  home_kitchen: {
    name: '廚房', icon: '🍳', type: 'home',
    visual: '🍳', bg: 'linear-gradient(to bottom, #d4a574 0%, #b48554 100%)',
    sense: ['煮食嘅香味', '雪櫃嗡嗡聲', '整潔嘅流理台'],
    available: () => true,
  },
  home_living: {
    name: '客廳', icon: '🛋', type: 'home',
    visual: '🛋', bg: 'linear-gradient(to bottom, #a89070 0%, #887050 100%)',
    sense: ['電視聲', '梳化好軟', '陽光灑入嚟'],
    available: () => true,
  },
  // 外出地點
  university: {
    name: '大學', icon: '🎓', type: 'outside',
    visual: '🎓', bg: 'linear-gradient(to bottom, #87ceeb 0%, #6ba5d8 60%, #8b7355 60%)',
    sense: ['學生嘈雜聲', '書本味', '青春氣息'],
    available: (c) => c.age < 23 || c.job?.type === 'academic',
    npcs: ['classmate', 'professor'],
  },
  cafe: {
    name: 'Cafe', icon: '☕', type: 'outside',
    visual: '☕', bg: 'linear-gradient(to bottom, #8b6f47 0%, #6b4f27 100%)',
    sense: ['咖啡香', '爵士音樂', '暖色燈光'],
    available: (c) => c.money > 30,
    npcs: ['barista', 'stranger'],
  },
  mall: {
    name: '商場', icon: '🏬', type: 'outside',
    visual: '🏬', bg: 'linear-gradient(to bottom, #e8e8e8 0%, #c8c8c8 100%)',
    sense: ['冷氣涼風', '人聲鼎沸', '商店音樂'],
    available: () => Game.hour >= 10 && Game.hour < 22,
    npcs: ['shopper', 'friend'],
  },
  park: {
    name: '公園', icon: '🌳', type: 'outside',
    visual: '🌳', bg: 'linear-gradient(to bottom, #87ceeb 0%, #87ceeb 50%, #6bcf7f 50%, #4aaf5f 100%)',
    sense: ['清新空氣', '鳥叫聲', '微風'],
    available: () => Game.hour >= 6 && Game.hour < 22 && Game.weather.type !== 'storm',
    npcs: ['jogger', 'elderly'],
  },
  gym: {
    name: 'Gym', icon: '🏋️', type: 'outside',
    visual: '🏋️', bg: 'linear-gradient(to bottom, #3a3a5e 0%, #2a2a4e 100%)',
    sense: ['汗水味', '重金屬音樂', '啞鈴撞擊聲'],
    available: (c) => c.money > 300 && Game.hour >= 6 && Game.hour < 23,
    npcs: ['trainer', 'gymbro'],
  },
  bar: {
    name: 'Bar', icon: '🍺', type: 'outside',
    visual: '🍺', bg: 'linear-gradient(to bottom, #2a1a3e 0%, #1a0a2e 100%)',
    sense: ['酒精味', '喧鬧音樂', '霓虹燈光'],
    available: (c) => c.age >= 18 && c.money > 100 && Game.hour >= 19,
    npcs: ['bartender', 'partygoer'],
  },
  restaurant: {
    name: '餐廳', icon: '🍽', type: 'outside',
    visual: '🍽', bg: 'linear-gradient(to bottom, #d4a574 0%, #b48554 100%)',
    sense: ['食物香氣', '刀叉聲', '談笑聲'],
    available: (c) => c.money > 80 && Game.hour >= 11 && Game.hour < 22,
    npcs: ['waiter', 'couple'],
  },
  cinema: {
    name: '戲院', icon: '🎬', type: 'outside',
    visual: '🎬', bg: 'linear-gradient(to bottom, #1a1a2e 0%, #0a0a1e 100%)',
    sense: ['爆谷味', '大銀幕光', '環迴音效'],
    available: (c) => c.money > 100 && Game.hour >= 10,
    npcs: ['friend'],
  },
  convenience: {
    name: '便利店', icon: '🏪', type: 'outside',
    visual: '🏪', bg: 'linear-gradient(to bottom, #ffd369 0%, #fbbf24 100%)',
    sense: ['叮一聲開門', '冷氣', '即食食品味'],
    available: () => true,
    npcs: ['cashier'],

  cool: { icon: '🍃', name: '涼爽', tempMod: -2, moodMod: 3, color: '#93c5fd' },
};

function generateWeather() {
  const types = ['sunny', 'sunny', 'cloudy', 'cloudy', 'rainy', 'hot', 'cool'];
  const type = types[Math.floor(Math.random() * types.length)];
  const baseTemp = 24 + Math.sin(Game.day / 30) * 5;
  const w = WEATHER_TYPES[type];
  Game.weather = {
    type,
    temp: Math.round(baseTemp + w.tempMod + (Math.random() * 4 - 2)),
    wind: Math.floor(Math.random() * 5),
  };
}

function isHome(loc) {
  return LOCATIONS[loc]?.type === 'home';
}

// ============================================================
const SENSE_BY_TIME = {
  morning: ['陽光透入','鳥叫聲','清晨涼風','街市聲'],
  afternoon: ['陽光猛烈','人聲','車聲','熱氣'],
  evening: ['夕陽','街燈亮','煮飯香','返家人潮'],
  night: ['寧靜','霓虹燈','蟲叫','涼風'],
  lateNight: ['寂靜','遠處車聲','孤單感'],
};

function getTimeSense() {
  const h = Game.hour;
  if (h < 7) return SENSE_BY_TIME.lateNight;
  if (h < 11) return SENSE_BY_TIME.morning;
  if (h < 17) return SENSE_BY_TIME.afternoon;
  if (h < 20) return SENSE_BY_TIME.evening;
  return SENSE_BY_TIME.night;
}

function getRandomSense(c) {
  const loc = LOCATIONS[Game.currentLocation];
  const pool = [...(loc?.sense || []), ...getTimeSense()];
  return pool[Math.floor(Math.random() * pool.length)];
}

// ============================================================
// AI 思考循環（地點感知版）
// ============================================================
function aiThink(c) {
  try {
    const candidates = [];
    const currentLoc = Game.currentLocation;

    for (const [key, act] of Object.entries(ACTIONS)) {
      if (!act.condition(c)) continue;

      // 地點檢查
      const actLoc = act.location;
      let travelNeeded = false;
      let travelCost = 0;
      if (actLoc !== currentLoc) {
        // 計算移動成本
        if (isHome(currentLoc) && !isHome(actLoc)) travelCost = 0.5; // 出門
        else if (!isHome(currentLoc) && isHome(actLoc)) travelCost = 0.5; // 返屋企
        else if (!isHome(currentLoc) && !isHome(actLoc)) travelCost = 0.3; // 地點間
        travelNeeded = true;
      }

      let score = 50;
      // 需求匹配
      for (const [nk, nv] of Object.entries(act.effects)) {
        if (nv > 0 && c.needs[nk] < 50) score += (50 - c.needs[nk]) * 0.8;
        if (nv < 0 && c.needs[nk] < 30) score -= 40;
      }

      // 地點便利性（當前地點的行動加分）
      if (!travelNeeded) score += 15;
      else score -= travelCost * 20;

      // 時間合適度
      const hour = Game.hour;
      if (key.includes('breakfast') && hour >= 7 && hour < 10) score += 20;
      if (key.includes('lunch') && hour >= 12 && hour < 14) score += 20;
      if ((key.includes('dinner') || key === 'cook' || key === 'eat_restaurant') && hour >= 18 && hour < 21) score += 20;
      if (key === 'sleep' && hour >= 22) score += 20;

      // 性格
      if (['meet_friends','drink_with_friends','karaoke','boardgame','campus_hangout'].includes(key))
        score += c.personality.extraversion * 2;
      if (['read','study_library','journal','learn_skill'].includes(key))
        score += c.personality.openness * 2;
      if (['play_game','online_game','watch_tv','scroll_tiktok'].includes(key))
        score += (10 - c.personality.conscientiousness);

      // 金錢
      if (act.cost && c.money < act.cost * 2) score -= 30;

      // 天氣影響
      if (Game.weather.type === 'rainy' || Game.weather.type === 'storm') {
        if (!isHome(actLoc) && actLoc !== 'mall' && actLoc !== 'cinema') score -= 15;
      }
      if (Game.weather.type === 'hot' && actLoc === 'park') score -= 10;

      // 隨機
      score += (Math.random() - 0.5) * 25;

      candidates.push({ key, act, score, travelNeeded });
    }

    if (candidates.length === 0) {
      c.currentAction = ACTIONS.idle;
      c.actionTimer = 0.2;
      return;
    }

    candidates.sort((a, b) => b.score - a.score);
    const chosen = candidates[0];

    // 如果需要移動，先移動
    if (chosen.travelNeeded) {
      Game.currentLocation = chosen.act.location;
      Game.locationHistory.push(chosen.act.location);
      if (c.id === Game.selectedCharId || c.isProtagonist) {
        const loc = LOCATIONS[chosen.act.location];
        addThought(c.id, '🚶', `去 ${loc.icon} ${loc.name}`, false);
        // 感官描述
        const sense = getRandomSense(c);
        addSense(c.id, sense);
      }
      c.actionTimer = 0.3; // 移動時間
      c.currentAction = null;
      return;
    }

    if (c.id === Game.selectedCharId || c.isProtagonist) {
      addThought(c.id, '決定', `${chosen.act.icon} ${chosen.act.name} (${Math.round(chosen.score)})`, true);
      // 感官
      if (chosen.act.sense && Math.random() < 0.5) {
        const s = chosen.act.sense[Math.floor(Math.random() * chosen.act.sense.length)];
        addSense(c.id, s);
      }
      // 自言自語
      if (Math.random() < 0.35) {
        const m = chosen.act.mutter ? chosen.act.mutter[Math.floor(Math.random() * chosen.act.mutter.length)] : '...';
        addMutter(c.id, m);
      }
    }

    c.currentAction = chosen.act;
    c.actionTimer = chosen.act.duration;
    c.todayActions.push(chosen.key);
    Game.actionCountToday++;

    // 觸發 NPC 互動
    if (Math.random() < 0.2) triggerNPCInteraction(c);
  } catch (e) {
    console.error('aiThink error:', e);
    c.currentAction = ACTIONS.idle;
    c.actionTimer = 0.2;
  }
}

// ============================================================
// NPC 互動系統
// ============================================================
function triggerNPCInteraction(c) {
  try {
    const loc = LOCATIONS[Game.currentLocation];
    if (!loc || !loc.npcs) return;

    const npcType = loc.npcs[Math.floor(Math.random() * loc.npcs.length)];
    const template = NPC_TEMPLATES[npcType];
    if (!template) return;

    const line = template.lines[Math.floor(Math.random() * template.lines.length)];

    // 顯示 NPC
    showNPC(template, line);

    // 記錄互動
    if (c.id === Game.selectedCharId || c.isProtagonist) {
      addDialogue(c.id, template.name, line);
      // 社交需求小幅滿足
      c.needs.social = Math.min(100, c.needs.social + 3);
    }

    // 朋友 NPC 有特殊效果
    if (npcType === 'friend' && c.friends.length === 0) {
      c.friends.push('朋友_' + Date.now());
      if (c.id === Game.selectedCharId || c.isProtagonist) {
        addThought(c.id, '👥', `認識咗新朋友！`, false, false);
      }
    }
  } catch (e) { console.error(e); }
}

let currentNPCEl = null;
function showNPC(template, line) {
  try {
    // 移除舊 NPC
    if (currentNPCEl) {
      currentNPCEl.remove();
      currentNPCEl = null;
    }
    const center = document.getElementById('center');
    if (!center) return;
    const el = document.createElement('div');
    el.className = 'npc-sprite';
    el.style.left = (100 + Math.random() * 200) + 'px';
    el.style.bottom = (80 + Math.random() * 60) + 'px';
    el.innerHTML = `
      <div class="bubble">${line}</div>
      <div class="head"></div>
      <div class="body" style="background:#6a7a8a"></div>
    `;
    center.appendChild(el);
    currentNPCEl = el;
    // 5 秒後消失
    setTimeout(() => {
      if (currentNPCEl === el) {
        el.remove();
        currentNPCEl = null;
      }
    }, 5000);
  } catch (e) { console.error(e); }
}

  try {
    const loc = LOCATIONS[Game.currentLocation];
    if (!loc) return;

    const sceneVisual = document.getElementById('scene-visual');
    const sceneLoc = document.getElementById('scene-loc');
    const sceneWeather = document.getElementById('scene-weather');
    const sceneSense = document.getElementById('scene-sense');

    // 背景（屋企用固定色，外出用天氣色）
    if (isHome(Game.currentLocation)) {
      sceneBg.style.background = loc.bg;
    } else {
      const w = WEATHER_TYPES[Game.weather.type];
      sceneBg.style.background = `linear-gradient(to bottom, ${w.color} 0%, ${w.color} 55%, #8b7355 55%, #6b5345 100%)`;
    }
    if (sceneVisual) sceneVisual.textContent = loc.visual;

      const w = WEATHER_TYPES[Game.weather.type];

function executeAction(c, deltaHours) {
  try {
    const act = c.currentAction;
    if (!act) return;
    const ratio = deltaHours / Math.max(act.duration, 0.1);
    for (const [k, v] of Object.entries(act.effects)) {
      if (c.needs[k] !== undefined) c.needs[k] = Math.max(0, Math.min(100, c.needs[k] + v * ratio));
    }
    if (act.cost) c.money -= act.cost * ratio;
    if (act.income) c.money += act.income * ratio;
    if (act.healthBonus) {
      for (const [k, v] of Object.entries(act.healthBonus)) c.health[k] = Math.min(100, c.health[k] + v * ratio);
    }
    c.actionTimer -= deltaHours;
    if (c.actionTimer <= 0) {
      if (c.id === Game.selectedCharId || c.isProtagonist) {
        const el = document.getElementById('today-action');
        if (el) el.textContent = act.icon + ' ' + act.name;
      }
      c.currentAction = null;
    }
  } catch (e) {
    console.error(e);
    c.currentAction = null;
  }
}

// ============================================================
// 主 tick
// ============================================================
function tick() {
  try {
    if (Game.paused || Game.speed === 0) return;
    const baseDelta = 0.05 * Game.speed;
    Game.hour += baseDelta;
    Game.minute = Math.floor((Game.hour % 1) * 60);

    if (Game.hour >= 24) {
      Game.hour -= 24;
      Game.day++;
      Game.actionCountToday = 0;
      generateWeather();
      Object.values(Game.characters).forEach(c => {
        c.age = Math.floor((Game.day - c.birthDay) / 365);
        c.todayActions = [];
      });
      dailySettlement();
      // 自動存檔
      autoSave();
    }

    Object.values(Game.characters).forEach(c => {
      try {
        if (c.currentAction) executeAction(c, baseDelta);
        else aiThink(c);
        NEEDS_DEF.forEach(n => {
          c.needs[n.key] = Math.max(0, c.needs[n.key] - n.decay * baseDelta / 24);
        });
        // 天氣影響心情
        const w = WEATHER_TYPES[Game.weather.type];
        c.mood.happy += w.moodMod * 0.001 * baseDelta;
        const avgNeed = Object.values(c.needs).reduce((a,b)=>a+b,0) / Object.keys(c.needs).length;
        c.mood.happy += (avgNeed - 50) * 0.02 * baseDelta;
        c.mood.happy = Math.max(-100, Math.min(100, c.mood.happy));
      } catch (e) { console.error(e); }
    });

    Game.tickCount++;
    if (Game.tickCount % 2 === 0) {
      renderCharList();
      renderSprites();
      renderScene();
      renderStatus();
      renderDateTime();
    }
  } catch (e) {
    console.error('TICK ERROR:', e);
  }
}

function dailySettlement() {
  try {
    Object.values(Game.characters).forEach(c => {
      c.money -= 100;
      if (c.job && Game.day % 30 === 0) c.money += 18000;
    });
    if (Game.characters.protagonist.age >= 40) {
      Game.paused = true;
      alert(`🎬 40 歲人生總結\n\n職業：${Game.characters.protagonist.job ? Game.characters.protagonist.job.title : '無業'}\n財務：$${Math.round(Game.characters.protagonist.money).toLocaleString()}\n關係：${Game.characters.protagonist.relationship}\n朋友：${Game.characters.protagonist.friends.length}`);
    }
  } catch (e) { console.error(e); }
}

function renderStatus() {
  try {
    const p = Game.characters.protagonist;
    const el1 = document.getElementById('money');
    if (el1) el1.textContent = '$' + Math.round(p.money).toLocaleString();
    const el2 = document.getElementById('life-progress');
    if (el2) el2.textContent = `${p.age} / 40 歲`;
    const el3 = document.getElementById('action-count');
    if (el3) el3.textContent = Game.actionCountToday;
    const el4 = document.getElementById('social-count');
    if (el4) el4.textContent = p.friends.length;
  } catch (e) { console.error(e); }
}

function renderDateTime() {
  try {
    const year = 2026 + Math.floor(Game.day / 365);
    const dayOfYear = Game.day % 365;
    const month = Math.floor(dayOfYear / 30) + 1;
    const day = (dayOfYear % 30) + 1;
    const el1 = document.getElementById('date-display');
    if (el1) el1.textContent = `${year}/${String(month).padStart(2,'0')}/${String(day).padStart(2,'0')}`;
    const el2 = document.getElementById('time-display');
    if (el2) el2.textContent = `${String(Game.hour).padStart(2,'0')}:${String(Game.minute).padStart(2,'0')}`;
    const el3 = document.getElementById('weather-display');
    if (el3) el3.textContent = WEATHER_TYPES[Game.weather.type].icon;
  } catch (e) { console.error(e); }
}

// ============================================================
// 儲存系統
// ============================================================
const SAVE_KEY = 'life_at_home_saves';
const AUTO_SAVE_KEY = 'life_at_home_autosave';

function getSaveData() {
  return {
    version: 2,
    timestamp: Date.now(),
    dateStr: new Date().toLocaleString('zh-HK'),
    game: {
      day: Game.day,
      hour: Game.hour,
      minute: Game.minute,
      speed: Game.speed,
      decisionsCount: Game.decisionsCount,
      acceptedCount: Game.acceptedCount,
      actionCountToday: Game.actionCountToday,
      currentLocation: Game.currentLocation,
      weather: Game.weather,
    },
    characters: Game.characters,
    relationships: Game.relationships,
  };
}

function loadSaveData(data) {
  try {
    if (!data || !data.game) throw new Error('Invalid save data');
    Game.day = data.game.day;
    Game.hour = data.game.hour;
    Game.minute = data.game.minute;
    Game.speed = data.game.speed || 1;
    Game.decisionsCount = data.game.decisionsCount;
    Game.acceptedCount = data.game.acceptedCount;
    Game.actionCountToday = data.game.actionCountToday;
    Game.currentLocation = data.game.currentLocation || 'home_bedroom';
    Game.weather = data.game.weather || { type: 'sunny', temp: 26, wind: 2 };
    Game.characters = data.characters || {};
    Game.relationships = data.relationships || {};
    // 清理 spriteEl（DOM 引用不能序列化）
    Object.values(Game.characters).forEach(c => { c.spriteEl = null; });
    return true;
  } catch (e) {
    console.error('Load error:', e);
    return false;
  }
}

function getAllSaves() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

function saveToSlot(slot) {
  try {
    const saves = getAllSaves();
    saves[slot] = getSaveData();
    localStorage.setItem(SAVE_KEY, JSON.stringify(saves));
    return true;
  } catch (e) {
    console.error('Save error:', e);
    alert('儲存失敗：' + e.message);
    return false;
  }
}

function loadFromSlot(slot) {
  try {
    const saves = getAllSaves();
    if (!saves[slot]) {
      alert('此儲存格是空的');
      return false;
    }
    if (loadSaveData(saves[slot])) {
      alert('載入成功！');
      // 重新渲染
      renderCharList();
      renderScene();
      renderStatus();
      renderDateTime();
      return true;
    }
    return false;
  } catch (e) {
    console.error('Load error:', e);
    alert('載入失敗：' + e.message);
    return false;
  }
}

function deleteSlot(slot) {
  try {
    const saves = getAllSaves();
    delete saves[slot];
    localStorage.setItem(SAVE_KEY, JSON.stringify(saves));
    return true;
  } catch (e) { return false; }
}

function autoSave() {
  try {
    localStorage.setItem(AUTO_SAVE_KEY, JSON.stringify(getSaveData()));
  } catch (e) { console.error('Auto-save error:', e); }
}

function loadAutoSave() {
  try {
    const raw = localStorage.getItem(AUTO_SAVE_KEY);
    if (!raw) return false;
    return loadSaveData(JSON.parse(raw));
  } catch (e) { return false; }
}

function exportSave() {
  try {
    const data = getSaveData();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `life_save_${Game.day}day.json`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('匯出失敗：' + e.message);
  }
}

function importSave(file) {
  try {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (loadSaveData(data)) {
          alert('匯入成功！');
          renderCharList();
          renderScene();
          renderStatus();
          renderDateTime();
        }
      } catch (err) {
        alert('檔案格式錯誤');
      }
    };
    reader.readAsText(file);
  } catch (e) {
    alert('匯入失敗：' + e.message);
  }
}

function renderSaveSlots() {
  try {
    const container = document.getElementById('save-slots');
    if (!container) return;
    container.innerHTML = '';
    const saves = getAllSaves();
    for (let i = 1; i <= 5; i++) {
      const slot = document.createElement('div');
      slot.className = 'save-slot';
      const save = saves[i];
      if (save) {
        const p = save.characters?.protagonist;
        slot.innerHTML = `
          <div class="info">
            <b>儲存格 ${i}</b><br>
            ${p?.name || '?'} · ${p?.age || '?'}歲<br>
            第 ${save.game?.day || 0} 日 · 💰$${Math.round(p?.money || 0).toLocaleString()}<br>
            <span style="color:#888;font-size:9px">${save.dateStr || ''}</span>
          </div>
          <div class="actions">
            <button onclick="loadFromSlot(${i})">📥 載入</button>
            <button onclick="saveToSlot(${i});renderSaveSlots()">💾 覆蓋</button>
            <button onclick="if(confirm('確定刪除？')){deleteSlot(${i});renderSaveSlots()}">🗑</button>
          </div>
        `;
      } else {
        slot.classList.add('empty');
        slot.innerHTML = `
          <div class="info"><b>儲存格 ${i}</b><br><span style="color:#888">（空）</span></div>
          <div class="actions">
            <button onclick="saveToSlot(${i});renderSaveSlots()">💾 儲存</button>
          </div>
        `;
      }
      container.appendChild(slot);
    }
  } catch (e) { console.error(e); }
}

// ============================================================
// 初始化
// ============================================================
function init() {
  try {
    // 嘗試載入自動存檔
    const hasAutoSave = loadAutoSave();
    if (!hasAutoSave) {
      Game.characters.protagonist.birthDay = 0;
      generateWeather();
    }

    // 速度按鈕
    document.querySelectorAll('.btn[data-speed]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.btn[data-speed]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        Game.speed = parseInt(btn.dataset.speed);
        Game.paused = Game.speed === 0;
      };
    });

    // 儲存按鈕
    document.getElementById('save-btn').onclick = () => {
      renderSaveSlots();
      document.getElementById('save-modal').classList.add('show');
    };
    document.getElementById('export-btn').onclick = exportSave;
    document.getElementById('import-btn').onclick = () => {
      document.getElementById('import-file').click();
    };
    document.getElementById('import-file').onchange = (e) => {
      if (e.target.files[0]) importSave(e.target.files[0]);
    };

    renderCharList();
    renderScene();
    renderStatus();
    renderDateTime();
    setInterval(tick, 100);

    const c = Game.characters.protagonist;
    addThought('protagonist', '🌟', `${c.name}，${c.age} 歲，人生繼續`, true);
    if (hasAutoSave) {
      addThought('protagonist', '💾', '自動存檔已載入', false);
    }
    addThought('protagonist', '🌍', '15+ 地點 · NPC 互動 · 天氣感官 · 儲存系統', false);
    addMutter('protagonist', '今日去邊好呢？');
  } catch (e) {
    console.error('Init error:', e);
    alert('初始化錯誤：' + e.message);
  }
}

init();
</script>
