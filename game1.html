<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Rush - 離線街機賽車</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
  }

  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  canvas {
    background: #000;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.16) 3px,
      rgba(0,0,0,0.16) 4px
    );
    mix-blend-mode: multiply;
  }

  .controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(12px + env(safe-area-inset-bottom));
    display: none;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 30;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .cluster {
    display: flex;
    gap: 14px;
    pointer-events: auto;
  }

  .btn {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    background: rgba(255,255,255,0.13);
    border: 2px solid rgba(255,255,255,0.35);
    color: #fff;
    font: 700 26px/1 monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: pointer;
  }

  .btn:active {
    background: rgba(255,255,255,0.32);
  }

  #menuOverlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(4, 2, 10, 0.72);
    color: #fff;
    font-family: monospace, sans-serif;
    text-align: center;
    padding: 20px;
    overflow: auto;
  }

  .hidden {
    display: none !important;
  }

  .title {
    font-size: 34px;
    font-weight: bold;
    color: #ff4f7d;
    text-shadow: 3px 3px #000;
    letter-spacing: 2px;
  }

  .subtitle {
    color: #ffd23f;
    font-size: 14px;
  }

  .diffRow {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .arrowBtn {
    width: 48px;
    height: 48px;
    font-size: 22px;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.35);
    color: #fff;
    border-radius: 12px;
    cursor: pointer;
  }

  .arrowBtn:active {
    background: rgba(255,255,255,0.3);
  }

  #diffName {
    min-width: 130px;
    font-size: 24px;
    font-weight: bold;
    padding: 8px 12px;
    border: 2px solid rgba(255,255,255,0.25);
    background: rgba(0,0,0,0.35);
    border-radius: 10px;
  }

  #diffDesc {
    font-size: 12px;
    color: #9fe8ff;
  }

  .bars {
    width: min(320px, 80vw);
    display: grid;
    gap: 8px;
  }

  .barRow {
    display: grid;
    grid-template-columns: 48px 1fr;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #fff;
  }

  .bar {
    height: 12px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
  }

  .barFill {
    height: 100%;
    width: 50%;
    background: #ffd23f;
  }

  #startBtn {
    margin-top: 10px;
    padding: 12px 26px;
    font-size: 18px;
    font-weight: bold;
    background: #ff4f7d;
    color: #fff;
    border: 3px solid #fff;
    border-radius: 12px;
    box-shadow: 0 4px 0 #7c1e3b;
    cursor: pointer;
  }

  #startBtn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #7c1e3b;
  }

  .hint {
    font-size: 11px;
    color: rgba(255,255,255,0.72);
  }

  #menuHi {
    color: #ffd23f;
    font-size: 12px;
    margin-top: 4px;
  }

  @media (hover: hover) and (pointer: fine) {
    .controls {
      opacity: 0.22;
    }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="270"></canvas>
</div>

<div class="scanlines"></div>

<div id="menuOverlay">
  <div class="title">PIXEL RUSH</div>
  <div class="subtitle">復刻街機・像素賽車・完全離線</div>

  <div class="diffRow">
    <button type="button" class="arrowBtn" id="diffPrev">◀</button>
    <div id="diffName">標準</div>
    <button type="button" class="arrowBtn" id="diffNext">▶</button>
  </div>

  <div id="diffDesc">平衡街機</div>

  <div class="bars">
    <div class="barRow">
      <span>速度</span>
      <div class="bar"><div class="barFill" id="speedBar"></div></div>
    </div>
    <div class="barRow">
      <span>障礙</span>
      <div class="bar"><div class="barFill" id="obsBar"></div></div>
    </div>
  </div>

  <button type="button" id="startBtn">開始遊戲</button>

  <div class="hint">鍵盤：← / → 選擇難度，Space / Enter 開始</div>
  <div class="hint">手機：點按鈕選擇難度，然後點「開始遊戲」</div>

  <div id="menuHi">HI-SCORE 0</div>
</div>

<div class="controls">
  <div class="cluster">
    <div class="btn" id="btnLeft">◀</div>
    <div class="btn" id="btnRight">▶</div>
  </div>
  <div class="cluster">
    <div class="btn" id="btnBrake">▼</div>
  </div>
</div>

<script>
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = canvas.width;
const H = canvas.height;

function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

/* ============================
   難度設定
============================ */
const DIFFICULTIES = [
  {
    name: '輕鬆',
    desc: '低速・障礙較少',
    color: '#7dff9f',
    baseSpeed: 9500,
    accel: 4200,
    obstacleMul: 0.55,
    trafficMax: 5,
    trafficTimerBase: 2.2,
    trafficTimerMin: 1.5
  },
  {
    name: '標準',
    desc: '平衡街機節奏',
    color: '#ffd23f',
    baseSpeed: 12000,
    accel: 5200,
    obstacleMul: 1.0,
    trafficMax: 8,
    trafficTimerBase: 1.7,
    trafficTimerMin: 1.0
  },
  {
    name: '困難',
    desc: '高速・障礙明顯增加',
    color: '#ff9d5c',
    baseSpeed: 15000,
    accel: 6400,
    obstacleMul: 1.6,
    trafficMax: 11,
    trafficTimerBase: 1.25,
    trafficTimerMin: 0.7
  },
  {
    name: '地獄',
    desc: '極速・密集障礙',
    color: '#ff5f5f',
    baseSpeed: 18500,
    accel: 7600,
    obstacleMul: 2.3,
    trafficMax: 14,
    trafficTimerBase: 0.9,
    trafficTimerMin: 0.45
  }
];

let difficultyIndex = 1;
let diff = DIFFICULTIES[difficultyIndex];
let currentBaseSpeed = diff.baseSpeed;
let currentAccel = diff.accel;

/* ============================
   基本常數
============================ */
const SEGMENT_LENGTH = 200;
const ROAD_WIDTH = 2000;
const CAMERA_HEIGHT = 1000;
const DRAW_DISTANCE = 100;
const FOV = 100;
const CAMERA_DEPTH = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const PLAYER_Z = CAMERA_HEIGHT * CAMERA_DEPTH;

const BRAKE_FORCE = -15000;
const OFFROAD_DECEL = -9000;

const STATE = {
  MENU: 0,
  COUNTDOWN: 1,
  PLAYING: 2,
  GAMEOVER: 3
};

let state = STATE.MENU;

/* ============================
   DOM 元素
============================ */
const menuOverlay = document.getElementById('menuOverlay');
const diffPrevBtn = document.getElementById('diffPrev');
const diffNextBtn = document.getElementById('diffNext');
const diffNameEl = document.getElementById('diffName');
const diffDescEl = document.getElementById('diffDesc');
const speedBarEl = document.getElementById('speedBar');
const obsBarEl = document.getElementById('obsBar');
const startBtn = document.getElementById('startBtn');
const menuHiEl = document.getElementById('menuHi');
const controlsEl = document.querySelector('.controls');

/* ============================
   遊戲狀態
============================ */
let time = 0;
let lastTime = 0;

let position = 0;
let speed = 0;
let playerX = 0;

let lives = 3;
let score = 0;
let coins = 0;
let hiScore = 0;

let combo = 0;
let comboTimer = 0;

let invincible = 0;
let shake = 0;
let coinFlash = 0;
let goFlash = 0;

let countdown = 3.0;
let lastCountdown = 4;
let gameOverTime = 0;

let trafficTimer = 1.0;
let currentCameraY = CAMERA_HEIGHT;

const segments = new Map();
const traffic = [];
const particles = [];

const input = {
  left: false,
  right: false,
  brake: false
};

/* ============================
   工具函數
============================ */
function clamp(v, a, b) {
  return v < a ? a : (v > b ? b : v);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function srand(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
  return x - Math.floor(x);
}

function formatInt(n) {
  return String(Math.floor(n));
}

/* ============================
   離線存档
============================ */
function loadHiScore() {
  try {
    hiScore = parseInt(localStorage.getItem('pixel_rush_hi') || '0', 10) || 0;
  } catch (e) {
    hiScore = 0;
  }
}

function saveHiScore() {
  try {
    const s = Math.floor(score);
    if (s > hiScore) hiScore = s;
    localStorage.setItem('pixel_rush_hi', String(hiScore));
  } catch (e) {
    // 離線檔案或部分瀏覽器可能限制 localStorage，唔影響遊戲
  }
}

/* ============================
   音效
============================ */
let audioCtx = null;

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return;
  }

  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  } catch (e) {
    audioCtx = null;
  }
}

function beep(freq, dur, type, vol, slide) {
  if (!audioCtx || audioCtx.state !== 'running') return;

  try {
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t);

    if (slide) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, slide), t + dur);
    }

    gain.gain.setValueAtTime(vol || 0.04, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(t);
    osc.stop(t + dur + 0.03);
  } catch (e) {
    // 音訊錯誤唔影響遊戲
  }
}

function sfxCoin() {
  beep(740 + Math.min(combo, 10) * 55, 0.07, 'square', 0.045, 1550);
}

function sfxCrash() {
  beep(150, 0.30, 'sawtooth', 0.09, 35);
}

function sfxCount() {
  beep(420, 0.09, 'square', 0.05);
}

function sfxGo() {
  beep(840, 0.24, 'square', 0.06, 1680);
}

/* ============================
   難度 UI
============================ */
function updateDifficultyUI() {
  diffNameEl.textContent = diff.name;
  diffNameEl.style.color = diff.color;
  diffDescEl.textContent = diff.desc;

  speedBarEl.style.width = (30 + difficultyIndex * 23) + '%';
  speedBarEl.style.background = diff.color;

  obsBarEl.style.width = (25 + difficultyIndex * 25) + '%';
  obsBarEl.style.background = diff.color;

  menuHiEl.textContent = 'HI-SCORE ' + hiScore;
}

function setDifficulty(i) {
  difficultyIndex = (i + DIFFICULTIES.length) % DIFFICULTIES.length;
  diff = DIFFICULTIES[difficultyIndex];

  currentBaseSpeed = diff.baseSpeed;
  currentAccel = diff.accel;

  updateDifficultyUI();

  // 如果仲喺選單，重設背景演示路段，令新難度即時生效
  if (state === STATE.MENU) {
    segments.clear();
    traffic.length = 0;
    particles.length = 0;
    position = 0;
    speed = 0;
    playerX = 0;
  }
}

function showMenuOverlay() {
  menuOverlay.classList.remove('hidden');
  controlsEl.style.display = 'none';
  menuHiEl.textContent = 'HI-SCORE ' + hiScore;
}

function hideMenuOverlay() {
  menuOverlay.classList.add('hidden');
  controlsEl.style.display = 'flex';
}

/* ============================
   道路生成
============================ */
function roadY(i) {
  return (
    Math.sin(i * 0.011) * 700 +
    Math.sin(i * 0.0041) * 1100 +
    Math.sin(i * 0.00073) * 1400
  );
}

function roadCurve(i) {
  return (
    Math.sin(i * 0.005) * 1.6 +
    Math.sin(i * 0.0017) * 2.0 +
    Math.sin(i * 0.00037) * 1.2
  );
}

function createSprites(i) {
  const sprites = [];

  if (i < 25) return sprites;

  const r1 = srand(i);
  const r2 = srand(i * 3 + 7);

  // 路邊裝飾
  if (i % 3 === 0) {
    sprites.push({
      type: r2 > 0.55 ? 'tree' : 'lamp',
      offset: (r1 > 0.5 ? 1 : -1) * (1.35 + r2 * 0.75),
      decor: true,
      w: 430,
      h: 860
    });
  }

  const block = Math.floor(i / 26);
  const phase = i % 26;

  // 金幣路段
  if (block % 2 === 0) {
    if (phase < 16 && srand(i * 11 + 3) > 0.22) {
      const offset = Math.sin(i * 0.22 + block * 2.1) * 0.68;
      const big = srand(i * 17 + 9) > 0.95;

      sprites.push({
        type: big ? 'bigcoin' : 'coin',
        offset: offset,
        collected: false,
        w: big ? 230 : 150,
        h: big ? 230 : 150
      });
    }
  } else {
    // 障礙路段：難度越高，障礙越多
    if (i > 70) {
      const rawChance = 0.045 + Math.min(0.045, i * 0.000005);
      const chance = Math.min(0.12, rawChance * diff.obstacleMul);

      if (srand(i * 31 + 7) < chance) {
        const lanes = [-0.62, -0.20, 0.20, 0.62];
        const lane = lanes[Math.floor(srand(i * 13 + 5) * lanes.length)];
        const t = srand(i * 19 + 11);

        let type = 'cone';
        if (t < 0.34) type = 'cone';
        else if (t < 0.68) type = 'barrier';
        else type = 'car';

        const w = type === 'car' ? 620 : (type === 'barrier' ? 520 : 230);
        const h = type === 'car' ? 350 : (type === 'barrier' ? 210 : 210);

        sprites.push({
          type: type,
          offset: lane + (srand(i * 23 + 1) - 0.5) * 0.10,
          hit: false,
          w: w,
          h: h
        });
      }
    }
  }

  return sprites;
}

function getSegment(i) {
  let seg = segments.get(i);
  if (seg) return seg;

  seg = {
    index: i,
    curve: roadCurve(i),
    clip: 0,
    camX1: 0,
    camX2: 0,
    p1: {
      world: { x: 0, y: roadY(i), z: i * SEGMENT_LENGTH },
      camera: {},
      screen: {}
    },
    p2: {
      world: { x: 0, y: roadY(i + 1), z: (i + 1) * SEGMENT_LENGTH },
      camera: {},
      screen: {}
    },
    sprites: createSprites(i)
  };

  segments.set(i, seg);
  return seg;
}

function cleanupSegments(baseIndex) {
  if (segments.size < DRAW_DISTANCE + 35) return;

  for (const key of segments.keys()) {
    if (key < baseIndex - 12) {
      segments.delete(key);
    }
  }
}

/* ============================
   投影
============================ */
function project(p, cameraX, cameraY, cameraZ) {
  p.camera.x = p.world.x - cameraX;
  p.camera.y = p.world.y - cameraY;
  p.camera.z = p.world.z - cameraZ;

  if (p.camera.z <= 0) {
    p.screen.scale = 0;
    p.screen.x = 0;
    p.screen.y = 0;
    p.screen.w = 0;
    return;
  }

  p.screen.scale = CAMERA_DEPTH / p.camera.z;
  p.screen.x = W / 2 + p.screen.scale * p.camera.x * W / 2;
  p.screen.y = H / 2 - p.screen.scale * p.camera.y * H / 2;
  p.screen.w = p.screen.scale * ROAD_WIDTH * W / 2;
}

/* ============================
   NPC 車
============================ */
function spawnTraffic() {
  if (traffic.length >= diff.trafficMax) return;

  const z = position + PLAYER_Z + DRAW_DISTANCE * SEGMENT_LENGTH * (0.35 + Math.random() * 0.55);
  const lanes = [-0.62, -0.20, 0.20, 0.62];
  const offset = lanes[Math.floor(Math.random() * lanes.length)];

  traffic.push({
    z: z,
    offset: offset,
    speed: Math.max(2200, currentBaseSpeed * (0.16 + Math.random() * 0.28)),
    color: ['#4aa3ff', '#ffd23f', '#63ffb2', '#ff6b6b', '#c17bff'][Math.floor(Math.random() * 5)],
    w: 640,
    h: 380
  });
}

/* ============================
   粒子
============================ */
function addParticle(text, x, y, color) {
  particles.push({
    text: text,
    x: x,
    y: y,
    life: 1.0,
    vy: -26,
    color: color || '#fff'
  });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt * 1.35;
    p.y += p.vy * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ============================
   遊戲流程
============================ */
function resetAttract() {
  position = 0;
  speed = 0;
  playerX = 0;

  traffic.length = 0;
  particles.length = 0;
  segments.clear();

  shake = 0;
  invincible = 0;
}

function resetGame() {
  position = 0;
  speed = 0;
  playerX = 0;

  lives = 3;
  score = 0;
  coins = 0;

  combo = 0;
  comboTimer = 0;

  invincible = 1.0;
  shake = 0;
  coinFlash = 0;
  goFlash = 0;

  countdown = 3.0;
  lastCountdown = 4;
  gameOverTime = 0;

  trafficTimer = diff.trafficTimerBase;

  traffic.length = 0;
  particles.length = 0;
  segments.clear();
}

function startGame() {
  initAudio();

  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }

  hideMenuOverlay();
  resetGame();
  state = STATE.COUNTDOWN;
}

function backToMenu() {
  state = STATE.MENU;
  input.left = false;
  input.right = false;
  input.brake = false;

  resetAttract();
  showMenuOverlay();
}

/* ============================
   碰撞 / 收集
============================ */
function collectCoin(s) {
  s.collected = true;
  combo++;
  comboTimer = 2.2;

  const basePoint = s.type === 'bigcoin' ? 250 : 50;
  const gain = basePoint * Math.min(combo, 10);

  coins++;
  score += gain;
  coinFlash = 0.14;

  sfxCoin();
  addParticle('+' + gain, W / 2 + playerX * 80, H - 62, s.type === 'bigcoin' ? '#ffe27a' : '#ffd23f');
}

function crash() {
  if (invincible > 0) return;

  lives--;
  invincible = 2.5;
  speed *= 0.25;
  shake = 0.65;

  sfxCrash();
  addParticle('CRASH!', W / 2, H / 2 - 22, '#ff5f5f');

  if (lives <= 0) {
    state = STATE.GAMEOVER;
    gameOverTime = 0;
    traffic.length = 0;
    saveHiScore();
  }
}

function checkCollisions(prevZ, newZ) {
  const startIdx = Math.floor(prevZ / SEGMENT_LENGTH) - 1;
  const endIdx = Math.floor(newZ / SEGMENT_LENGTH) + 1;

  for (let i = startIdx; i <= endIdx; i++) {
    const seg = segments.get(i);
    if (!seg) continue;

    for (const s of seg.sprites) {
      if (s.decor || s.collected || s.hit) continue;

      const spriteZ = i * SEGMENT_LENGTH;
      if (spriteZ < prevZ - 110 || spriteZ > newZ + 110) continue;

      const dx = Math.abs(playerX - s.offset);

      if (s.type === 'coin' || s.type === 'bigcoin') {
        if (dx < (s.type === 'bigcoin' ? 0.42 : 0.34)) {
          collectCoin(s);
        }
      } else {
        let hitW = 0.22;
        if (s.type === 'car') hitW = 0.32;
        else if (s.type === 'barrier') hitW = 0.30;

        if (dx < hitW) {
          s.hit = true;
          crash();
        }
      }
    }
  }

  // NPC 車碰撞
  for (const car of traffic) {
    if (car.z > prevZ - 220 && car.z < newZ + 220) {
      const dx = Math.abs(playerX - car.offset);
      if (dx < 0.29 && invincible <= 0) {
        car.speed = currentBaseSpeed * 1.2;
        crash();
      }
    }
  }
}

/* ============================
   更新邏輯
============================ */
function updateGame(dt) {
  const prevPlayerZ = position + PLAYER_Z;

  const ramp = Math.min(currentBaseSpeed * 0.35, Math.floor(position / SEGMENT_LENGTH) * 2);
  const maxSpeed = currentBaseSpeed + ramp;
  const speedPercent = clamp(speed / currentBaseSpeed, 0, 1.4);

  // 轉向
  const steer = dt * 2.4 * speedPercent;
  if (input.left) playerX -= steer;
  if (input.right) playerX += steer;

  // 彎路離心力
  const pSegIdx = Math.floor((position + PLAYER_Z) / SEGMENT_LENGTH);
  const curve = getSegment(pSegIdx).curve;
  playerX -= curve * Math.pow(speed / maxSpeed, 2) * dt * 0.10;

  playerX = clamp(playerX, -2.2, 2.2);

  // 油門 / 煞車
  if (input.brake) {
    speed += BRAKE_FORCE * dt;
  } else {
    speed += currentAccel * dt;
  }

  // 路肩減速
  const offroadLimit = Math.max(2300, currentBaseSpeed * 0.24);
  if (playerX < -1 || playerX > 1) {
    if (speed > offroadLimit) speed += OFFROAD_DECEL * dt;
    shake = Math.max(shake, 0.07);
  }

  speed = clamp(speed, 0, maxSpeed);
  position += speed * dt;

  const newPlayerZ = position + PLAYER_Z;

  // 分數
  score += speed * dt * 0.006;
  if (score > hiScore) hiScore = Math.floor(score);

  // Combo
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) combo = 0;
  }

  if (invincible > 0) invincible -= dt;
  if (goFlash > 0) goFlash -= dt;

  // NPC 車
  trafficTimer -= dt;
  if (trafficTimer <= 0) {
    spawnTraffic();
    trafficTimer = Math.max(
      diff.trafficTimerMin,
      diff.trafficTimerBase - (speed / maxSpeed) * 0.55
    );
  }

  for (let i = traffic.length - 1; i >= 0; i--) {
    const car = traffic[i];
    car.z += car.speed * dt;

    if (car.z < position - 800 || car.z > position + DRAW_DISTANCE * SEGMENT_LENGTH * 1.7) {
      traffic.splice(i, 1);
    }
  }

  checkCollisions(prevPlayerZ, newPlayerZ);
  cleanupSegments(Math.floor(position / SEGMENT_LENGTH));
}

function update(dt) {
  time += dt;

  if (shake > 0) shake -= dt;
  if (coinFlash > 0) coinFlash -= dt;

  updateParticles(dt);

  if (state === STATE.MENU) {
    speed = currentBaseSpeed * 0.35;
    position += speed * dt;
    playerX = Math.sin(time * 0.5) * 0.4;
    cleanupSegments(Math.floor(position / SEGMENT_LENGTH));

  } else if (state === STATE.COUNTDOWN) {
    countdown -= dt;
    const c = Math.ceil(Math.max(0, countdown));

    if (c !== lastCountdown && c > 0) {
      lastCountdown = c;
      sfxCount();
    }

    if (countdown <= 0) {
      state = STATE.PLAYING;
      goFlash = 0.8;
      sfxGo();
    }

  } else if (state === STATE.PLAYING) {
    updateGame(dt);

  } else if (state === STATE.GAMEOVER) {
    gameOverTime += dt;
    speed = Math.max(0, speed - 8000 * dt);
    position += speed * dt;
    cleanupSegments(Math.floor(position / SEGMENT_LENGTH));
  }
}

/* ============================
   繪圖：背景 / 道路 / 物件
============================ */
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.62);
  grad.addColorStop(0, '#080414');
  grad.addColorStop(0.55, '#2c1152');
  grad.addColorStop(1, '#ff4f7d');

  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H * 0.62);

  // 星星
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 36; i++) {
    const sx = (i * 89 + 37) % W;
    const sy = (i * 47 + 11) % (H * 0.32);
    if (((time * 2 + i) % 5) > 0.4) {
      ctx.fillRect(sx, sy, 1, 1);
    }
  }

  // 太陽 / 霓虹落日
  const sunX = W * 0.5 - playerX * 24 - Math.sin(time * 0.05) * 6;
  const sunY = 78;

  ctx.fillStyle = '#ffcf5e';
  ctx.beginPath();
  ctx.arc(sunX, sunY, 20, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,110,140,0.35)';
  ctx.fillRect(0, sunY + 14, W, 3);
  ctx.fillRect(0, sunY + 22, W, 2);

  // 城市天際線
  const baseX = Math.floor(position * 0.002 + playerX * 20);
  ctx.fillStyle = '#160b2b';

  for (let i = 0; i < 22; i++) {
    const bx = ((i * 53 - baseX) % (W + 80) + (W + 80)) % (W + 80) - 40;
    const bh = 18 + ((i * 71) % 42);
    const bw = 14 + ((i * 29) % 18);
    ctx.fillRect(bx, H * 0.56 - bh, bw, bh);
  }

  ctx.fillStyle = '#0d061c';
  ctx.fillRect(0, H * 0.56, W, H * 0.12);
}

function poly(x1, y1, x2, y2, x3, y3, x4, y4, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineTo(x3, y3);
  ctx.lineTo(x4, y4);
  ctx.closePath();
  ctx.fill();
}

function renderSegment(seg, idx) {
  const p1 = seg.p1.screen;
  const p2 = seg.p2.screen;

  const alt = Math.floor(idx / 3) % 2;
  const grass = alt ? '#0f7f3e' : '#0d6f36';
  const road = alt ? '#484850' : '#43434b';
  const rumble = Math.floor(idx / 6) % 2 ? '#c22a2a' : '#e8e8e8';

  // 草地
  ctx.fillStyle = grass;
  ctx.fillRect(0, p2.y, W, p1.y - p2.y);

  // 路邊紅白邊
  const r1 = p1.w * 1.15;
  const r2 = p2.w * 1.15;
  poly(p1.x - r1, p1.y, p1.x + r1, p1.y, p2.x + r2, p2.y, p2.x - r2, p2.y, rumble);

  // 路面
  poly(p1.x - p1.w, p1.y, p1.x + p1.w, p1.y, p2.x + p2.w, p2.y, p2.x - p2.w, p2.y, road);

  // 車道線
  if (alt === 0) {
    const lw1 = Math.max(1, p1.w * 0.015);
    const lw2 = Math.max(1, p2.w * 0.015);

    const a1 = p1.x - p1.w / 3;
    const a2 = p2.x - p2.w / 3;
    const b1 = p1.x + p1.w / 3;
    const b2 = p2.x + p2.w / 3;

    poly(a1 - lw1, p1.y, a1 + lw1, p1.y, a2 + lw2, p2.y, a2 - lw2, p2.y, '#d9d9e2');
    poly(b1 - lw1, p1.y, b1 + lw1, p1.y, b2 + lw2, p2.y, b2 - lw2, p2.y, '#d9d9e2');
  }

  // 路邊金黃邊線
  const e1 = Math.max(1, p1.w * 0.02);
  const e2 = Math.max(1, p2.w * 0.02);
  poly(p1.x - p1.w - e1, p1.y, p1.x - p1.w + e1, p1.y, p2.x - p2.w + e2, p2.y, p2.x - p2.w - e2, p2.y, '#ffcf5e');
  poly(p1.x + p1.w - e1, p1.y, p1.x + p1.w + e1, p1.y, p2.x + p2.w + e2, p2.y, p2.x + p2.w - e2, p2.y, '#ffcf5e');
}

function drawCoin(cx, bottomY, w, h, seed) {
  const spin = 0.3 + 0.7 * Math.abs(Math.sin(time * 6 + seed));
  const rw = Math.max(1, w * 0.5 * spin);
  const cy = bottomY - h / 2;

  ctx.fillStyle = '#8a5b00';
  ctx.fillRect(cx - rw, cy - h * 0.42, rw * 2, h * 0.84);

  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(cx - rw * 0.82, cy - h * 0.34, rw * 1.64, h * 0.68);

  ctx.fillStyle = '#fff0a8';
  ctx.fillRect(cx - rw * 0.35, cy - h * 0.18, rw * 0.7, h * 0.36);
}

function drawCone(cx, bottomY, w, h) {
  ctx.fillStyle = '#ff7a1a';
  ctx.beginPath();
  ctx.moveTo(cx - w / 2, bottomY);
  ctx.lineTo(cx + w / 2, bottomY);
  ctx.lineTo(cx, bottomY - h);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.fillRect(cx - w * 0.22, bottomY - h * 0.45, w * 0.44, h * 0.14);
}

function drawBarrier(cx, bottomY, w, h) {
  const x = cx - w / 2;
  const y = bottomY - h;

  ctx.fillStyle = '#b02020';
  ctx.fillRect(x, y, w, h * 0.62);

  ctx.fillStyle = '#fff';
  const stripes = 4;
  const sw = w / stripes;
  for (let i = 0; i < stripes; i += 2) {
    ctx.fillRect(x + i * sw, y, sw, h * 0.62);
  }

  ctx.fillStyle = '#444';
  ctx.fillRect(cx - w * 0.35, bottomY - h * 0.38, w * 0.08, h * 0.38);
  ctx.fillRect(cx + w * 0.27, bottomY - h * 0.38, w * 0.08, h * 0.38);
}

function drawTree(cx, bottomY, w, h) {
  const x = cx - w / 2;
  const y = bottomY - h;

  ctx.fillStyle = '#5b3b1e';
  ctx.fillRect(cx - w * 0.08, bottomY - h * 0.42, w * 0.16, h * 0.42);

  ctx.fillStyle = '#0f8f3f';
  ctx.fillRect(x, y + h * 0.1, w, h * 0.42);
  ctx.fillRect(x + w * 0.12, y, w * 0.76, h * 0.28);
}

function drawLamp(cx, bottomY, w, h) {
  ctx.fillStyle = '#59606f';
  ctx.fillRect(cx - w * 0.05, bottomY - h, w * 0.1, h);

  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(cx - w * 0.28, bottomY - h, w * 0.56, h * 0.08);
}

function drawCarSprite(cx, bottomY, w, h, color, isPlayer) {
  const x = cx - w / 2;
  const y = bottomY - h;

  // 車輪
  ctx.fillStyle = '#111';
  ctx.fillRect(x, y + h * 0.68, w * 0.18, h * 0.32);
  ctx.fillRect(x + w * 0.82, y + h * 0.68, w * 0.18, h * 0.32);

  // 車身
  ctx.fillStyle = color;
  ctx.fillRect(x + w * 0.06, y + h * 0.20, w * 0.88, h * 0.66);

  // 車頂 / 擋風
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.fillRect(x + w * 0.16, y, w * 0.68, h * 0.30);

  ctx.fillStyle = '#1d2430';
  ctx.fillRect(x + w * 0.20, y + h * 0.08, w * 0.60, h * 0.26);

  // 尾燈
  ctx.fillStyle = '#ff4d4d';
  ctx.fillRect(x + w * 0.12, y + h * 0.42, w * 0.16, h * 0.12);
  ctx.fillRect(x + w * 0.72, y + h * 0.42, w * 0.16, h * 0.12);

  if (isPlayer) {
    ctx.fillStyle = '#111';
    ctx.fillRect(x + w * 0.02, y, w * 0.96, h * 0.12);
  }
}

function renderSegmentSprites(seg) {
  const p = seg.p1.screen;
  if (p.scale <= 0) return;

  for (const s of seg.sprites) {
    if (s.collected || s.hit) continue;

    const scale = p.scale;
    const x = p.x + s.offset * p.w;
    const y = p.y;

    const w = s.w * scale * W / 2;
    const h = s.h * scale * W / 2;

    if (w < 0.7 || y < -100 || x < -100 || x > W + 100) continue;

    if (s.type === 'coin' || s.type === 'bigcoin') {
      drawCoin(x, y, w, h, seg.index);
    } else if (s.type === 'cone') {
      drawCone(x, y, w, h);
    } else if (s.type === 'barrier') {
      drawBarrier(x, y, w, h);
    } else if (s.type === 'car') {
      drawCarSprite(x, y, w, h, '#8a8f9c', false);
    } else if (s.type === 'tree') {
      drawTree(x, y, w, h);
    } else if (s.type === 'lamp') {
      drawLamp(x, y, w, h);
    }
  }
}

function renderTrafficCar(seg, car) {
  const idx = seg.index;
  const percent = (car.z - idx * SEGMENT_LENGTH) / SEGMENT_LENGTH;
  if (percent < 0 || percent > 1) return;

  const camX = lerp(seg.camX1, seg.camX2, percent);
  const worldY = lerp(seg.p1.world.y, seg.p2.world.y, percent);

  const p = {
    world: { x: car.offset * ROAD_WIDTH, y: worldY, z: car.z },
    camera: {},
    screen: {}
  };

  project(p, camX, currentCameraY, position);

  if (p.camera.z <= CAMERA_DEPTH) return;

  const scale = p.screen.scale;
  const w = car.w * scale * W / 2;
  const h = car.h * scale * W / 2;

  if (w < 1) return;
  if (p.screen.y < -100 || p.screen.x < -100 || p.screen.x > W + 100) return;

  drawCarSprite(p.screen.x, p.screen.y, w, h, car.color, false);
}

function drawPlayer() {
  if (state === STATE.PLAYING && invincible > 0 && Math.floor(time * 12) % 2 === 0) {
    return;
  }

  const bounce = (state === STATE.PLAYING ? speed / currentBaseSpeed : 0.3) * Math.sin(time * 28) * 1.2;
  const x = W / 2 + playerX * 88;
  const y = H - 16 + bounce;
  const w = 72;
  const h = 34;

  drawCarSprite(x, y, w, h, '#ff3b3b', true);
}

/* ============================
   HUD / Game Over
============================ */
function drawText(txt, x, y, size, color, align) {
  ctx.font = 'bold ' + size + 'px monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';

  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillText(txt, x + 1, y + 1);

  ctx.fillStyle = color;
  ctx.fillText(txt, x, y);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(5,2,12,0.62)';
  ctx.fillRect(0, 0, W, H);

  drawText('GAME OVER', W / 2, 68, 30, '#ff5f5f', 'center');
  drawText('分數 ' + formatInt(score), W / 2, 116, 12, '#fff', 'center');
  drawText('金幣 ' + coins, W / 2, 134, 10, '#ffd23f', 'center');
  drawText('距離 ' + formatInt(position / 20) + 'm', W / 2, 150, 10, '#9fe8ff', 'center');
  drawText('最高分 ' + hiScore, W / 2, 168, 10, '#ffd23f', 'center');

  if (gameOverTime > 0.8) {
    drawText('Space 再戰', W / 2, 194, 9, '#fff', 'center');
    drawText('點擊／其他鍵返回選單', W / 2, 208, 8, '#9fe8ff', 'center');
  }
}

function drawHUD() {
  if (state === STATE.MENU) return;

  drawText('SCORE ' + formatInt(score), 8, 6, 10, '#fff');
  drawText('HI ' + Math.max(hiScore, Math.floor(score)), 8, 18, 8, '#ffd23f');

  drawText('COIN x' + coins, W - 8, 6, 10, '#ffd23f', 'right');
  drawText('距離 ' + formatInt(position / 20) + 'm', W - 8, 18, 8, '#9fe8ff', 'right');

  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < lives ? '#ff4d6d' : '#3a2430';
    ctx.fillRect(8 + i * 14, 32, 10, 8);
  }

  drawText(Math.floor(speed / 40) + ' km/h', W - 8, H - 16, 10, '#fff', 'right');
  drawText('難度：' + diff.name, 8, H - 16, 8, diff.color);

  if (combo > 1 && comboTimer > 0) {
    drawText('COMBO x' + Math.min(combo, 10), W / 2, 26, 10, '#7dff9f', 'center');
  }

  if (coinFlash > 0) {
    ctx.fillStyle = 'rgba(255,220,80,' + Math.min(0.28, coinFlash * 2) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  if (state === STATE.COUNTDOWN) {
    const c = Math.ceil(Math.max(0, countdown));
    if (c > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, 0, W, H);

      drawText(String(c), W / 2, H / 2 - 44, 48, '#ffd23f', 'center');
      drawText('準備...', W / 2, H / 2 + 16, 10, '#fff', 'center');
    }
  }

  if (state === STATE.PLAYING && goFlash > 0) {
    drawText('GO!', W / 2, H / 2 - 42, 36, '#7dff9f', 'center');
  }

  if (state === STATE.GAMEOVER) {
    drawGameOver();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    drawText(p.text, p.x, p.y, 10, p.color, 'center');
    ctx.globalAlpha = 1;
  }
}

/* ============================
   主渲染
============================ */
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() * 4 - 2) | 0, (Math.random() * 4 - 2) | 0);
  }

  drawSky();

  const baseIndex = Math.floor(position / SEGMENT_LENGTH);
  const baseSegment = getSegment(baseIndex);
  const basePercent = (position % SEGMENT_LENGTH) / SEGMENT_LENGTH;

  const playerSegIndex = Math.floor((position + PLAYER_Z) / SEGMENT_LENGTH);
  const playerSegment = getSegment(playerSegIndex);
  const playerPercent = ((position + PLAYER_Z) % SEGMENT_LENGTH) / SEGMENT_LENGTH;
  const playerY = lerp(playerSegment.p1.world.y, playerSegment.p2.world.y, playerPercent);

  const cameraY = playerY + CAMERA_HEIGHT;
  currentCameraY = cameraY;

  let maxy = H;
  let x = 0;
  let dx = -(baseSegment.curve * basePercent);

  // 將 NPC 車分桶到路段
  const carBuckets = new Map();
  for (const car of traffic) {
    const idx = Math.floor(car.z / SEGMENT_LENGTH);
    if (idx >= baseIndex && idx < baseIndex + DRAW_DISTANCE) {
      if (!carBuckets.has(idx)) carBuckets.set(idx, []);
      carBuckets.get(idx).push(car);
    }
  }

  for (let n = 0; n < DRAW_DISTANCE; n++) {
    const idx = baseIndex + n;
    const seg = getSegment(idx);

    seg.clip = maxy;

    const camX1 = playerX * ROAD_WIDTH - x;
    const camX2 = playerX * ROAD_WIDTH - x - dx;

    project(seg.p1, camX1, cameraY, position);
    project(seg.p2, camX2, cameraY, position);

    seg.camX1 = camX1;
    seg.camX2 = camX2;

    x += dx;
    dx += seg.curve;

    if (
      seg.p1.camera.z <= CAMERA_DEPTH ||
      seg.p2.screen.y >= seg.p1.screen.y ||
      seg.p2.screen.y >= maxy
    ) {
      continue;
    }

    renderSegment(seg, idx);
    maxy = seg.p1.screen.y;

    renderSegmentSprites(seg);

    const cars = carBuckets.get(idx);
    if (cars) {
      for (const car of cars) {
        renderTrafficCar(seg, car);
      }
    }
  }

  drawPlayer();
  drawParticles();

  ctx.restore();

  drawHUD();
}

/* ============================
   輸入：鍵盤
============================ */
window.addEventListener('keydown', (e) => {
  initAudio();

  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
    e.preventDefault();
  }

  if (state === STATE.MENU) {
    if (e.repeat) return;

    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      setDifficulty(difficultyIndex - 1);
      return;
    }

    if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      setDifficulty(difficultyIndex + 1);
      return;
    }

    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      startGame();
      return;
    }

    return;
  }

  if (state === STATE.GAMEOVER) {
    if (!e.repeat && gameOverTime > 0.8) {
      if (e.code === 'Space' || e.code === 'Enter') {
        startGame();
      } else {
        backToMenu();
      }
    }
    return;
  }

  switch (e.code) {
    case 'ArrowLeft':
    case 'KeyA':
      input.left = true;
      break;

    case 'ArrowRight':
    case 'KeyD':
      input.right = true;
      break;

    case 'ArrowDown':
    case 'KeyS':
      input.brake = true;
      break;
  }
});

window.addEventListener('keyup', (e) => {
  switch (e.code) {
    case 'ArrowLeft':
    case 'KeyA':
      input.left = false;
      break;

    case 'ArrowRight':
    case 'KeyD':
      input.right = false;
      break;

    case 'ArrowDown':
    case 'KeyS':
      input.brake = false;
      break;
  }
});

/* ============================
   輸入：觸控 / 滑鼠按鈕
============================ */
function bindControl(id, prop) {
  const el = document.getElementById(id);

  const down = (e) => {
    e.preventDefault();
    initAudio();

    if (state === STATE.GAMEOVER && gameOverTime > 0.8) {
      backToMenu();
      return;
    }

    if (state === STATE.MENU) return;

    input[prop] = true;
  };

  const up = (e) => {
    e.preventDefault();
    input[prop] = false;
  };

  el.addEventListener('touchstart', down, { passive: false });
  el.addEventListener('touchend', up, { passive: false });
  el.addEventListener('touchcancel', up, { passive: false });

  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);

  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

bindControl('btnLeft', 'left');
bindControl('btnRight', 'right');
bindControl('btnBrake', 'brake');

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();

  if (state === STATE.GAMEOVER && gameOverTime > 0.8) {
    backToMenu();
  }
});

/* ============================
   主循環
============================ */
function frame(t) {
  requestAnimationFrame(frame);

  if (!lastTime) lastTime = t;
  let dt = (t - lastTime) / 1000;
  lastTime = t;

  if (dt <= 0) return;
  dt = Math.min(0.033, dt);

  update(dt);
  render();
}
